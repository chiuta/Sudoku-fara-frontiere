de: `<p><b>Sudoku ohne Grenzen</b> ist ein Atlas von Sudoku-Varianten mit Generator und Löser, die lokal in einer einzigen HTML-Datei laufen. Es gibt kein Konto, nichts wird über das Netz gesendet, und es werden keine externen Ressourcen geladen. Der Spielstand bleibt nur in diesem Browser gespeichert (Schlüssel <code>sff_*</code> in <code>localStorage</code>).</p>
<h3>Funktionsweise</h3><p>Die Engine wählt zuerst ein gelöstes Gitter, das die Regeln der Variante erfüllt, leitet daraus die Hinweise ab (Käfige, Thermometer, Punkte usw.) und entfernt dann die Vorgaben nacheinander, solange ein propagierender Löser beweist, dass die Lösung eindeutig bleibt. Ein erzeugtes Rätsel hat also genau eine Lösung. Derselbe Code erzeugt in derselben App-Version dasselbe Rätsel.</p>
<h3>Grenzen</h3><ul><li>Die Schwierigkeit ist nur ein Richtwert: Sie hängt von der Zahl der Vorgaben ab, nicht von den nötigen logischen Techniken.</li><li>„Schwer“ entfernt so viele Vorgaben wie möglich; bei Varianten mit vielen Gitterhinweisen können sehr wenige Ziffern übrig bleiben.</li><li>Die Regeln folgen den üblichen Konventionen jeder Variante; wo es mehrere gibt, nennt die Karte die gewählte.</li><li>Gitter mit 16×16 und 25×25 verwenden die Symbole 1–9 und Buchstaben; zusammengesetzte Gitter (Samurai usw.) tragen nur die klassischen Regeln, und sehr überladene Kombinationen können länger dauern oder scheitern.</li><li>Tipp und „Schritt für Schritt“ nutzen Kandidatenlogik (einzige Ziffer im Feld, einziges Feld in Zeile/Spalte/Gebiet, Variantenregeln); gibt es keinen direkten Schritt, decken sie eine Ziffer der Lösung auf und sagen es dazu.</li></ul>
<h3>Spielmodi</h3><ul><li><b>Orb</b>: Sichtbar sind nur Felder höchstens 2 Schritte von der Auswahl entfernt.</li><li><b>Gedächtnis</b>: Die Vorgaben werden einige Sekunden gezeigt und dann verborgen; „Spähen“ kostet 30 s. Keine Tipps und keine Hervorhebung von Konflikten.</li><li><b>Marathon</b>: 5 Rätsel hintereinander (leicht, leicht, mittel, mittel, schwer) mit Gesamtzeit.</li><li><b>Duell</b>: Ein Uhr-Gegner füllt alle paar Sekunden ein Feld (er kopiert die bekannte Lösung, ohne Logik); ist er zuerst fertig, verlieren Sie.</li><li><b>Hardcore</b>: 3 Leben, jede falsche Ziffer kostet eines; kein Tipp, keine Prüfung, keine Auto-Notizen.</li><li><b>Rätsel des Tages</b>: dasselbe Rätsel für alle an einem Tag (UTC-Datum), mit einer lokal gespeicherten Serie aufeinanderfolgender Tage.</li><li><b>Klang</b>: Jede Ziffer hat einen Ton; eine vollständige Zeile, Spalte oder ein Block spielt ein Arpeggio.</li></ul>
<h3>Tastenkürzel</h3><p>Ziffern/Buchstaben: eintragen · <kbd>N</kbd>: Notizen · <kbd>Backspace</kbd>: löschen · Pfeile: bewegen · <kbd>Umschalt</kbd>/<kbd>Strg</kbd>+Klick: Mehrfachauswahl · <kbd>Strg</kbd>+<kbd>Z</kbd>/<kbd>Y</kbd>: rückgängig/wiederholen.</p>
<p class="small">Ein persönliches Projekt, kein offizieller Dienst. Lizenz: MIT (Code, Texte und Screenshots), © 2026 Alexandru-Ionuț Chiuță. Der vollständige Text steht in der Datei LICENSE.</p>`,
hu: `<p>A <b>Sudoku határok nélkül</b> a Sudoku-változatok atlasza, helyben futó generátorral és megoldóval, egyetlen HTML-fájlban. Nincs fiók, semmit nem küld a hálózaton, és nem tölt be külső erőforrást. A játékállás csak ebben a böngészőben tárolódik (<code>sff_*</code> kulcsok a <code>localStorage</code>-ban).</p>
<h3>Hogyan működik</h3><p>A motor először kiválaszt egy megoldott rácsot, amely megfelel a változat szabályainak, ebből levezeti a támpontokat (ketreceket, hőmérőket, pontokat stb.), majd egyenként elhagyja az adott számjegyeket, amíg egy propagáló megoldó bizonyítja, hogy a megoldás egyértelmű marad. Egy előállított rejtvénynek tehát pontosan egy megoldása van. Ugyanaz a kód az alkalmazás ugyanazon verziójában ugyanazt a rejtvényt állítja elő.</p>
<h3>Korlátok</h3><ul><li>A nehézség tájékoztató jellegű: az adott számjegyek számától függ, nem a szükséges logikai technikáktól.</li><li>A „nehéz” szint annyi számjegyet hagy el, amennyit csak lehet; a sok rácstámpontú változatoknál nagyon kevés adott számjegy maradhat.</li><li>A szabályok az egyes változatok szokásos megállapodásait követik; ahol több is van, a kártya megmondja, melyiket választottuk.</li><li>A 16×16-os és 25×25-ös rácsok az 1–9 számjegyeket és betűket használnak; az összetett rácsok (Szamuráj stb.) csak a klasszikus szabályokat viselik, a nagyon megterhelő kombinációk tovább tarthatnak vagy sikertelenek lehetnek.</li><li>A tipp és a „Lépésről lépésre” jelöltlogikát használ (egyetlen számjegy egy cellában, egyetlen cella egy sorban/oszlopban/tartományban, változatszabályok); ha nincs közvetlen lépés, felfednek egy számjegyet a megoldásból, és ezt jelzik.</li></ul>
<h3>Játékmódok</h3><ul><li><b>Gömb</b>: csak a kijelöléstől legfeljebb 2 lépésre lévő cellák láthatók.</li><li><b>Memória</b>: az adott számjegyek néhány másodpercig látszanak, aztán elrejtődnek; a „Nézd” 30 mp-be kerül. Nincs tipp és nincs ütközéskiemelés.</li><li><b>Maraton</b>: 5 rejtvény egymás után (könnyű, könnyű, közepes, közepes, nehéz) összidővel.</li><li><b>Párbaj</b>: egy órás ellenfél néhány másodpercenként kitölt egy cellát (az ismert megoldást másolja, logika nélkül); ha ő végez előbb, te veszítesz.</li><li><b>Hardcore</b>: 3 élet, minden hibás számjegy egyet elvesz; nincs tipp, ellenőrzés vagy automatikus jegyzet.</li><li><b>A nap rejtvénye</b>: ugyanaz a rejtvény mindenkinek egy adott napon (UTC-dátum), az egymást követő napok sorozatát helyben tároljuk.</li><li><b>Hangalapú</b>: minden számjegynek van egy hangja; egy kész sor, oszlop vagy blokk arpeggiót szólaltat meg.</li></ul>
<h3>Billentyűparancsok</h3><p>Számjegyek/betűk: kitöltés · <kbd>N</kbd>: jegyzetek · <kbd>Backspace</kbd>: törlés · nyilak: mozgás · <kbd>Shift</kbd>/<kbd>Ctrl</kbd>+kattintás: többszörös kijelölés · <kbd>Ctrl</kbd>+<kbd>Z</kbd>/<kbd>Y</kbd>: visszavonás/ismétlés.</p>

var VTX = {"clasic":[["Classique","Ligne, colonne, bloc : chaque chiffre une fois.","Remplissez la grille pour que chaque ligne, chaque colonne et chaque bloc contienne exactement une fois chaque chiffre. Tailles : 4×4 (mini), 6×6 (blocs 2×3), 8×8 (2×4), 9×9, 12×12 (3×4), 16×16 (symboles 1–9 et A–G) et 25×25 (1–9 et A–P)."],["Classico","Riga, colonna, riquadro: ogni cifra una volta.","Riempi la griglia in modo che ogni riga, ogni colonna e ogni riquadro contenga esattamente una volta ogni cifra. Dimensioni: 4×4 (mini), 6×6 (riquadri 2×3), 8×8 (2×4), 9×9, 12×12 (3×4), 16×16 (simboli 1–9 e A–G) e 25×25 (1–9 e A–P)."],["Clásico","Fila, columna, caja: cada dígito una vez.","Rellena la cuadrícula de modo que cada fila, cada columna y cada caja contenga exactamente una vez cada dígito. Tamaños: 4×4 (mini), 6×6 (cajas 2×3), 8×8 (2×4), 9×9, 12×12 (3×4), 16×16 (símbolos 1–9 y A–G) y 25×25 (1–9 y A–P)."],["Clássico","Linha, coluna, caixa: cada algarismo uma vez.","Preencha a grelha de modo que cada linha, cada coluna e cada caixa contenha exatamente uma vez cada algarismo. Tamanhos: 4×4 (mini), 6×6 (caixas 2×3), 8×8 (2×4), 9×9, 12×12 (3×4), 16×16 (símbolos 1–9 e A–G) e 25×25 (1–9 e A–P)."],["Klassisch","Zeile, Spalte, Block: jede Ziffer einmal.","Füllen Sie das Gitter so aus, dass jede Zeile, jede Spalte und jeder Block jede Ziffer genau einmal enthält. Größen: 4×4 (Mini), 6×6 (Blöcke 2×3), 8×8 (2×4), 9×9, 12×12 (3×4), 16×16 (Symbole 1–9 und A–G) und 25×25 (1–9 und A–P)."],["Klasszikus","Sor, oszlop, blokk: minden számjegy egyszer.","Töltsd ki a rácsot úgy, hogy minden sor, minden oszlop és minden blokk pontosan egyszer tartalmazza az összes számjegyet. Méretek: 4×4 (mini), 6×6 (2×3-as blokkok), 8×8 (2×4), 9×9, 12×12 (3×4), 16×16 (1–9 és A–G jelek) és 25×25 (1–9 és A–P)."]],"wordoku":[[null,"Des lettres à la place des chiffres.","Le même jeu que le Classique, mais avec des lettres. En 9×9, vous pouvez choisir comme symboles n’importe quel mot de 9 lettres distinctes."],[null,"Lettere al posto delle cifre.","Lo stesso gioco del Classico, ma con le lettere. Nel 9×9 puoi scegliere come simboli una parola qualsiasi di 9 lettere distinte."],[null,"Letras en lugar de dígitos.","El mismo juego que el Clásico, pero con letras. En 9×9 puedes elegir como símbolos cualquier palabra de 9 letras distintas."],[null,"Letras em vez de algarismos.","O mesmo jogo do Clássico, mas com letras. Em 9×9 pode escolher como símbolos qualquer palavra de 9 letras distintas."],[null,"Buchstaben statt Ziffern.","Dasselbe Spiel wie Klassisch, aber mit Buchstaben. Bei 9×9 können Sie als Symbole ein beliebiges Wort aus 9 verschiedenen Buchstaben wählen."],[null,"Betűk számjegyek helyett.","Ugyanaz a játék, mint a Klasszikus, de betűkkel. 9×9-es rácson jelként bármilyen 9 különböző betűből álló szót választhatsz."]],"latin":[["Carré latin","Lignes et colonnes seulement, sans blocs.","Chaque ligne et chaque colonne contient une fois chaque chiffre ; il n’y a pas de blocs. Tailles 4–9."],["Quadrato latino","Solo righe e colonne, senza riquadri.","Ogni riga e ogni colonna contiene ogni cifra una volta; non ci sono riquadri. Dimensioni 4–9."],["Cuadrado latino","Solo filas y columnas, sin cajas.","Cada fila y cada columna contiene cada dígito una vez; no hay cajas. Tamaños 4–9."],["Quadrado latino","Só linhas e colunas, sem caixas.","Cada linha e cada coluna contém cada algarismo uma vez; não há caixas. Tamanhos 4–9."],["Lateinisches Quadrat","Nur Zeilen und Spalten, keine Blöcke.","Jede Zeile und jede Spalte enthält jede Ziffer einmal; es gibt keine Blöcke. Größen 4–9."],["Latin négyzet","Csak sorok és oszlopok, blokkok nélkül.","Minden sor és minden oszlop egyszer tartalmazza az összes számjegyet; blokkok nincsenek. Méretek: 4–9."]],"diag":[[null,"Plus les deux diagonales.","En plus des règles classiques, chacune des deux diagonales principales contient une fois chaque chiffre."],[null,"Più le due diagonali.","Oltre alle regole classiche, ciascuna delle due diagonali principali contiene ogni cifra una volta."],[null,"Más las dos diagonales.","Además de las reglas clásicas, cada una de las dos diagonales principales contiene cada dígito una vez."],[null,"Mais as duas diagonais.","Além das regras clássicas, cada uma das duas diagonais principais contém cada algarismo uma vez."],[null,"Plus beide Diagonalen.","Zusätzlich zu den klassischen Regeln enthält jede der beiden Hauptdiagonalen jede Ziffer einmal."],[null,"Plusz a két átló.","A klasszikus szabályokon túl a két főátló mindegyike egyszer tartalmazza az összes számjegyet."]],"hyper":[["Hyper (Windoku)","Quatre fenêtres 3×3 supplémentaires.","En plus des règles classiques, quatre fenêtres 3×3 supplémentaires (colorées) contiennent chacune une fois chaque chiffre. 9×9 uniquement."],["Hyper (Windoku)","Quattro finestre 3×3 aggiuntive.","Oltre alle regole classiche, quattro finestre 3×3 aggiuntive (colorate) contengono ciascuna ogni cifra una volta. Solo 9×9."],["Hyper (Windoku)","Cuatro ventanas 3×3 adicionales.","Además de las reglas clásicas, cuatro ventanas 3×3 adicionales (sombreadas) contienen cada una cada dígito una vez. Solo 9×9."],["Hyper (Windoku)","Quatro janelas 3×3 adicionais.","Além das regras clássicas, quatro janelas 3×3 adicionais (sombreadas) contêm cada uma cada algarismo uma vez. Só 9×9."],["Hyper (Windoku)","Vier zusätzliche 3×3-Fenster.","Zusätzlich zu den klassischen Regeln enthalten vier zusätzliche (farbig unterlegte) 3×3-Fenster jeweils jede Ziffer einmal. Nur 9×9."],["Hyper (Windoku)","Négy további 3×3-as ablak.","A klasszikus szabályokon túl négy további (színezett) 3×3-as ablak mindegyike egyszer tartalmazza az összes számjegyet. Csak 9×9."]],"jigsaw":[["Jigsaw (irrégulier)","Des régions irrégulières à la place des blocs carrés.","Les blocs sont des régions irrégulières de N cases chacune (contours épais). Chaque ligne, colonne et région contient une fois chaque chiffre. Chaque puzzle a des régions différentes."],["Jigsaw (irregolare)","Regioni irregolari al posto dei riquadri quadrati.","I riquadri sono regioni irregolari di N celle ciascuna (contorni spessi). Ogni riga, colonna e regione contiene ogni cifra una volta. Ogni puzzle ha regioni diverse."],["Jigsaw (irregular)","Regiones irregulares en lugar de cajas cuadradas.","Las cajas son regiones irregulares de N celdas cada una (contornos gruesos). Cada fila, columna y región contiene cada dígito una vez. Cada puzle tiene regiones distintas."],["Jigsaw (irregular)","Regiões irregulares em vez de caixas quadradas.","As caixas são regiões irregulares de N células cada (contornos grossos). Cada linha, coluna e região contém cada algarismo uma vez. Cada puzzle tem regiões diferentes."],["Jigsaw (unregelmäßig)","Unregelmäßige Gebiete statt quadratischer Blöcke.","Die Blöcke sind unregelmäßige Gebiete aus je N Feldern (dicke Umrandung). Jede Zeile, Spalte und jedes Gebiet enthält jede Ziffer einmal. Jedes Rätsel hat andere Gebiete."],["Jigsaw (szabálytalan)","Szabálytalan tartományok a négyzetes blokkok helyett.","A blokkok szabálytalan, egyenként N cellából álló tartományok (vastag körvonallal). Minden sor, oszlop és tartomány egyszer tartalmazza az összes számjegyet. Minden rejtvénynek más a tartománykiosztása."]],"dg":[["Groupes disjoints","Même position dans chaque bloc = un groupe.","En plus des règles classiques : toutes les cases situées à la même position dans leurs blocs (par exemple tous les coins en haut à gauche) contiennent une fois chaque chiffre."],["Gruppi disgiunti","Stessa posizione in ogni riquadro = un gruppo.","Oltre alle regole classiche: tutte le celle nella stessa posizione all’interno dei rispettivi riquadri (per esempio tutti gli angoli in alto a sinistra) contengono ogni cifra una volta."],["Grupos disjuntos","Misma posición en cada caja = un grupo.","Además de las reglas clásicas: todas las celdas que ocupan la misma posición dentro de sus cajas (por ejemplo, todas las esquinas superiores izquierdas) contienen cada dígito una vez."],["Grupos disjuntos","Mesma posição em cada caixa = um grupo.","Além das regras clássicas: todas as células na mesma posição dentro das respetivas caixas (por exemplo, todos os cantos superiores esquerdos) contêm cada algarismo uma vez."],["Disjunkte Gruppen","Gleiche Position in jedem Block = eine Gruppe.","Zusätzlich zu den klassischen Regeln: Alle Felder an derselben Position innerhalb ihrer Blöcke (zum Beispiel alle Ecken oben links) enthalten jede Ziffer einmal."],["Diszjunkt csoportok","Azonos pozíció minden blokkban = egy csoport.","A klasszikus szabályokon túl: a blokkjaikon belül azonos pozícióban álló cellák (például az összes bal felső sarok) egyszer tartalmazzák az összes számjegyet."]],"center":[["Points centraux","Les neuf centres de blocs sont tous différents.","En plus des règles classiques, les neuf cases centrales des blocs (marquées) contiennent une fois chaque chiffre. 9×9 uniquement."],["Punti centrali","I nove centri dei riquadri sono tutti diversi.","Oltre alle regole classiche, le nove celle centrali dei riquadri (segnate) contengono ogni cifra una volta. Solo 9×9."],["Puntos centrales","Los nueve centros de las cajas son todos distintos.","Además de las reglas clásicas, las nueve celdas centrales de las cajas (marcadas) contienen cada dígito una vez. Solo 9×9."],["Pontos centrais","Os nove centros das caixas são todos diferentes.","Além das regras clássicas, as nove células centrais das caixas (marcadas) contêm cada algarismo uma vez. Só 9×9."],["Mittelpunkte","Die neun Blockmitten sind alle verschieden.","Zusätzlich zu den klassischen Regeln enthalten die neun (markierten) Mittelfelder der Blöcke jede Ziffer einmal. Nur 9×9."],["Középpontok","A kilenc blokkközép mind különböző.","A klasszikus szabályokon túl a blokkok kilenc (jelölt) középső cellája egyszer tartalmazza az összes számjegyet. Csak 9×9."]],"antiknight":[["Anti-cavalier","Pas de chiffres égaux à un saut de cavalier.","En plus des règles classiques, deux cases séparées par un saut de cavalier des échecs ne peuvent pas contenir le même chiffre. 9×9 uniquement."],["Anti-cavallo","Nessuna cifra uguale a un salto di cavallo.","Oltre alle regole classiche, due celle a un salto di cavallo degli scacchi non possono contenere la stessa cifra. Solo 9×9."],["Anti-caballo","Sin dígitos iguales a un salto de caballo.","Además de las reglas clásicas, dos celdas separadas por un salto de caballo de ajedrez no pueden contener el mismo dígito. Solo 9×9."],["Anti-cavalo","Sem algarismos iguais a um salto de cavalo.","Além das regras clássicas, duas células separadas por um salto de cavalo de xadrez não podem conter o mesmo algarismo. Só 9×9."],["Anti-Springer","Keine gleichen Ziffern im Springerabstand.","Zusätzlich zu den klassischen Regeln dürfen zwei Felder im Abstand eines Schachspringerzugs nicht dieselbe Ziffer enthalten. Nur 9×9."],["Anti-huszár","Nincs egyforma számjegy huszárlépésnyire.","A klasszikus szabályokon túl két, sakkhuszár-lépésnyire lévő cella nem tartalmazhatja ugyanazt a számjegyet. Csak 9×9."]],"antiking":[["Anti-roi","Les voisins en diagonale diffèrent.","En plus des règles classiques, deux cases voisines en diagonale (mouvement du roi) ne peuvent pas contenir le même chiffre. 9×9 uniquement."],["Anti-re","I vicini in diagonale sono diversi.","Oltre alle regole classiche, due celle adiacenti in diagonale (mossa del re) non possono contenere la stessa cifra. Solo 9×9."],["Anti-rey","Los vecinos en diagonal son distintos.","Además de las reglas clásicas, dos celdas adyacentes en diagonal (movimiento de rey) no pueden contener el mismo dígito. Solo 9×9."],["Anti-rei","Os vizinhos na diagonal são diferentes.","Além das regras clássicas, duas células adjacentes na diagonal (movimento do rei) não podem conter o mesmo algarismo. Só 9×9."],["Anti-König","Diagonale Nachbarn sind verschieden.","Zusätzlich zu den klassischen Regeln dürfen zwei diagonal benachbarte Felder (Königszug) nicht dieselbe Ziffer enthalten. Nur 9×9."],["Anti-király","Az átlós szomszédok különböznek.","A klasszikus szabályokon túl két átlósan szomszédos cella (királylépés) nem tartalmazhatja ugyanazt a számjegyet. Csak 9×9."]],"nonconsec":[["Sans consécutifs","Les voisins ne sont jamais consécutifs.","En plus des règles classiques, deux cases adjacentes à l’horizontale ou à la verticale ne peuvent pas contenir des chiffres consécutifs (par exemple 4 à côté de 5). 9×9 et 6×6."],["Senza consecutivi","I vicini non sono mai consecutivi.","Oltre alle regole classiche, due celle adiacenti in orizzontale o in verticale non possono contenere cifre consecutive (per esempio 4 accanto a 5). 9×9 e 6×6."],["Sin consecutivos","Los vecinos nunca son consecutivos.","Además de las reglas clásicas, dos celdas adyacentes en horizontal o vertical no pueden contener dígitos consecutivos (por ejemplo, 4 junto a 5). 9×9 y 6×6."],["Sem consecutivos","Os vizinhos nunca são consecutivos.","Além das regras clássicas, duas células adjacentes na horizontal ou na vertical não podem conter algarismos consecutivos (por exemplo, 4 ao lado de 5). 9×9 e 6×6."],["Keine Nachbarzahlen","Nachbarn sind nie aufeinanderfolgend.","Zusätzlich zu den klassischen Regeln dürfen waagrecht oder senkrecht benachbarte Felder keine aufeinanderfolgenden Ziffern enthalten (zum Beispiel 4 neben 5). 9×9 und 6×6."],["Nincs egymást követő","A szomszédok sosem egymást követők.","A klasszikus szabályokon túl két vízszintesen vagy függőlegesen szomszédos cella nem tartalmazhat egymást követő számjegyeket (például 4 az 5 mellett). 9×9 és 6×6."]],"miracle":[["Miracle","Anti-cavalier + anti-roi + non consécutifs.","Les trois restrictions ci-dessus à la fois. La variante est extrêmement restrictive : les puzzles ont très peu de chiffres donnés."],["Miracolo","Anti-cavallo + anti-re + non consecutivi.","Tutte e tre le restrizioni precedenti insieme. La variante è estremamente restrittiva: i puzzle hanno pochissime cifre date."],["Milagro","Anti-caballo + anti-rey + no consecutivos.","Las tres restricciones anteriores a la vez. La variante es extremadamente restrictiva: los puzles tienen muy pocos dígitos dados."],["Milagre","Anti-cavalo + anti-rei + não consecutivos.","As três restrições anteriores em simultâneo. A variante é extremamente restritiva: os puzzles têm muito poucos algarismos dados."],["Wunder","Anti-Springer + Anti-König + nicht aufeinanderfolgend.","Alle drei obigen Einschränkungen gleichzeitig. Die Variante ist extrem restriktiv: Die Rätsel haben sehr wenige Vorgaben."],["Csoda","Anti-huszár + anti-király + nem egymást követők.","A fenti három megkötés egyszerre. A változat rendkívül szigorú: a rejtvényeknek nagyon kevés adott számjegyük van."]],"evenodd":[["Pair–impair","Carré = pair, cercle = impair.","Les cases marquées d’un carré contiennent des chiffres pairs, celles marquées d’un cercle des chiffres impairs. Les autres règles sont classiques."],["Pari–dispari","Quadrato = pari, cerchio = dispari.","Le celle segnate con un quadrato contengono cifre pari, quelle segnate con un cerchio cifre dispari. Le altre regole sono classiche."],["Par–impar","Cuadrado = par, círculo = impar.","Las celdas marcadas con un cuadrado contienen dígitos pares, las marcadas con un círculo dígitos impares. Las demás reglas son clásicas."],["Par–ímpar","Quadrado = par, círculo = ímpar.","As células marcadas com um quadrado contêm algarismos pares, as marcadas com um círculo algarismos ímpares. As restantes regras são clássicas."],["Gerade–ungerade","Quadrat = gerade, Kreis = ungerade.","Felder mit einem Quadrat enthalten gerade Ziffern, Felder mit einem Kreis ungerade Ziffern. Die übrigen Regeln sind klassisch."],["Páros–páratlan","Négyzet = páros, kör = páratlan.","A négyzettel jelölt cellák páros, a körrel jelöltek páratlan számjegyet tartalmaznak. A többi szabály klasszikus."]],"kropki":[[null,"Points : consécutifs ou double.","Un point blanc entre deux cases : les chiffres sont consécutifs. Un point noir : l’un est le double de l’autre. Pas de point : ils ne sont ni consécutifs ni dans le rapport 1:2 (tous les points sont donnés)."],[null,"Punti: consecutivi o doppio.","Un punto bianco tra due celle: le cifre sono consecutive. Un punto nero: una è il doppio dell’altra. Nessun punto: non sono né consecutive né in rapporto 1:2 (tutti i punti sono dati)."],[null,"Puntos: consecutivos o doble.","Un punto blanco entre dos celdas: los dígitos son consecutivos. Un punto negro: uno es el doble del otro. Sin punto: no son ni consecutivos ni están en razón 1:2 (se dan todos los puntos)."],[null,"Pontos: consecutivos ou dobro.","Um ponto branco entre duas células: os algarismos são consecutivos. Um ponto preto: um é o dobro do outro. Sem ponto: não são consecutivos nem estão na razão 1:2 (todos os pontos são dados)."],[null,"Punkte: aufeinanderfolgend oder doppelt.","Ein weißer Punkt zwischen zwei Feldern: Die Ziffern sind aufeinanderfolgend. Ein schwarzer Punkt: Eine ist das Doppelte der anderen. Kein Punkt: Sie sind weder aufeinanderfolgend noch im Verhältnis 1:2 (alle Punkte sind angegeben)."],[null,"Pontok: egymást követők vagy dupla.","Fehér pont két cella között: a számjegyek egymást követők. Fekete pont: az egyik a másik kétszerese. Nincs pont: nem egymást követők, és nem is 1:2 arányúak (minden pont meg van adva)."]],"consec":[["Consécutifs","Barre = consécutifs ; pas de barre = non.","Une barre entre deux cases signifie des chiffres consécutifs. Là où il n’y a pas de barre, les chiffres voisins ne sont pas consécutifs."],["Consecutivi","Barra = consecutivi; nessuna barra = no.","Una barra tra due celle significa cifre consecutive. Dove non c’è la barra, le cifre vicine non sono consecutive."],["Consecutivos","Barra = consecutivos; sin barra = no.","Una barra entre dos celdas significa dígitos consecutivos. Donde no hay barra, los dígitos vecinos no son consecutivos."],["Consecutivos","Barra = consecutivos; sem barra = não.","Uma barra entre duas células significa algarismos consecutivos. Onde não há barra, os algarismos vizinhos não são consecutivos."],["Aufeinanderfolgend","Balken = aufeinanderfolgend; kein Balken = nicht.","Ein Balken zwischen zwei Feldern bedeutet aufeinanderfolgende Ziffern. Wo kein Balken ist, sind benachbarte Ziffern nicht aufeinanderfolgend."],["Egymást követő","Rúd = egymást követők; nincs rúd = nem.","Két cella közti rúd egymást követő számjegyeket jelent. Ahol nincs rúd, a szomszédos számjegyek nem egymást követők."]],"xv":[[null,"X = somme 10, V = somme 5.","Un X entre deux cases : leur somme est 10 ; un V : leur somme est 5. Là où il n’y a pas de signe, la somme n’est ni 5 ni 10. 9×9 uniquement."],[null,"X = somma 10, V = somma 5.","Una X tra due celle: la loro somma è 10; una V: la loro somma è 5. Dove non c’è alcun segno, la somma non è né 5 né 10. Solo 9×9."],[null,"X = suma 10, V = suma 5.","Una X entre dos celdas: su suma es 10; una V: su suma es 5. Donde no hay signo, la suma no es ni 5 ni 10. Solo 9×9."],[null,"X = soma 10, V = soma 5.","Um X entre duas células: a sua soma é 10; um V: a sua soma é 5. Onde não há sinal, a soma não é nem 5 nem 10. Só 9×9."],[null,"X = Summe 10, V = Summe 5.","Ein X zwischen zwei Feldern: Ihre Summe ist 10; ein V: Ihre Summe ist 5. Wo kein Zeichen steht, ist die Summe weder 5 noch 10. Nur 9×9."],[null,"X = összeg 10, V = összeg 5.","Két cella közti X: az összegük 10; V: az összegük 5. Ahol nincs jel, az összeg sem 5, sem 10. Csak 9×9."]],"greater":[["Comparaisons","Signes plus grand / plus petit.","Le signe entre deux cases s’ouvre vers le chiffre le plus grand."],["Confronti","Segni di maggiore / minore.","Il segno tra due celle si apre verso la cifra più grande."],["Comparaciones","Signos de mayor / menor que.","El signo entre dos celdas se abre hacia el dígito mayor."],["Comparações","Sinais de maior / menor.","O sinal entre duas células abre-se para o algarismo maior."],["Vergleiche","Größer-/Kleiner-Zeichen.","Das Zeichen zwischen zwei Feldern öffnet sich zur größeren Ziffer hin."],["Összehasonlítások","Nagyobb / kisebb jelek.","A két cella közti jel a nagyobb számjegy felé nyílik."]],"batt":[["Battenberg","Parité en damier sur un 2×2.","Une marque à quatre carrés au coin commun à quatre cases signifie que les parités alternent comme sur un échiquier (deux pairs et deux impairs, sur les diagonales). Aux coins non marqués, les parités ne forment pas un tel motif."],["Battenberg","Parità a scacchiera su un 2×2.","Un segno a quattro quadrati nell’angolo comune a quattro celle significa che le parità si alternano come su una scacchiera (due pari e due dispari, sulle diagonali). Negli angoli senza segno le parità non formano questo schema."],["Battenberg","Paridad de tablero de ajedrez en un 2×2.","Una marca de cuatro cuadrados en la esquina compartida por cuatro celdas significa que las paridades se alternan como en un tablero de ajedrez (dos pares y dos impares, en las diagonales). En las esquinas sin marca las paridades no forman ese patrón."],["Battenberg","Paridade de tabuleiro de xadrez num 2×2.","Uma marca de quatro quadrados no canto partilhado por quatro células significa que as paridades se alternam como num tabuleiro de xadrez (dois pares e dois ímpares, nas diagonais). Nos cantos sem marca, as paridades não formam esse padrão."],["Battenberg","Schachbrett-Parität auf einem 2×2.","Eine Vier-Quadrate-Markierung an der Ecke, die vier Felder gemeinsam haben, bedeutet, dass die Paritäten wie auf einem Schachbrett wechseln (zwei gerade und zwei ungerade, jeweils auf den Diagonalen). An unmarkierten Ecken bilden die Paritäten kein solches Muster."],["Battenberg","Sakktábla-paritás egy 2×2-n.","Négy cella közös sarkánál lévő négynégyzetes jel azt jelenti, hogy a paritások sakktáblaszerűen váltakoznak (két páros és két páratlan, az átlókon). A jelöletlen sarkoknál a paritások nem alkotnak ilyen mintát."]],"quad":[["Quadruplets","Cercles listant les chiffres d’un 2×2.","Un cercle au coin commun à quatre cases indique des chiffres qui apparaissent parmi ces quatre cases (répétés s’ils sont répétés dans le cercle)."],["Quadruple","Cerchi con le cifre di un 2×2.","Un cerchio nell’angolo comune a quattro celle elenca cifre che compaiono tra quelle quattro celle (ripetute se sono ripetute nel cerchio)."],["Cuádruples","Círculos con los dígitos de un 2×2.","Un círculo en la esquina compartida por cuatro celdas indica dígitos que aparecen entre esas cuatro celdas (repetidos si están repetidos en el círculo)."],["Quádruplos","Círculos com os algarismos de um 2×2.","Um círculo no canto partilhado por quatro células indica algarismos que aparecem entre essas quatro células (repetidos se estiverem repetidos no círculo)."],["Quadrupel","Kreise mit den Ziffern eines 2×2.","Ein Kreis an der Ecke, die vier Felder gemeinsam haben, nennt Ziffern, die unter diesen vier Feldern vorkommen (wiederholt, wenn sie im Kreis wiederholt sind)."],["Négyesek","Körök a 2×2 számjegyeivel.","Négy cella közös sarkánál lévő kör olyan számjegyeket sorol fel, amelyek e négy cella között előfordulnak (ismétlődnek, ha a körben is ismétlődnek)."]],"killer":[[null,"Cages avec sommes, sans répétition.","La grille est divisée en cages en pointillés ; le nombre dans le coin est la somme des chiffres de la cage. Un chiffre ne peut pas se répéter dans une cage."],[null,"Gabbie con somme, senza ripetizioni.","La griglia è divisa in gabbie tratteggiate; il numero nell’angolo è la somma delle cifre della gabbia. Una cifra non può ripetersi all’interno di una gabbia."],[null,"Jaulas con sumas, sin repetir.","La cuadrícula se divide en jaulas punteadas; el número de la esquina es la suma de los dígitos de la jaula. Un dígito no puede repetirse dentro de una jaula."],[null,"Gaiolas com somas, sem repetições.","A grelha está dividida em gaiolas tracejadas; o número no canto é a soma dos algarismos da gaiola. Um algarismo não pode repetir-se dentro de uma gaiola."],[null,"Käfige mit Summen, ohne Wiederholung.","Das Gitter ist in gestrichelte Käfige unterteilt; die Zahl in der Ecke ist die Summe der Ziffern im Käfig. Eine Ziffer darf sich innerhalb eines Käfigs nicht wiederholen."],[null,"Összegekkel ellátott ketrecek, ismétlődés nélkül.","A rács szaggatott ketrecekre van osztva; a sarokban lévő szám a ketrecben lévő számjegyek összege. Egy ketrecen belül számjegy nem ismétlődhet."]],"littlekiller":[[null,"Somme d’une diagonale, depuis le bord.","Un nombre avec une flèche à l’extérieur de la grille est la somme des chiffres de la diagonale que la flèche indique ; les chiffres peuvent se répéter sur la diagonale."],[null,"Somma diagonale, dal bordo.","Un numero con una freccia fuori dalla griglia è la somma delle cifre sulla diagonale indicata dalla freccia; le cifre possono ripetersi sulla diagonale."],[null,"Suma diagonal desde el borde.","Un número con una flecha fuera de la cuadrícula es la suma de los dígitos de la diagonal que señala la flecha; los dígitos pueden repetirse en la diagonal."],[null,"Soma diagonal, a partir da margem.","Um número com uma seta fora da grelha é a soma dos algarismos da diagonal indicada pela seta; os algarismos podem repetir-se na diagonal."],[null,"Diagonalsumme vom Rand aus.","Eine Zahl mit einem Pfeil außerhalb des Gitters ist die Summe der Ziffern auf der Diagonale, auf die der Pfeil zeigt; Ziffern dürfen sich auf der Diagonale wiederholen."],[null,"Átlós összeg a szélről.","A rácson kívüli nyíllal ellátott szám a nyíl által mutatott átlón lévő számjegyek összege; az átlón a számjegyek ismétlődhetnek."]],"sandwich":[["Sandwich","Somme entre le 1 et le plus grand chiffre.","Le nombre à l’extérieur est la somme des chiffres situés entre le 1 et le chiffre N (9 dans une grille 9×9) dans cette ligne ou colonne."],["Sandwich","Somma tra l’1 e la cifra più grande.","Il numero all’esterno è la somma delle cifre comprese tra l’1 e la cifra N (9 in una griglia 9×9) in quella riga o colonna."],["Sándwich","Suma entre el 1 y el dígito mayor.","El número exterior es la suma de los dígitos situados entre el 1 y el dígito N (9 en una cuadrícula 9×9) en esa fila o columna."],["Sanduíche","Soma entre o 1 e o maior algarismo.","O número exterior é a soma dos algarismos situados entre o 1 e o algarismo N (9 numa grelha 9×9) nessa linha ou coluna."],["Sandwich","Summe zwischen der 1 und der größten Ziffer.","Die Zahl außen ist die Summe der Ziffern zwischen der 1 und der Ziffer N (9 in einem 9×9-Gitter) in dieser Zeile oder Spalte."],["Szendvics","Az 1 és a legnagyobb számjegy közti összeg.","A kívül álló szám az adott sorban vagy oszlopban az 1 és az N számjegy (9×9-es rácson a 9) közé eső számjegyek összege."]],"xsum":[["Sommes X","Le premier chiffre dit combien de cases additionner.","Si le premier chiffre d’une ligne ou d’une colonne est k, la somme des k premiers chiffres (à partir de cette extrémité) est le nombre à l’extérieur."],["Somme X","La prima cifra dice quante celle sommare.","Se la prima cifra di una riga o colonna è k, la somma delle prime k cifre (da quell’estremità) è il numero all’esterno."],["Sumas X","El primer dígito indica cuántas celdas sumar.","Si el primer dígito de una fila o columna es k, la suma de los primeros k dígitos (desde ese extremo) es el número exterior."],["Somas X","O primeiro algarismo diz quantas células somar.","Se o primeiro algarismo de uma linha ou coluna for k, a soma dos primeiros k algarismos (a partir dessa extremidade) é o número exterior."],["X-Summen","Die erste Ziffer sagt, wie viele Felder zu addieren sind.","Ist die erste Ziffer einer Zeile oder Spalte k, so ist die Summe der ersten k Ziffern (von diesem Ende aus) die Zahl außen."],["X-összegek","Az első számjegy megmondja, hány cellát kell összeadni.","Ha egy sor vagy oszlop első számjegye k, akkor az első k számjegy (az adott végtől) összege a kívül álló szám."]],"frame":[["Cadre (trois premiers)","Somme des trois premiers chiffres.","Le nombre à l’extérieur est la somme des trois premiers chiffres de la ligne ou de la colonne, en comptant à partir de cette extrémité."],["Cornice (prime tre)","Somma delle prime tre cifre.","Il numero all’esterno è la somma delle prime tre cifre della riga o colonna, contando da quell’estremità."],["Marco (primeros tres)","Suma de los tres primeros dígitos.","El número exterior es la suma de los tres primeros dígitos de la fila o columna, contando desde ese extremo."],["Moldura (primeiros três)","Soma dos três primeiros algarismos.","O número exterior é a soma dos três primeiros algarismos da linha ou coluna, a contar dessa extremidade."],["Rahmen (erste drei)","Summe der ersten drei Ziffern.","Die Zahl außen ist die Summe der ersten drei Ziffern der Zeile oder Spalte, von diesem Ende aus gezählt."],["Keret (első három)","Az első három számjegy összege.","A kívül álló szám a sor vagy oszlop első három számjegyének összege, az adott végtől számolva."]],"skyscraper":[["Gratte-ciel","Combien d’immeubles on voit.","Les chiffres sont des hauteurs d’immeubles. Le nombre à l’extérieur indique combien d’immeubles sont visibles depuis cette extrémité (un immeuble cache les plus bas derrière lui)."],["Grattacieli","Quanti edifici si vedono.","Le cifre sono altezze di edifici. Il numero all’esterno indica quanti edifici sono visibili da quell’estremità (un edificio nasconde quelli più bassi dietro di sé)."],["Rascacielos","Cuántos edificios se ven.","Los dígitos son alturas de edificios. El número exterior indica cuántos edificios se ven desde ese extremo (un edificio oculta a los más bajos que tiene detrás)."],["Arranha-céus","Quantos edifícios se veem.","Os algarismos são alturas de edifícios. O número exterior indica quantos edifícios são visíveis a partir dessa extremidade (um edifício esconde os mais baixos que tem atrás)."],["Wolkenkratzer","Wie viele Gebäude man sieht.","Die Ziffern sind Gebäudehöhen. Die Zahl außen zeigt, wie viele Gebäude von diesem Ende aus sichtbar sind (ein Gebäude verdeckt niedrigere dahinter)."],["Felhőkarcolók","Hány épület látszik.","A számjegyek épületmagasságok. A kívül álló szám megmutatja, hány épület látható az adott végről (egy épület eltakarja a mögötte lévő alacsonyabbakat)."]],"thermo":[["Thermomètres","Les chiffres croissent à partir du bulbe.","Le long de chaque thermomètre, les chiffres augmentent strictement à partir du bulbe."],["Termometri","Le cifre crescono dal bulbo.","Lungo ogni termometro le cifre aumentano rigorosamente a partire dal bulbo."],["Termómetros","Los dígitos crecen desde el bulbo.","A lo largo de cada termómetro los dígitos aumentan estrictamente a partir del bulbo."],["Termómetros","Os algarismos crescem a partir do bolbo.","Ao longo de cada termómetro, os algarismos aumentam estritamente a partir do bolbo."],["Thermometer","Die Ziffern steigen vom Kolben an.","Entlang jedes Thermometers steigen die Ziffern ab dem Kolben streng an."],["Hőmérők","A számjegyek a gömbtől kezdve emelkednek.","Minden hőmérő mentén a számjegyek a gömbtől kezdve szigorúan nőnek."]],"arrow":[["Flèches","Cercle = somme de la flèche.","Le chiffre dans le cercle d’une flèche est égal à la somme des chiffres le long de la flèche."],["Frecce","Cerchio = somma della freccia.","La cifra nel cerchio di una freccia è uguale alla somma delle cifre lungo la freccia."],["Flechas","Círculo = suma de la flecha.","El dígito del círculo de una flecha es igual a la suma de los dígitos a lo largo de la flecha."],["Setas","Círculo = soma da seta.","O algarismo no círculo de uma seta é igual à soma dos algarismos ao longo da seta."],["Pfeile","Kreis = Summe des Pfeils.","Die Ziffer im Kreis eines Pfeils ist gleich der Summe der Ziffern entlang des Pfeils."],["Nyilak","Kör = a nyíl összege.","A nyíl körében lévő számjegy egyenlő a nyíl mentén lévő számjegyek összegével."]],"renban":[[null,"Chiffres consécutifs sur une ligne.","Sur la ligne violette, les chiffres forment un ensemble de nombres consécutifs, dans n’importe quel ordre, sans répétition."],[null,"Cifre consecutive su una linea.","Sulla linea viola le cifre formano un insieme di numeri consecutivi, in qualsiasi ordine, senza ripetizioni."],[null,"Dígitos consecutivos en una línea.","En la línea morada, los dígitos forman un conjunto de números consecutivos, en cualquier orden, sin repetir."],[null,"Algarismos consecutivos numa linha.","Na linha roxa, os algarismos formam um conjunto de números consecutivos, por qualquer ordem, sem repetições."],[null,"Aufeinanderfolgende Ziffern auf einer Linie.","Auf der violetten Linie bilden die Ziffern eine Menge aufeinanderfolgender Zahlen, in beliebiger Reihenfolge und ohne Wiederholung."],[null,"Egymást követő számjegyek egy vonalon.","A lila vonalon a számjegyek egymást követő számok halmazát alkotják, tetszőleges sorrendben, ismétlődés nélkül."]],"whisper":[["Murmures allemands","Les voisins diffèrent d’au moins 5.","Sur la ligne verte, deux chiffres voisins diffèrent d’au moins 5. 9×9 uniquement."],["Sussurri tedeschi","I vicini differiscono di almeno 5.","Sulla linea verde due cifre vicine differiscono di almeno 5. Solo 9×9."],["Susurros alemanes","Los vecinos difieren en al menos 5.","En la línea verde, dos dígitos vecinos difieren en al menos 5. Solo 9×9."],["Sussurros alemães","Os vizinhos diferem em pelo menos 5.","Na linha verde, dois algarismos vizinhos diferem em pelo menos 5. Só 9×9."],["Deutsche Flüsterlinien","Nachbarn unterscheiden sich um mindestens 5.","Auf der grünen Linie unterscheiden sich zwei benachbarte Ziffern um mindestens 5. Nur 9×9."],["Német suttogás","A szomszédok legalább 5-tel különböznek.","A zöld vonalon két szomszédos számjegy legalább 5-tel különbözik. Csak 9×9."]],"palindrome":[["Palindrome","La ligne se lit de la même façon dans les deux sens.","Les chiffres de la ligne grise forment un palindrome."],["Palindromo","La linea si legge uguale nei due sensi.","Le cifre sulla linea grigia formano un palindromo."],["Palíndromo","La línea se lee igual en ambos sentidos.","Los dígitos de la línea gris forman un palíndromo."],["Palíndromo","A linha lê-se igual nos dois sentidos.","Os algarismos da linha cinzenta formam um palíndromo."],["Palindrom","Die Linie liest sich in beide Richtungen gleich.","Die Ziffern auf der grauen Linie bilden ein Palindrom."],["Palindrom","A vonal mindkét irányból ugyanúgy olvasható.","A szürke vonalon a számjegyek palindromot alkotnak."]],"between":[["Entre les lignes","L’intérieur est compris entre les extrémités.","Les chiffres de la ligne entre les deux cercles sont strictement compris entre les chiffres des cercles."],["Tra le linee","L’interno sta tra le estremità.","Le cifre sulla linea tra i due cerchi sono strettamente comprese tra le cifre nei cerchi."],["Entre líneas","El interior queda entre los extremos.","Los dígitos de la línea entre los dos círculos están estrictamente entre los dígitos de los círculos."],["Entre linhas","O interior fica entre as extremidades.","Os algarismos da linha entre os dois círculos estão estritamente entre os algarismos dos círculos."],["Zwischen Linien","Das Innere liegt zwischen den Enden.","Die Ziffern auf der Linie zwischen den beiden Kreisen liegen streng zwischen den Ziffern in den Kreisen."],["Vonalak között","A belső a végek között van.","A két kör közötti vonalon lévő számjegyek szigorúan a körökben lévő számjegyek között vannak."]],"entropic":[["Lignes entropiques","Bas / milieu / haut.","Sur la ligne orange, trois cases consécutives quelconques contiennent un chiffre de chaque tiers de la plage (en 9×9 : 1–3, 4–6, 7–9)."],["Linee entropiche","Basso / medio / alto.","Sulla linea arancione, tre celle consecutive qualsiasi contengono una cifra per ciascun terzo dell’intervallo (nel 9×9: 1–3, 4–6, 7–9)."],["Líneas entrópicas","Bajo / medio / alto.","En la línea naranja, tres celdas consecutivas cualesquiera contienen un dígito de cada tercio del rango (en 9×9: 1–3, 4–6, 7–9)."],["Linhas entrópicas","Baixo / médio / alto.","Na linha laranja, quaisquer três células consecutivas contêm um algarismo de cada terço do intervalo (em 9×9: 1–3, 4–6, 7–9)."],["Entropische Linien","Niedrig / mittel / hoch.","Auf der orangen Linie enthalten beliebige drei aufeinanderfolgende Felder je eine Ziffer aus jedem Drittel des Bereichs (bei 9×9: 1–3, 4–6, 7–9)."],["Entrópikus vonalak","Alacsony / közepes / magas.","A narancssárga vonalon bármely három egymást követő cella a tartomány minden harmadából tartalmaz egy számjegyet (9×9-en: 1–3, 4–6, 7–9)."]],"modular":[["Lignes modulaires","Restes différents modulo 3.","Sur la ligne turquoise, trois cases consécutives quelconques ont des restes différents dans la division par 3."],["Linee modulari","Resti diversi modulo 3.","Sulla linea verde acqua, tre celle consecutive qualsiasi hanno resti diversi nella divisione per 3."],["Líneas modulares","Restos distintos módulo 3.","En la línea turquesa, tres celdas consecutivas cualesquiera tienen restos distintos al dividir entre 3."],["Linhas modulares","Restos diferentes módulo 3.","Na linha turquesa, quaisquer três células consecutivas têm restos diferentes na divisão por 3."],["Modulare Linien","Verschiedene Reste modulo 3.","Auf der türkisen Linie haben beliebige drei aufeinanderfolgende Felder verschiedene Reste bei Division durch 3."],["Moduláris vonalak","Különböző maradékok mod 3.","A kékeszöld vonalon bármely három egymást követő cella maradéka 3-mal osztva különböző."]],"samurai":[[null,"Cinq grilles qui se chevauchent.","Cinq grilles 9×9 qui se chevauchent aux coins ; les blocs partagés ne sont remplis qu’une seule fois."],[null,"Cinque griglie sovrapposte.","Cinque griglie 9×9 sovrapposte agli angoli; i riquadri condivisi si riempiono una sola volta."],[null,"Cinco cuadrículas superpuestas.","Cinco cuadrículas 9×9 superpuestas en las esquinas; las cajas compartidas se rellenan una sola vez."],[null,"Cinco grelhas sobrepostas.","Cinco grelhas 9×9 sobrepostas nos cantos; as caixas partilhadas só se preenchem uma vez."],[null,"Fünf überlappende Gitter.","Fünf 9×9-Gitter, die sich an den Ecken überlappen; gemeinsame Blöcke werden nur einmal ausgefüllt."],[null,"Öt átfedő rács.","Öt 9×9-es rács, amelyek a sarkoknál átfedik egymást; a közös blokkokat csak egyszer kell kitölteni."]],"twodoku":[[null,"Deux grilles partageant un bloc.","Deux grilles 9×9 qui partagent un bloc."],[null,"Due griglie che condividono un riquadro.","Due griglie 9×9 che condividono un riquadro."],[null,"Dos cuadrículas que comparten una caja.","Dos cuadrículas 9×9 que comparten una caja."],[null,"Duas grelhas que partilham uma caixa.","Duas grelhas 9×9 que partilham uma caixa."],[null,"Zwei Gitter mit einem gemeinsamen Block.","Zwei 9×9-Gitter, die einen Block gemeinsam haben."],[null,"Két rács, amelyek egy blokkon osztoznak.","Két 9×9-es rács, amelyek egy blokkot közösen használnak."]],"gattai3":[[null,"Trois grilles en chaîne.","Trois grilles 9×9 reliées en diagonale, chaque paire voisine partageant un bloc."],[null,"Tre griglie in catena.","Tre griglie 9×9 collegate in diagonale, ogni coppia vicina condivide un riquadro."],[null,"Tres cuadrículas en cadena.","Tres cuadrículas 9×9 unidas en diagonal; cada pareja vecina comparte una caja."],[null,"Três grelhas em cadeia.","Três grelhas 9×9 ligadas na diagonal; cada par vizinho partilha uma caixa."],[null,"Drei Gitter in einer Kette.","Drei 9×9-Gitter, diagonal verbunden; jedes benachbarte Paar teilt sich einen Block."],[null,"Három rács láncban.","Három, átlósan összekapcsolt 9×9-es rács; minden szomszédos pár egy blokkon osztozik."]],"futoshiki":[[null,"Carré latin avec signes d’inégalité.","Chaque ligne et chaque colonne contient une fois les chiffres 1–N ; les signes < et > entre les cases doivent être respectés. Proche parent du sudoku, sans blocs."],[null,"Quadrato latino con segni di disuguaglianza.","Ogni riga e colonna contiene le cifre 1–N una volta; i segni < e > tra le celle devono essere rispettati. Un parente stretto del sudoku, senza riquadri."],[null,"Cuadrado latino con signos de desigualdad.","Cada fila y columna contiene los dígitos 1–N una vez; los signos < y > entre celdas deben cumplirse. Un pariente cercano del sudoku, sin cajas."],[null,"Quadrado latino com sinais de desigualdade.","Cada linha e coluna contém os algarismos 1–N uma vez; os sinais < e > entre células têm de ser respeitados. Um parente próximo do sudoku, sem caixas."],[null,"Lateinisches Quadrat mit Ungleichheitszeichen.","Jede Zeile und Spalte enthält die Ziffern 1–N einmal; die Zeichen < und > zwischen den Feldern müssen gelten. Ein enger Verwandter des Sudoku, ohne Blöcke."],[null,"Latin négyzet egyenlőtlenségi jelekkel.","Minden sor és oszlop egyszer tartalmazza az 1–N számjegyeket; a cellák közti < és > jeleknek teljesülniük kell. A sudoku közeli rokona, blokkok nélkül."]],"kenken":[[null,"Carré latin avec cages arithmétiques.","Chaque ligne et chaque colonne contient une fois les chiffres 1–N ; chaque cage a un objectif et une opération (+, −, ×, ÷). Les chiffres peuvent se répéter dans une cage s’ils ne sont pas sur la même ligne ou colonne."],[null,"Quadrato latino con gabbie aritmetiche.","Ogni riga e colonna contiene le cifre 1–N una volta; ogni gabbia ha un obiettivo e un’operazione (+, −, ×, ÷). Le cifre possono ripetersi in una gabbia se non sono sulla stessa riga o colonna."],[null,"Cuadrado latino con jaulas aritméticas.","Cada fila y columna contiene los dígitos 1–N una vez; cada jaula tiene un objetivo y una operación (+, −, ×, ÷). Los dígitos pueden repetirse dentro de una jaula si no están en la misma fila o columna."],[null,"Quadrado latino com gaiolas aritméticas.","Cada linha e coluna contém os algarismos 1–N uma vez; cada gaiola tem um objetivo e uma operação (+, −, ×, ÷). Os algarismos podem repetir-se numa gaiola se não estiverem na mesma linha ou coluna."],[null,"Lateinisches Quadrat mit Rechenkäfigen.","Jede Zeile und Spalte enthält die Ziffern 1–N einmal; jeder Käfig hat ein Ziel und eine Rechenoperation (+, −, ×, ÷). Ziffern dürfen sich innerhalb eines Käfigs wiederholen, wenn sie nicht in derselben Zeile oder Spalte stehen."],[null,"Latin négyzet aritmetikai ketrecekkel.","Minden sor és oszlop egyszer tartalmazza az 1–N számjegyeket; minden ketrecnek van célértéke és művelete (+, −, ×, ÷). A számjegyek ismétlődhetnek egy ketrecen belül, ha nem ugyanabban a sorban vagy oszlopban vannak."]],"girandola":[["Girandole","Un groupe de plus de 9 cases en forme de moulinet.","En plus des règles classiques, les neuf cases marquées (les quatre coins, le centre et les quatre cases situées un pas à l’intérieur du milieu de chaque côté : r2c5, r5c2, r5c8, r8c5) doivent contenir 1–9 une fois chacune. C’est ainsi que Girandola est décrite dans Regexp::Sudoku (la forme en moulinet) ; d’autres sources ne donnent pas de coordonnées exactes. 9×9 uniquement."],["Girandola","Un altro gruppo di 9 celle a forma di girandola.","Oltre alle regole classiche, le nove celle segnate (i quattro angoli, il centro e le quattro celle un passo all’interno del punto medio di ciascun lato: r2c5, r5c2, r5c8, r8c5) devono contenere 1–9 una volta ciascuna. Così è descritta Girandola in Regexp::Sudoku (la forma a girandola); altre fonti non danno le coordinate esatte. Solo 9×9."],["Girandola","Un grupo más de 9 celdas en forma de molinete.","Además de las reglas clásicas, las nueve celdas marcadas (las cuatro esquinas, el centro y las cuatro celdas situadas un paso dentro del punto medio de cada lado: r2c5, r5c2, r5c8, r8c5) deben contener 1–9 una vez cada una. Así se describe Girandola en Regexp::Sudoku (la forma de molinete); otras fuentes no dan coordenadas exactas. Solo 9×9."],["Girândola","Mais um grupo de 9 células em forma de cata-vento.","Além das regras clássicas, as nove células marcadas (os quatro cantos, o centro e as quatro células um passo para dentro do ponto médio de cada lado: r2c5, r5c2, r5c8, r8c5) têm de conter 1–9 uma vez cada. É assim que a Girandola é descrita no Regexp::Sudoku (a forma de cata-vento); outras fontes não dão coordenadas exatas. Só 9×9."],["Girandola","Eine weitere Gruppe aus 9 Feldern in Windradform.","Zusätzlich zu den klassischen Regeln müssen die neun markierten Felder (die vier Ecken, die Mitte und die vier Felder einen Schritt innerhalb der Seitenmitte jeder Seite: r2c5, r5c2, r5c8, r8c5) 1–9 je einmal enthalten. So wird Girandola in Regexp::Sudoku beschrieben (die Windradform); andere Quellen nennen keine genauen Koordinaten. Nur 9×9."],["Girandola","Még egy 9 cellás csoport szélkerék alakban.","A klasszikus szabályokon túl a kilenc jelölt cellának (a négy sarok, a közép és a négy cella, amely az egyes oldalak felezőpontjától egy lépéssel beljebb van: r2c5, r5c2, r5c8, r8c5) 1–9-et kell tartalmaznia egyszer-egyszer. A Girandolát így írja le a Regexp::Sudoku (a szélkerék alak); más források nem adnak pontos koordinátákat. Csak 9×9."]],"sparse9":[["Neuf dispersés","Un groupe de plus de 9 cases : coins, milieux des côtés, centre.","En plus des règles classiques, les neuf cases marquées (les quatre coins, les milieux des quatre côtés et la case centrale) doivent contenir 1–9 une fois chacune. C’est la disposition que cette application appelait auparavant « Girandola » ; je n’ai trouvé aucun nom publié pour elle. 9×9 uniquement."],["Nove sparsi","Un altro gruppo di 9 celle: angoli, punti medi dei lati, centro.","Oltre alle regole classiche, le nove celle segnate (i quattro angoli, i punti medi dei quattro lati e la cella centrale) devono contenere 1–9 una volta ciascuna. È la disposizione che questa app chiamava in precedenza «Girandola»; non ho trovato nessun nome pubblicato per essa. Solo 9×9."],["Nueve dispersos","Un grupo más de 9 celdas: esquinas, puntos medios de los lados, centro.","Además de las reglas clásicas, las nueve celdas marcadas (las cuatro esquinas, los puntos medios de los cuatro lados y la celda central) deben contener 1–9 una vez cada una. Es la disposición que esta aplicación llamaba antes «Girandola»; no he encontrado ningún nombre publicado para ella. Solo 9×9."],["Nove dispersos","Mais um grupo de 9 células: cantos, pontos médios dos lados, centro.","Além das regras clássicas, as nove células marcadas (os quatro cantos, os pontos médios dos quatro lados e a célula central) têm de conter 1–9 uma vez cada. É a disposição que esta aplicação antes chamava «Girandola»; não encontrei nenhum nome publicado para ela. Só 9×9."],["Verstreute Neun","Eine weitere Gruppe aus 9 Feldern: Ecken, Seitenmitten, Mitte.","Zusätzlich zu den klassischen Regeln müssen die neun markierten Felder (die vier Ecken, die Mitten der vier Seiten und das Mittelfeld) 1–9 je einmal enthalten. Diese Anordnung nannte diese App früher „Girandola“; ich habe keinen veröffentlichten Namen dafür gefunden. Nur 9×9."],["Szétszórt kilenc","Még egy 9 cellás csoport: sarkok, oldalfelezők, közép.","A klasszikus szabályokon túl a kilenc jelölt cellának (a négy sarok, a négy oldal felezőpontja és a középső cella) 1–9-et kell tartalmaznia egyszer-egyszer. Ezt az elrendezést ez az alkalmazás korábban „Girandolának” nevezte; nem találtam rá közzétett nevet. Csak 9×9."]],"asterisk":[["Astérisque","Un groupe en forme d’astérisque.","Les neuf cases marquées, disposées en astérisque autour du centre (le centre, quatre à distance 3 à l’horizontale et à la verticale, quatre sur les diagonales à distance 2), doivent contenir 1–9 une fois chacune, en plus des règles classiques. 9×9 uniquement."],["Asterisco","Un gruppo a forma di asterisco.","Le nove celle segnate, disposte a asterisco attorno al centro (il centro, quattro a distanza 3 in orizzontale e verticale, quattro sulle diagonali a distanza 2), devono contenere 1–9 una volta ciascuna, oltre alle regole classiche. Solo 9×9."],["Asterisco","Un grupo con forma de asterisco.","Las nueve celdas marcadas, dispuestas como un asterisco alrededor del centro (el centro, cuatro a distancia 3 en horizontal y vertical, cuatro en las diagonales a distancia 2), deben contener 1–9 una vez cada una, además de las reglas clásicas. Solo 9×9."],["Asterisco","Um grupo em forma de asterisco.","As nove células marcadas, dispostas como um asterisco em torno do centro (o centro, quatro a distância 3 na horizontal e na vertical, quatro nas diagonais a distância 2), têm de conter 1–9 uma vez cada, além das regras clássicas. Só 9×9."],["Asterisk","Eine Gruppe in Form eines Sternchens.","Die neun markierten Felder, als Sternchen um die Mitte angeordnet (die Mitte, vier im Abstand 3 waagrecht und senkrecht, vier auf den Diagonalen im Abstand 2), müssen zusätzlich zu den klassischen Regeln 1–9 je einmal enthalten. Nur 9×9."],["Csillag","Csillag alakú csoport.","A kilenc jelölt cellának, amelyek csillagot formálnak a közép körül (a közép, négy vízszintesen és függőlegesen 3 távolságra, négy az átlókon 2 távolságra), a klasszikus szabályokon túl 1–9-et kell tartalmaznia egyszer-egyszer. Csak 9×9."]],"diag1":[["Diagonale simple","Seule la diagonale principale est spéciale.","La diagonale principale (du haut à gauche au bas à droite) contient chaque chiffre exactement une fois, en plus des règles classiques. L’autre diagonale n’a aucune restriction."],["Diagonale singola","Solo la diagonale principale è speciale.","La diagonale principale (da in alto a sinistra a in basso a destra) contiene ogni cifra esattamente una volta, oltre alle regole classiche. L’altra diagonale non ha restrizioni."],["Diagonal simple","Solo la diagonal principal es especial.","La diagonal principal (de arriba a la izquierda a abajo a la derecha) contiene cada dígito exactamente una vez, además de las reglas clásicas. La otra diagonal no tiene restricción."],["Diagonal simples","Só a diagonal principal é especial.","A diagonal principal (de cima à esquerda para baixo à direita) contém cada algarismo exatamente uma vez, além das regras clássicas. A outra diagonal não tem restrição."],["Einzelne Diagonale","Nur die Hauptdiagonale ist besonders.","Die Hauptdiagonale (von oben links nach unten rechts) enthält zusätzlich zu den klassischen Regeln jede Ziffer genau einmal. Die andere Diagonale unterliegt keiner Einschränkung."],["Egyetlen átló","Csak a főátló különleges.","A főátló (bal felsőtől jobb alsóig) a klasszikus szabályokon túl minden számjegyet pontosan egyszer tartalmaz. A másik átlóra nincs megkötés."]],"dutch":[["Murmures néerlandais","Les voisins diffèrent d’au moins 4.","Sur la ligne verte, deux chiffres voisins quelconques diffèrent d’au moins 4 (les murmures allemands utilisent 5). La ligne peut passer en diagonale. Les chiffres peuvent se répéter s’ils ne partagent ni ligne, ni colonne, ni bloc. 9×9 uniquement."],["Sussurri olandesi","I vicini differiscono di almeno 4.","Sulla linea verde, due cifre vicine qualsiasi differiscono di almeno 4 (i sussurri tedeschi usano 5). La linea può passare in diagonale. Le cifre possono ripetersi se non condividono riga, colonna o riquadro. Solo 9×9."],["Susurros neerlandeses","Los vecinos difieren en al menos 4.","En la línea verde, dos dígitos vecinos cualesquiera difieren en al menos 4 (los susurros alemanes usan 5). La línea puede pasar en diagonal. Los dígitos pueden repetirse si no comparten fila, columna ni caja. Solo 9×9."],["Sussurros holandeses","Os vizinhos diferem em pelo menos 4.","Na linha verde, quaisquer dois algarismos vizinhos diferem em pelo menos 4 (os sussurros alemães usam 5). A linha pode passar na diagonal. Os algarismos podem repetir-se se não partilharem linha, coluna nem caixa. Só 9×9."],["Holländische Flüsterlinien","Nachbarn unterscheiden sich um mindestens 4.","Auf der grünen Linie unterscheiden sich zwei beliebige benachbarte Ziffern um mindestens 4 (die deutschen Flüsterlinien verwenden 5). Die Linie kann diagonal verlaufen. Ziffern dürfen sich wiederholen, wenn sie keine Zeile, Spalte und keinen Block teilen. Nur 9×9."],["Holland suttogás","A szomszédok legalább 4-gyel különböznek.","A zöld vonalon bármely két szomszédos számjegy legalább 4-gyel különbözik (a német suttogás 5-öt használ). A vonal haladhat átlósan. A számjegyek ismétlődhetnek, ha nincs közös soruk, oszlopuk vagy blokkjuk. Csak 9×9."]],"nabner":[[null,"Pas de répétition ni de chiffres consécutifs sur une ligne.","Sur une ligne marron, aucun chiffre ne se répète et deux chiffres quelconques de la ligne (pas seulement voisins) ne sont jamais consécutifs. C’est l’opposé de Renban, d’où le nom."],[null,"Nessuna ripetizione né cifre consecutive su una linea.","Su una linea marrone nessuna cifra si ripete e due cifre qualsiasi della linea (non solo vicine) non sono mai consecutive. È l’opposto di Renban, da cui il nome."],[null,"Sin repeticiones ni dígitos consecutivos en una línea.","En una línea marrón no se repite ningún dígito y dos dígitos cualesquiera de la línea (no solo vecinos) nunca son consecutivos. Es lo opuesto a Renban, de ahí el nombre."],[null,"Sem repetições nem algarismos consecutivos numa linha.","Numa linha castanha, nenhum algarismo se repete e quaisquer dois algarismos da linha (não só vizinhos) nunca são consecutivos. É o oposto de Renban, daí o nome."],[null,"Keine Wiederholung und keine aufeinanderfolgenden Ziffern auf einer Linie.","Auf einer braunen Linie wiederholt sich keine Ziffer, und zwei beliebige Ziffern der Linie (nicht nur Nachbarn) sind nie aufeinanderfolgend. Es ist das Gegenstück zu Renban, daher der Name."],[null,"Nincs ismétlődés és nincsenek egymást követő számjegyek egy vonalon.","Egy barna vonalon egyetlen számjegy sem ismétlődik, és a vonal bármely két számjegye (nem csak a szomszédosak) sosem egymást követő szám. A Renban ellentéte, innen a név."]],"slowthermo":[["Thermomètre lent","Les chiffres ne diminuent jamais à partir du bulbe.","Le long de chaque thermomètre lent, les chiffres augmentent ou restent égaux à partir du bulbe ; des chiffres égaux ne peuvent apparaître que dans des cases qui ne partagent ni ligne, ni colonne, ni bloc (par exemple en diagonale). Les thermomètres peuvent passer en diagonale."],["Termometro lento","Le cifre non diminuiscono mai dal bulbo.","Lungo ogni termometro lento le cifre aumentano o restano uguali a partire dal bulbo; cifre uguali possono comparire solo in celle che non condividono riga, colonna o riquadro (per esempio in diagonale). I termometri possono passare in diagonale."],["Termómetro lento","Los dígitos nunca disminuyen desde el bulbo.","A lo largo de cada termómetro lento, los dígitos aumentan o se mantienen iguales a partir del bulbo; los dígitos iguales solo pueden darse en celdas que no comparten fila, columna ni caja (por ejemplo, en diagonal). Los termómetros pueden pasar en diagonal."],["Termómetro lento","Os algarismos nunca diminuem a partir do bolbo.","Ao longo de cada termómetro lento, os algarismos aumentam ou mantêm-se iguais a partir do bolbo; algarismos iguais só podem ocorrer em células que não partilhem linha, coluna nem caixa (por exemplo, na diagonal). Os termómetros podem passar na diagonal."],["Langsames Thermometer","Die Ziffern fallen vom Kolben aus nie.","Entlang jedes langsamen Thermometers steigen die Ziffern ab dem Kolben an oder bleiben gleich; gleiche Ziffern können nur in Feldern vorkommen, die keine Zeile, Spalte und keinen Block teilen (zum Beispiel diagonal). Thermometer können diagonal verlaufen."],["Lassú hőmérő","A számjegyek a gömbtől kezdve sosem csökkennek.","Minden lassú hőmérő mentén a számjegyek a gömbtől kezdve nőnek vagy egyenlők maradnak; egyenlő számjegyek csak olyan cellákban fordulhatnak elő, amelyeknek nincs közös soruk, oszlopuk vagy blokkjuk (például átlósan). A hőmérők haladhatnak átlósan."]],"parityline":[["Ligne de parité","La parité alterne.","Sur la ligne jaune, deux chiffres voisins ont toujours une parité différente : pair, impair, pair… ou l’inverse. Convention : c’est la version « alternée » ; la version de même parité a sa propre fiche, « Ligne de même parité »."],["Linea di parità","La parità si alterna.","Sulla linea gialla due cifre vicine hanno sempre parità diversa: pari, dispari, pari… o il contrario. Convenzione: è la versione «alternata»; la versione con la stessa parità ha una propria scheda, «Linea di stessa parità»."],["Línea de paridad","La paridad se alterna.","En la línea amarilla, dos dígitos vecinos tienen siempre distinta paridad: par, impar, par… o al revés. Convención: esta es la versión «alternada»; la versión de igual paridad tiene su propia ficha, «Línea de igual paridad»."],["Linha de paridade","A paridade alterna.","Na linha amarela, dois algarismos vizinhos têm sempre paridade diferente: par, ímpar, par… ou o contrário. Convenção: esta é a versão «alternada»; a versão de igual paridade tem a sua própria ficha, «Linha de igual paridade»."],["Paritätslinie","Die Parität wechselt.","Auf der gelben Linie haben zwei benachbarte Ziffern stets unterschiedliche Parität: gerade, ungerade, gerade … oder umgekehrt. Konvention: Dies ist die „alternierende“ Version; die Version mit gleicher Parität hat eine eigene Karte, „Linie gleicher Parität“."],["Paritásvonal","A paritás váltakozik.","A sárga vonalon két szomszédos számjegy paritása mindig különböző: páros, páratlan, páros… vagy fordítva. Megállapodás: ez a „váltakozó” változat; az azonos paritású változatnak saját kártyája van, „Azonos paritású vonal”."]],"sameparity":[["Ligne de même parité","Les chiffres voisins ont la même parité.","Sur la ligne indigo, deux chiffres voisins ont la même parité : la ligne entière est donc soit toute paire, soit toute impaire (sans qu’on sache laquelle)."],["Linea di stessa parità","Le cifre vicine hanno la stessa parità.","Sulla linea indaco due cifre vicine hanno la stessa parità, quindi l’intera linea è tutta pari o tutta dispari (quale delle due non è dato)."],["Línea de igual paridad","Los dígitos vecinos comparten paridad.","En la línea índigo, dos dígitos vecinos tienen la misma paridad, de modo que toda la línea es de dígitos pares o de dígitos impares (no se indica cuál)."],["Linha de mesma paridade","Os algarismos vizinhos partilham a paridade.","Na linha índigo, dois algarismos vizinhos têm a mesma paridade, pelo que a linha inteira é toda de pares ou toda de ímpares (qual delas não é indicado)."],["Linie gleicher Parität","Benachbarte Ziffern haben dieselbe Parität.","Auf der indigofarbenen Linie haben zwei benachbarte Ziffern dieselbe Parität, die ganze Linie besteht also entweder nur aus geraden oder nur aus ungeraden Ziffern (welche, ist nicht angegeben)."],["Azonos paritású vonal","A szomszédos számjegyek paritása azonos.","Az indigó vonalon két szomszédos számjegy paritása azonos, így az egész vonal vagy csupa páros, vagy csupa páratlan (hogy melyik, nincs megadva)."]],"evenonly":[["Seuls les pairs marqués","Les cases grisées sont paires.","Chaque case marquée d’un carré gris contient un chiffre pair. Les cases non marquées ne disent rien : elles peuvent contenir n’importe quoi. Diffère de Pair–impair, où les deux types sont marqués."],["Solo i pari indicati","Le celle ombreggiate sono pari.","Ogni cella segnata con un quadrato grigio contiene una cifra pari. Le celle senza segno non dicono nulla: possono contenere qualsiasi cifra. Differisce da Pari–dispari, dove sono segnati entrambi i tipi."],["Solo pares marcados","Las celdas sombreadas son pares.","Cada celda marcada con un cuadrado gris contiene un dígito par. Las celdas sin marcar no dicen nada: pueden ser cualquier dígito. Se diferencia de Par–impar, donde se marcan ambos tipos."],["Só pares marcados","As células sombreadas são pares.","Cada célula marcada com um quadrado cinzento contém um algarismo par. As células sem marca não dizem nada: podem ser qualquer algarismo. Difere de Par–ímpar, em que os dois tipos são marcados."],["Nur markierte gerade Zahlen","Schattierte Felder sind gerade.","Jedes Feld mit einem grauen Quadrat enthält eine gerade Ziffer. Unmarkierte Felder sagen nichts: Sie können beliebig sein. Unterschied zu Gerade–ungerade, wo beide Arten markiert sind."],["Csak jelölt párosak","Az árnyékolt cellák párosak.","Minden szürke négyzettel jelölt cella páros számjegyet tartalmaz. A jelöletlen cellák nem mondanak semmit: bármi lehet bennük. Eltér a Páros–páratlantól, ahol mindkét fajta jelölve van."]],"oddonly":[["Seuls les impairs marqués","Les cases cerclées sont impaires.","Chaque case marquée d’un cercle gris contient un chiffre impair. Les cases non marquées ne disent rien : elles peuvent contenir n’importe quoi."],["Solo i dispari indicati","Le celle cerchiate sono dispari.","Ogni cella segnata con un cerchio grigio contiene una cifra dispari. Le celle senza segno non dicono nulla: possono contenere qualsiasi cifra."],["Solo impares marcados","Las celdas con círculo son impares.","Cada celda marcada con un círculo gris contiene un dígito impar. Las celdas sin marcar no dicen nada: pueden ser cualquier dígito."],["Só ímpares marcados","As células com círculo são ímpares.","Cada célula marcada com um círculo cinzento contém um algarismo ímpar. As células sem marca não dizem nada: podem ser qualquer algarismo."],["Nur markierte ungerade Zahlen","Eingekreiste Felder sind ungerade.","Jedes Feld mit einem grauen Kreis enthält eine ungerade Ziffer. Unmarkierte Felder sagen nichts: Sie können beliebig sein."],["Csak jelölt páratlanok","A bekarikázott cellák páratlanok.","Minden szürke körrel jelölt cella páratlan számjegyet tartalmaz. A jelöletlen cellák nem mondanak semmit: bármi lehet bennük."]],"luk":[["Little Killer unique","Little Killer avec des chiffres distincts sur la diagonale.","Le nombre à côté d’une flèche oblique est la somme des chiffres de la diagonale que la flèche indique, et sur chacune de ces diagonales tous les chiffres sont différents (la différence avec le Little Killer classique). Le nom « Little Unique Killer » est propre à cette application ; je n’ai trouvé aucune variante publiée sous ce nom."],["Little Killer unico","Little Killer con cifre distinte sulla diagonale.","Il numero accanto a una freccia obliqua è la somma delle cifre sulla diagonale indicata dalla freccia, e su ciascuna di queste diagonali tutte le cifre sono diverse (la differenza rispetto al Little Killer classico). Il nome «Little Unique Killer» è proprio di questa app; non ho trovato nessuna variante pubblicata con questo nome."],["Little Killer único","Little Killer con dígitos distintos en la diagonal.","El número junto a una flecha oblicua es la suma de los dígitos de la diagonal que señala la flecha, y en cada una de esas diagonales todos los dígitos son distintos (la diferencia con el Little Killer clásico). El nombre «Little Unique Killer» es propio de esta aplicación; no he encontrado ninguna variante publicada con ese nombre."],["Little Killer único","Little Killer com algarismos distintos na diagonal.","O número junto a uma seta oblíqua é a soma dos algarismos da diagonal indicada pela seta, e em cada uma dessas diagonais todos os algarismos são diferentes (a diferença em relação ao Little Killer clássico). O nome «Little Unique Killer» é próprio desta aplicação; não encontrei nenhuma variante publicada com esse nome."],["Eindeutiger Little Killer","Little Killer mit verschiedenen Ziffern auf der Diagonale.","Die Zahl neben einem schrägen Pfeil ist die Summe der Ziffern auf der Diagonale, auf die der Pfeil zeigt, und auf jeder dieser Diagonalen sind alle Ziffern verschieden (der Unterschied zum klassischen Little Killer). Der Name „Little Unique Killer“ stammt von dieser App; ich habe keine veröffentlichte Variante unter diesem Namen gefunden."],["Egyedi Little Killer","Little Killer különböző számjegyekkel az átlón.","A ferde nyíl melletti szám a nyíl által mutatott átlón lévő számjegyek összege, és minden ilyen átlón az összes számjegy különböző (ez a különbség a klasszikus Little Killerhez képest). A „Little Unique Killer” név ennek az alkalmazásnak a sajátja; ilyen néven nem találtam közzétett változatot."]],"fortress":[["Forteresse","Les cases grisées dominent leurs voisines.","Une case grisée est supérieure à chacune de ses voisines orthogonales non grisées. Rien n’est imposé entre deux cases grisées adjacentes."],["Fortezza","Le celle ombreggiate battono le vicine.","Una cella ombreggiata è maggiore di ogni vicina ortogonale non ombreggiata. Tra due celle ombreggiate adiacenti non è imposto nulla."],["Fortaleza","Las celdas sombreadas superan a sus vecinas.","Una celda sombreada es mayor que cada una de sus vecinas ortogonales que no estén sombreadas. No se impone nada entre dos celdas sombreadas adyacentes."],["Fortaleza","As células sombreadas superam as vizinhas.","Uma célula sombreada é maior do que cada uma das suas vizinhas ortogonais não sombreadas. Nada é imposto entre duas células sombreadas adjacentes."],["Festung","Schattierte Felder übertreffen ihre Nachbarn.","Ein schattiertes Feld ist größer als jeder nicht schattierte orthogonale Nachbar. Zwischen zwei benachbarten schattierten Feldern wird nichts vorgegeben."],["Erőd","Az árnyékolt cellák legyőzik a szomszédaikat.","Egy árnyékolt cella nagyobb minden nem árnyékolt ortogonális szomszédjánál. Két szomszédos árnyékolt cella között nincs megkötés."]],"minmax":[["Min / Max","Cases plus petites ou plus grandes que tous leurs voisins.","Une case marquée d’un triangle vers le bas (« min ») est strictement plus petite que tous ses voisins orthogonaux ; une case marquée d’un triangle vers le haut (« max ») est strictement plus grande que tous."],["Min / Max","Celle più piccole o più grandi di tutte le vicine.","Una cella segnata con un triangolo verso il basso («min») è strettamente minore di tutte le sue vicine ortogonali; una segnata con un triangolo verso l’alto («max») è strettamente maggiore di tutte."],["Mín. / Máx.","Celdas menores o mayores que todas sus vecinas.","Una celda marcada con un triángulo hacia abajo («min») es estrictamente menor que todas sus vecinas ortogonales; una marcada con un triángulo hacia arriba («max») es estrictamente mayor que todas ellas."],["Mín. / Máx.","Células menores ou maiores do que todas as vizinhas.","Uma célula marcada com um triângulo para baixo («min») é estritamente menor do que todas as suas vizinhas ortogonais; uma marcada com um triângulo para cima («max») é estritamente maior do que todas elas."],["Min / Max","Felder kleiner oder größer als alle Nachbarn.","Ein mit einem Dreieck nach unten markiertes Feld („min“) ist echt kleiner als alle seine orthogonalen Nachbarn; ein mit einem Dreieck nach oben markiertes („max“) ist echt größer als alle."],["Min. / Max.","Minden szomszédjuknál kisebb vagy nagyobb cellák.","A lefelé mutató háromszöggel jelölt („min”) cella szigorúan kisebb az összes ortogonális szomszédjánál; a felfelé mutató háromszöggel jelölt („max”) szigorúan nagyobb mindegyiknél."]],"lockout":[[null,"Les extrémités diffèrent d’au moins 4 ; l’intérieur est à l’extérieur.","Une ligne a des losanges à ses deux extrémités. Les deux chiffres des losanges diffèrent d’au moins 4, et chaque chiffre situé entre eux se trouve en dehors de l’intervalle fermé qu’ils délimitent (plus petit que le minimum ou plus grand que le maximum). 9×9 uniquement."],[null,"Gli estremi differiscono di ≥4; l’interno sta fuori.","Una linea ha dei rombi alle due estremità. Le due cifre dei rombi differiscono di almeno 4, e ogni cifra tra di esse si trova fuori dall’intervallo chiuso da esse delimitato (minore del minimo o maggiore del massimo). Solo 9×9."],[null,"Los extremos difieren en ≥4; el interior queda fuera.","Una línea tiene rombos en ambos extremos. Los dos dígitos de los rombos difieren en al menos 4, y cada dígito situado entre ellos queda fuera del intervalo cerrado que delimitan (menor que el mínimo o mayor que el máximo). Solo 9×9."],[null,"As extremidades diferem em ≥4; o interior fica fora.","Uma linha tem losangos nas duas extremidades. Os dois algarismos dos losangos diferem em pelo menos 4, e cada algarismo entre eles fica fora do intervalo fechado que delimitam (menor do que o mínimo ou maior do que o máximo). Só 9×9."],[null,"Die Enden unterscheiden sich um ≥4; das Innere liegt außerhalb.","Eine Linie hat an beiden Enden Rauten. Die beiden Rautenziffern unterscheiden sich um mindestens 4, und jede Ziffer dazwischen liegt außerhalb des von beiden aufgespannten abgeschlossenen Intervalls (kleiner als das Minimum oder größer als das Maximum). Nur 9×9."],[null,"A végek legalább 4-gyel különböznek; a belső kívül esik.","Egy vonal mindkét végén rombusz van. A két rombusz számjegye legalább 4-gyel különbözik, és minden közöttük lévő számjegy kívül esik az általuk kifeszített zárt intervallumon (kisebb a minimumnál vagy nagyobb a maximumnál). Csak 9×9."]],"doublearrow":[["Flèche double","Somme du milieu = somme des deux extrémités.","Une ligne avec un cercle à chaque extrémité : les chiffres entre les cercles ont pour somme la somme des deux chiffres des cercles. Les chiffres peuvent se répéter le long de la ligne s’ils ne partagent aucun groupe."],["Freccia doppia","Somma al centro = somma dei due estremi.","Una linea con un cerchio a ciascuna estremità: le cifre tra i cerchi hanno per somma la somma delle due cifre dei cerchi. Le cifre possono ripetersi lungo la linea se non condividono alcun gruppo."],["Flecha doble","Suma del medio = suma de los dos extremos.","Una línea con un círculo en cada extremo: los dígitos entre los círculos suman la suma de los dos dígitos de los círculos. Los dígitos pueden repetirse a lo largo de la línea si no comparten ningún grupo."],["Seta dupla","Soma do meio = soma das duas extremidades.","Uma linha com um círculo em cada extremidade: os algarismos entre os círculos somam a soma dos dois algarismos dos círculos. Os algarismos podem repetir-se ao longo da linha se não partilharem nenhum grupo."],["Doppelpfeil","Mittlere Summe = Summe der beiden Enden.","Eine Linie mit einem Kreis an jedem Ende: Die Ziffern zwischen den Kreisen ergeben zusammen die Summe der beiden Kreisziffern. Ziffern dürfen sich entlang der Linie wiederholen, wenn sie keine Gruppe teilen."],["Dupla nyíl","A középső összeg = a két vég összege.","Egy vonal mindkét végén körrel: a körök közötti számjegyek összege egyenlő a két körben lévő számjegy összegével. A számjegyek ismétlődhetnek a vonal mentén, ha nincs közös csoportjuk."]],"zipper":[[null,"Les paires symétriques totalisent le chiffre central.","Sur une ligne comptant un nombre impair de cases, les chiffres situés à égale distance de la case centrale (marquée d’un cercle) ont pour somme le chiffre central. Convention : chaque paire symétrique donne la même somme, égale au centre."],[null,"Le coppie simmetriche sommano la cifra centrale.","Su una linea con un numero dispari di celle, le cifre a uguale distanza dalla cella centrale (segnata con un cerchio) sommano la cifra centrale. Convenzione: ogni coppia simmetrica dà la stessa somma, uguale al centro."],[null,"Los pares simétricos suman el dígito central.","En una línea con un número impar de celdas, los dígitos a igual distancia de la celda central (marcada con un círculo) suman el dígito central. Convención: cada par simétrico da la misma suma, igual al centro."],[null,"Os pares simétricos somam o algarismo central.","Numa linha com um número ímpar de células, os algarismos a igual distância da célula central (marcada com um círculo) somam o algarismo central. Convenção: cada par simétrico dá a mesma soma, igual ao centro."],[null,"Symmetrische Paare ergeben die mittlere Ziffer.","Auf einer Linie mit ungerader Feldzahl ergeben Ziffern im gleichen Abstand vom Mittelfeld (mit einem Kreis markiert) zusammen die mittlere Ziffer. Konvention: Jedes symmetrische Paar ergibt dieselbe Summe, gleich der Mitte."],[null,"A szimmetrikus párok összege a középső számjegy.","Páratlan számú cellából álló vonalon a középső cellától (körrel jelölve) azonos távolságra lévő számjegyek összege a középső számjegy. Megállapodás: minden szimmetrikus pár ugyanazt az összeget adja, amely egyenlő a középpel."]],"rossini":[["Rossini","Flèche au bord : les trois premiers chiffres montent dans un sens.","Une flèche à l’extérieur de la grille indique que les trois premiers chiffres à partir de cette extrémité sont strictement monotones : ils augmentent dans le sens de la flèche (vers l’intérieur de la grille) ou, si la flèche pointe vers le bord, ils augmentent vers le bord, c’est-à-dire diminuent en allant vers l’intérieur. Convention : la pointe de la flèche désigne le plus grand chiffre. L’absence de flèche ne signifie rien (ce n’est pas la forme classique du Rossini, où les extrémités sans flèche excluent les suites monotones)."],["Rossini","Freccia sul bordo: le prime tre cifre salgono in un verso.","Una freccia fuori dalla griglia dice che le prime tre cifre da quell’estremità sono strettamente monotone: aumentano nella direzione della freccia (verso l’interno) oppure, se la freccia punta verso il bordo, aumentano verso il bordo, cioè diminuiscono andando verso l’interno. Convenzione: la punta della freccia indica la cifra più grande. Una freccia mancante non significa nulla (non è la forma classica del Rossini, in cui le estremità senza freccia escludono sequenze monotone)."],["Rossini","Flecha en el borde: los tres primeros dígitos suben en un sentido.","Una flecha fuera de la cuadrícula indica que los tres primeros dígitos desde ese extremo son estrictamente monótonos: aumentan en el sentido de la flecha (hacia dentro) o, si la flecha apunta hacia el borde, aumentan hacia el borde, es decir, disminuyen al ir hacia dentro. Convención: la punta de la flecha señala el dígito mayor. La ausencia de flecha no significa nada (no es la forma clásica del Rossini, donde los extremos sin flecha descartan tramos monótonos)."],["Rossini","Seta na margem: os três primeiros algarismos sobem num sentido.","Uma seta fora da grelha indica que os três primeiros algarismos a partir dessa extremidade são estritamente monótonos: aumentam no sentido da seta (para dentro) ou, se a seta apontar para a margem, aumentam em direção à margem, isto é, diminuem ao ir para dentro. Convenção: a ponta da seta aponta para o maior algarismo. A falta de seta não significa nada (não é a forma clássica do Rossini, em que as e
