['jigsaw','region','Jigsaw (neregulat)','Casete neregulate în loc de pătrate.','Casetele sunt regiuni neregulate de câte N celule (conturate gros). Fiecare rând, coloană și regiune conține fiecare cifră o dată. Fiecare puzzle are alte regiuni.','Jigsaw (irregular)','Irregular regions instead of square boxes.','Boxes are irregular regions of N cells each (thick outlines). Every row, column and region contains each digit once. Each puzzle has different regions.'],
['dg','region','Grupuri disjuncte','Aceeași poziție în casetă = grup.','Pe lângă regulile clasice: toate celulele aflate pe aceeași poziție în casetele lor (de ex. toate colțurile din stânga-sus) conțin fiecare cifră o dată.','Disjoint groups','Same position in each box = a group.','In addition to the classic rules: all cells in the same position within their boxes (for example all top-left corners) contain every digit once.'],
['center','region','Puncte centrale','Cele nouă centre de casetă sunt distincte.','Pe lângă regulile clasice, cele nouă celule centrale ale casetelor (marcate) conțin fiecare cifră o dată. Doar 9×9.','Centre dots','The nine box centres are all different.','In addition to the classic rules, the nine centre cells of the boxes (marked) contain every digit once. 9×9 only.'],
['antiknight','neigh','Anti-cal','Fără aceeași cifră la o mutare de cal.','Pe lângă regulile clasice, două celule aflate la o mutare de cal de șah nu pot conține aceeași cifră. Doar 9×9.','Anti-knight','No equal digits a knight\'s move apart.','In addition to the classic rules, two cells a chess knight\'s move apart cannot contain the same digit. 9×9 only.'],
['antiking','neigh','Anti-rege','Vecinii diagonali diferă.','Pe lângă regulile clasice, două celule vecine pe diagonală (mutare de rege) nu pot conține aceeași cifră. Doar 9×9.','Anti-king','Diagonal neighbours differ.','In addition to the classic rules, two diagonally adjacent cells (a king\'s move) cannot contain the same digit. 9×9 only.'],
['nonconsec','neigh','Fără consecutive','Vecinii nu sunt consecutivi.','Pe lângă regulile clasice, celulele vecine pe orizontală sau verticală nu pot conține cifre consecutive (de ex. 4 lângă 5). 9×9 și 6×6.','Non-consecutive','Neighbours are never consecutive.','In addition to the classic rules, orthogonally adjacent cells cannot contain consecutive digits (for example 4 next to 5). 9×9 and 6×6.'],
['miracle','neigh','Miracol','Anti-cal + anti-rege + fără consecutive.','Toate cele trei restricții de mai sus, simultan. Varianta este extrem de restrictivă: puzzle-urile au foarte puține indicii date.','Miracle','Anti-knight + anti-king + non-consecutive.','All three restrictions above at once. The variant is extremely restrictive: puzzles have very few givens.'],
['evenodd','mark','Par–impar','Pătrat = par, cerc = impar.','Celulele marcate cu pătrat conțin cifre pare, cele marcate cu cerc cifre impare. Restul regulilor sunt clasice.','Even–odd','Square = even, circle = odd.','Cells marked with a square contain even digits, cells marked with a circle odd digits. Other rules are classic.'],
['kropki','mark','Kropki','Puncte: consecutive sau dublu.','Punct alb între două celule: cifrele sunt consecutive. Punct negru: una este dublul celeilalte. Lipsa punctului: nu sunt nici consecutive, nici în raport 1:2 (toate punctele sunt date).','Kropki','Dots: consecutive or double.','A white dot between two cells: the digits are consecutive. A black dot: one is double the other. No dot: they are neither consecutive nor in ratio 1:2 (all dots are given).'],
['consec','mark','Consecutiv','Bară = consecutive; fără bară = nu.','O bară între două celule înseamnă cifre consecutive. Unde nu e bară, cifrele vecine nu sunt consecutive.','Consecutive','Bar = consecutive; no bar = not.','A bar between two cells means consecutive digits. Where there is no bar, neighbouring digits are not consecutive.'],
['xv','mark','XV','X = suma 10, V = suma 5.','X între două celule: suma lor este 10; V: suma este 5. Unde nu e semn, suma nu este nici 5, nici 10. Doar 9×9.','XV','X = sum 10, V = sum 5.','An X between two cells: their sum is 10; a V: their sum is 5. Where there is no sign, the sum is neither 5 nor 10. 9×9 only.'],
['greater','mark','Comparații','Semne mai mare / mai mic.','Semnul dintre două celule se deschide spre cifra mai mare.','Greater-than','Greater / less-than signs.','The sign between two cells opens towards the larger digit.'],
['batt','mark','Battenburg','Paritate în șah pe un 2×2.','Un marcaj în patru pătrate la intersecția a patru celule înseamnă că parități alternează ca pe o tablă de șah (două pare și două impare, pe diagonale). La intersecțiile nemarcate paritățile nu formează un asemenea model.','Battenburg','Chessboard parity on a 2×2.','A four-square mark at the corner shared by four cells means the parities alternate like a chessboard (two even and two odd, on the diagonals). At unmarked corners the parities do not form such a pattern.'],
['quad','mark','Cvadruple','Cercuri cu cifrele din 2×2.','Un cerc la intersecția a patru celule enumeră cifre care apar printre cele patru celule (cu repetări, dacă sunt repetate în cerc).','Quadruples','Circles listing digits of a 2×2.','A circle at the corner shared by four cells lists digits that appear among those four cells (repeated if they are repeated in the circle).'],
['killer','sum','Killer','Cuști cu sumă, fără repetări.','Grila este împărțită în cuști punctate; numărul din colț este suma cifrelor din cușcă. Într-o cușcă o cifră nu se repetă.','Killer','Cages with sums, no repeats.','The grid is divided into dashed cages; the number in the corner is the sum of the digits in the cage. A digit cannot repeat inside a cage.'],
['littlekiller','sum','Little Killer','Suma diagonalei, din margine.','Un număr cu săgeată în afara grilei este suma cifrelor de pe diagonala spre care arată; cifrele se pot repeta pe diagonală.','Little Killer','Diagonal sum from the edge.','A number with an arrow outside the grid is the sum of the digits on the diagonal it points along; digits may repeat on the diagonal.'],
['sandwich','outside','Sandwich','Suma dintre 1 și cea mai mare cifră.','Numărul din margine este suma cifrelor aflate între cifra 1 și cifra N (9 la 9×9) din rândul sau coloana respectivă.','Sandwich','Sum between 1 and the largest digit.','The number outside is the sum of the digits between the 1 and the digit N (9 in a 9×9 grid) in that row or column.'],
['xsum','outside','X-Sums','Prima cifră = câte celule se adună.','Dacă prima cifră a unui rând sau coloane este k, suma primelor k cifre (de la acel capăt) este numărul din margine.','X-Sums','The first digit says how many cells to add.','If the first digit of a row or column is k, the sum of the first k digits (from that end) is the number outside.'],
['frame','outside','Frame (primele trei)','Suma primelor trei cifre.','Numărul din margine este suma primelor trei cifre ale rândului sau coloanei, începând de la acel capăt.','Frame (first three)','Sum of the first three digits.','The number outside is the sum of the first three digits of the row or column, counting from that end.'],
['skyscraper','outside','Zgârie-nori','Câte clădiri se văd din margine.','Cifrele sunt înălțimi de clădiri. Numărul din margine arată câte clădiri se văd din acel capăt (o clădire ascunde pe cele mai joase din spatele ei).','Skyscrapers','How many buildings you can see.','Digits are building heights. The number outside shows how many buildings are visible from that end (a building hides lower ones behind it).'],
['thermo','line','Termometre','Cifre crescătoare de la bulb.','Pe fiecare termometru cifrele cresc strict începând de la bulb.','Thermometers','Digits rise from the bulb.','Along each thermometer the digits strictly increase starting from the bulb.'],
['arrow','line','Săgeți','Cerc = suma săgeții.','Cifra din cercul unei săgeți este egală cu suma cifrelor de pe săgeată.','Arrows','Circle = sum of the arrow.','The digit in the circle of an arrow equals the sum of the digits along the arrow.'],
['renban','line','Renban','Cifre consecutive pe linie.','Pe linia violetă cifrele formează un set de numere consecutive, în orice ordine, fără repetări.','Renban','Consecutive digits on a line.','On the purple line the digits form a set of consecutive numbers, in any order, with no repeats.'],
['whisper','line','Șoapte germane','Vecinii diferă cu cel puțin 5.','Pe linia verde, două cifre vecine diferă cu cel puțin 5. Doar 9×9.','German whispers','Neighbours differ by at least 5.','On the green line, two neighbouring digits differ by at least 5. 9×9 only.'],
['palindrome','line','Palindrom','Linia se citește la fel în ambele sensuri.','Cifrele de pe linia gri formează un palindrom.','Palindrome','The line reads the same both ways.','The digits on the grey line form a palindrome.'],
['between','line','Între linii','Interiorul e între capete.','Cifrele de pe linie, dintre cele două cercuri, sunt strict între cifrele din cercuri.','Between lines','The inside lies between the ends.','The digits on the line between the two circles lie strictly between the digits in the circles.'],
['entropic','line','Linii entropice','Joasă / medie / înaltă.','Pe linia portocalie, orice trei celule consecutive conțin câte o cifră din fiecare treime a intervalului (la 9×9: 1–3, 4–6, 7–9).','Entropic lines','Low / middle / high.','On the orange line, any three consecutive cells contain one digit from each third of the range (in 9×9: 1–3, 4–6, 7–9).'],
['modular','line','Linii modulare','Resturi diferite mod 3.','Pe linia turcoaz, orice trei celule consecutive au resturi diferite la împărțirea cu 3.','Modular lines','Different remainders mod 3.','On the teal line, any three consecutive cells have different remainders when divided by 3.'],
['samurai','composite','Samurai','Cinci grile suprapuse.','Cinci grile 9×9 suprapuse în colțuri; casetele comune se completează o singură dată.','Samurai','Five overlapping grids.','Five 9×9 grids overlapping at the corners; shared boxes are filled in only once.'],
['twodoku','composite','Twodoku','Două grile care au o casetă comună.','Două grile 9×9 care au o casetă comună.','Twodoku','Two grids sharing a box.','Two 9×9 grids that share one box.'],
['gattai3','composite','Gattai-3','Trei grile în lanț.','Trei grile 9×9 legate în diagonală, fiecare pereche vecină având o casetă comună.','Gattai-3','Three grids in a chain.','Three 9×9 grids linked diagonally, each neighbouring pair sharing one box.'],
['futoshiki','cousin','Futoshiki','Pătrat latin cu semne de inegalitate.','Fiecare rând și coloană conțin cifrele 1–N o dată; semnele < și > dintre celule trebuie respectate. Rudă apropiată a sudoku-ului, fără casete.','Futoshiki','Latin square with inequality signs.','Each row and column contains the digits 1–N once; the < and > signs between cells must hold. A close relative of sudoku, without boxes.'],
['kenken','cousin','KenKen (Calcudoku)','Pătrat latin cu cuști aritmetice.','Fiecare rând și coloană conțin cifrele 1–N o dată; fiecare cușcă are un rezultat și o operație (+, −, ×, ÷). Cifrele se pot repeta într-o cușcă dacă nu sunt pe același rând sau coloană.','KenKen (Calcudoku)','Latin square with arithmetic cages.','Each row and column contains the digits 1–N once; each cage has a target and an operation (+, −, ×, ÷). Digits may repeat inside a cage if they are not in the same row or column.'],
["girandola","region","Girandola","Încă un grup de 9 celule în formă de morișcă.","Pe lângă regulile clasice, cele nouă celule marcate (cele patru colțuri, centrul și cele patru celule aflate cu un pas înăuntru față de mijlocul fiecărei laturi: r2c5, r5c2, r5c8, r8c5) trebuie să conțină cifrele 1–9, fiecare o dată. Așa e descris Girandola în Regexp::Sudoku (forma de morișcă); alte surse nu dau coordonatele exacte. Doar 9×9.","Girandola","One more group of 9 cells in a pinwheel shape.","On top of the classic rules, the nine marked cells (the four corners, the centre and the four cells one step inside the midpoint of each side: r2c5, r5c2, r5c8, r8c5) must hold 1–9 once each. This is how Girandola is described in Regexp::Sudoku (the pinwheel shape); other sources do not give exact coordinates. 9×9 only."],
["sparse9","region","Nouă dispersate","Încă un grup de 9 celule: colțuri, mijloace de laturi, centru.","Pe lângă regulile clasice, cele nouă celule marcate (cele patru colțuri, mijloacele celor patru laturi și celula centrală) trebuie să conțină cifrele 1–9, fiecare o dată. Aceasta era dispunerea numită anterior „Girandola” în această aplicație; nu am găsit-o publicată sub un nume. Doar 9×9.","Scattered nine","One more group of 9 cells: corners, side midpoints, centre.","On top of the classic rules, the nine marked cells (the four corners, the midpoints of the four sides and the centre cell) must hold 1–9 once each. This is the layout this app previously called “Girandola”; I found no published name for it. 9×9 only."],
["asterisk","region","Asterisk","Un grup în formă de asterisc.","Cele nouă celule marcate, dispuse ca un asterisc în jurul centrului (centrul, patru la distanță 3 pe orizontală și verticală, patru pe diagonale la distanță 2), trebuie să conțină cifrele 1–9, fiecare o dată, pe lângă regulile clasice. Doar 9×9.","Asterisk","One group shaped like an asterisk.","The nine marked cells, laid out as an asterisk around the centre (the centre, four at distance 3 horizontally and vertically, four on the diagonals at distance 2), must contain 1–9 once each, on top of the classic rules. 9×9 only."],
["diag1","region","Diagonală simplă","Doar diagonala principală e specială.","Diagonala principală (din stânga-sus în dreapta-jos) conține fiecare cifră exact o dată, pe lângă regulile clasice. Cealaltă diagonală nu are restricții.","Single diagonal","Only the main diagonal is special.","The main diagonal (top-left to bottom-right) contains each digit exactly once, on top of the classic rules. The other diagonal has no restriction."],
["dutch","line","Șoapte olandeze","Vecinii diferă cu cel puțin 4.","Pe linia verde, oricare două cifre vecine diferă cu cel puțin 4 (la șoaptele germane pragul este 5). Linia poate trece diagonal. Cifrele se pot repeta dacă nu sunt pe același rând, coloană sau casetă. Doar 9×9.","Dutch whispers","Neighbours differ by at least 4.","On the green line, any two neighbouring digits differ by at least 4 (German whispers use 5). The line may pass diagonally. Digits may repeat if they do not share a row, column or box. 9×9 only."],
["nabner","line","Nabner","Fără repetări și fără consecutive pe linie.","Pe o linie maro, nicio cifră nu se repetă și nicio pereche de cifre de pe linie (nu doar vecine) nu este formată din numere consecutive. E opusul lui Renban: de aici numele.","Nabner","No repeats and no consecutive digits on a line.","On a brown line, no digit repeats and no two digits on the line (not only neighbours) are consecutive numbers. It is the opposite of Renban, hence the name."],
["slowthermo","line","Termometru lent","Cifrele nu scad de la bulb.","Pe fiecare termometru lent cifrele cresc sau rămân egale începând de la bulb; două cifre egale pot apărea doar în celule care nu împart un rând, o coloană sau o casetă (de pildă pe diagonală). Termometrele pot trece diagonal.","Slow thermometer","Digits never decrease from the bulb.","Along each slow thermometer the digits increase or stay equal starting from the bulb; equal digits can only occur in cells that share no row, column or box (for instance diagonally). Thermometers may pass diagonally."],
["parityline","line","Linie de paritate","Paritatea alternează.","Pe linia galbenă, două cifre vecine au mereu parități diferite: par, impar, par… sau invers. Convenție: aceasta este varianta „alternantă”; varianta cu aceeași paritate este fișa separată „Linie de aceeași paritate”.","Parity line","Parity alternates.","On the yellow line, two neighbouring digits always have different parity: even, odd, even… or the reverse. Convention: this is the \"alternating\" version; the same-parity version has its own card, \"Same-parity line\"."],
["sameparity","line","Linie de aceeași paritate","Toate cifrele vecine au aceeași paritate.","Pe linia indigo, două cifre vecine au aceeași paritate: întreaga linie este fie doar pare, fie doar impare (nu se spune care).","Same-parity line","Neighbouring digits share parity.","On the indigo line, two neighbouring digits have the same parity, so the whole line is either all even or all odd (which one is not given)."],
["evenonly","mark","Doar pare marcate","Celulele umbrite sunt pare.","Fiecare celulă marcată cu pătrat gri conține o cifră pară. Celulele nemarcate nu sunt spuse: pot fi orice. Diferă de Par–impar, unde sunt marcate ambele tipuri.","Marked evens only","Shaded cells are even.","Every cell marked with a grey square holds an even digit. Unmarked cells say nothing: they may be anything. It differs from Even–odd, where both kinds are marked."],
["oddonly","mark","Doar impare marcate","Celulele rotunde sunt impare.","Fiecare celulă marcată cu cerc gri conține o cifră impară. Celulele nemarcate nu sunt spuse: pot fi orice.","Marked odds only","Circled cells are odd.","Every cell marked with a grey circle holds an odd digit. Unmarked cells say nothing: they may be anything."],
["luk","sum","Little Killer unic","Little Killer cu cifre distincte pe diagonală.","Numărul de lângă o săgeată oblică este suma cifrelor de pe diagonala spre care arată, iar pe fiecare asemenea diagonală cifrele sunt toate diferite (aici e deosebirea față de Little Killer clasic). Numele „Little Unique Killer” este folosit de această aplicație; nu l-am găsit ca variantă publicată sub acest nume.","Little Unique Killer","Little Killer with distinct digits on the diagonal.","The number next to a slanted arrow is the sum of the digits on the diagonal it points along, and on each such diagonal all digits are different (the difference from classic Little Killer). The name “Little Unique Killer” is this app’s own; I found no published variant under that name."],
["fortress","mark","Fortăreață","Celulele umbrite sunt mai mari decât vecinii.","O celulă umbrită este mai mare decât toți vecinii ei ortogonali care nu sunt umbriți. Între două celule umbrite alăturate nu se impune nimic.","Fortress","Shaded cells beat their neighbours.","A shaded cell is greater than every orthogonal neighbour that is not shaded. Nothing is imposed between two adjacent shaded cells."],
["minmax","mark","Minim / Maxim","Celule mai mici sau mai mari decât toți vecinii.","O celulă marcată cu triunghi în jos („min”) este strict mai mică decât toți vecinii ei ortogonali; una marcată cu triunghi în sus („max”) este strict mai mare decât toți.","Min / Max","Cells smaller or larger than all neighbours.","A cell marked with a downward triangle (\"min\") is strictly smaller than all its orthogonal neighbours; one marked with an upward triangle (\"max\") is strictly larger than all of them."],
["lockout","line","Lockout","Capetele diferă cu ≥4; între ele, cifrele sunt în afară.","La capetele unei linii sunt două romburi. Cifrele din romburi diferă cu cel puțin 4, iar toate cifrele dintre ele sunt în afara intervalului închis dintre cele două (mai mici decât minimul sau mai mari decât maximul). Doar 9×9.","Lockout","Ends differ by ≥4; the inside lies outside.","A line has diamonds at both ends. The two diamond digits differ by at least 4, and every digit between them lies outside the closed interval spanned by the two (smaller than the minimum or larger than the maximum). 9×9 only."],
["doublearrow","line","Săgeată dublă","Suma din mijloc = suma capetelor.","O linie cu cerc la ambele capete: suma cifrelor dintre cercuri este egală cu suma celor două cifre din cercuri. Cifrele se pot repeta pe linie dacă nu împart un grup.","Double arrow","Middle sum = sum of the two ends.","A line with a circle at each end: the digits between the circles sum to the sum of the two circle digits. Digits may repeat along the line when they share no group."],
["zipper","line","Zipper","Perechile simetrice însumează cifra din centru.","Pe o linie cu număr impar de celule, cifrele aflate la aceeași distanță de celula centrală (marcată cu cerc) însumează cifra centrală. Convenție: toate perechile simetrice dau aceeași sumă, egală cu centrul.","Zipper","Symmetric pairs add up to the centre digit.","On a line with an odd number of cells, digits at equal distance from the centre cell (marked with a circle) add up to the centre digit. Convention: every symmetric pair gives the same sum, equal to the centre."],
["rossini","outside","Rossini","Săgeată pe margine: primele trei cifre cresc într-un sens.","O săgeată în afara grilei arată că primele trei cifre pornind din acel capăt sunt strict monotone: cresc în sensul în care arată săgeata (spre interiorul grilei) sau, dacă săgeata arată spre margine, cresc spre margine, adică scad spre interior. Convenție: vârful săgeții arată spre cifra cea mai mare. Lipsa unei săgeți nu spune nimic (nu e varianta Rossini clasică, în care capetele fără săgeată exclud șirurile monotone).","Rossini","Edge arrow: the first three digits rise one way.","An arrow outside the grid says the first three digits from that end are strictly monotone: they increase in the direction of the arrow (into the grid) or, if the arrow points towards the edge, they increase towards the edge, i.e. decrease going inwards. Convention: the arrowhead points to the largest digit. A missing arrow means nothing (this is not the classic Rossini form, where ends without an arrow rule out monotone runs)."],
["outside","outside","Outside","Cifrele de pe margine apar printre primele trei.","Cifrele scrise în afara grilei trebuie să apară printre primele trei celule ale rândului sau coloanei respective, începând de la acel capăt, în orice ordine. Dacă sunt trei cifre, ele sunt exact cele trei celule.","Outside","Edge digits appear among the first three cells.","Digits written outside the grid must appear among the first three cells of that row or column counted from that end, in any order. If three digits are given, they are exactly those three cells."],
["clone","region","Clone","Zone identice conțin aceleași cifre.","Două sau mai multe zone colorate la fel au aceeași formă și cifre identice în celulele corespunzătoare (după aceeași translație). Zonele nu se suprapun, iar celulele corespondente nu împart un rând, o coloană sau o casetă.","Clone","Identical regions hold the same digits.","Two or more regions in the same colour have the same shape and identical digits in corresponding cells (under the same translation). Regions do not overlap, and corresponding cells share no row, column or box."],
["regionsum","line","Linii cu sume pe regiuni","Suma pe fiecare casetă traversată e aceeași.","Pe linia roz, suma cifrelor din fiecare casetă prin care trece linia este aceeași pentru toate casetele traversate (linia atinge cel puțin două casete). Se adună toate celulele liniei din caseta respectivă. Convenție: dacă linia iese dintr-o casetă și reintră în ea, celulele din cele două treceri se adună împreună (în rețetele publicate fiecare segment continuu se adună separat).","Region sum lines","Equal sum in every box crossed.","On the pink line, the sum of the digits inside each box the line crosses is the same for all boxes crossed (the line touches at least two boxes). All cells of the line inside that box are added. Convention: if the line leaves a box and re-enters it, the cells from both passes are added together (published rules sum each continuous segment separately)."],
["avgarrow","line","Săgeată medie","Cercul = media cifrelor de pe săgeată.","Cifra din cerc este media aritmetică a cifrelor de pe săgeată (suma cifrelor săgeții = numărul lor × cifra din cerc). Semnul μ marchează varianta.","Average arrow","Circle = mean of the arrow digits.","The digit in the circle is the arithmetic mean of the digits on the arrow (their sum = their count × the circle digit). The sign μ marks the variant."],
["prodarrow","line","Săgeată produs","Cercul = produsul cifrelor de pe săgeată.","Cifra din cerc este egală cu produsul cifrelor de pe săgeată. Semnul × marchează varianta. Săgețile au 2–3 celule.","Product arrow","Circle = product of the arrow digits.","The digit in the circle equals the product of the digits on the arrow. The sign × marks the variant. Arrows have 2–3 cells."],
["pillarrow","line","Săgeată „pilulă”","Pilula formează un număr de două cifre.","Cele două celule din pilulă formează un număr de două cifre (zeci, unități); suma cifrelor de pe săgeată este egală cu acel număr. Doar 9×9, deci pilula începe cu 1–4 în aceste puzzle-uri.","Pill arrow","The pill forms a two-digit number.","The two cells in the pill form a two-digit number (tens, units); the digits along the arrow sum to that number. 9×9 only, so in these puzzles the pill starts with 1–4."],
["strimko","cousin","Strimko","Lanțuri în loc de casete.","Fiecare rând, coloană și lanț (cercuri unite prin linii, conexe și pe diagonală) conține fiecare cifră exact o dată. Nu există casete. Mărimi 4–7.","Strimko","Chains instead of boxes.","Every row, column and chain (circles joined by lines, connected also diagonally) contains each digit exactly once. There are no boxes. Sizes 4–7."],
["indexing","mark","Indexare","Prima cifră din rând arată unde e 1.","În fiecare rând, cifra din prima celulă (cea din stânga) indică numărul coloanei în care se află cifra 1 din acel rând. Dacă prima celulă conține 1, atunci 1 este chiar acolo. Convenție: sursele descriu mai multe forme de „indexare”; aici am ales aceasta, doar pe rânduri.","Indexing","The first digit of a row says where the 1 is.","In every row, the digit in the first (leftmost) cell gives the column number where the 1 of that row sits. If the first cell holds 1, then the 1 is right there. Convention: sources describe several forms of \"indexing\"; this card uses this one, on rows only."],
["ratio","mark","Raport ×3","Puncte pentru perechi în raport 3:1.","Pe muchia dintre două celule alăturate, un cerc cu 3 înseamnă că una dintre cifre este triplul celeilalte (1–3, 2–6 sau 3–9). Conform convenției Kropki, dacă nu există cerc, cifrele alăturate NU sunt în raport 3:1. Convenție aleasă de aplicație: sursele descriu variantele „ratio” vag, iar aici „raport” înseamnă strict factorul 3.","Ratio ×3","Dots for pairs in 3:1 ratio.","On the edge between two adjacent cells, a circle with a 3 means one digit is three times the other (1–3, 2–6 or 3–9). As with Kropki, if there is no circle, adjacent digits are NOT in a 3:1 ratio. Convention chosen by this app: sources describe \"ratio\" variants vaguely, so here \"ratio\" strictly means factor 3."],
["fog","line","Ceață","Indiciile apar pe măsură ce rezolvi.","Indiciile (termometre, săgeți, Renban) sunt ascunse în ceață. O celulă este luminată dacă ea sau un vecin al ei (și pe diagonală) este dată sau completată corect; un indiciu devine vizibil când cel puțin una dintre celulele lui este luminată. Puzzle-ul e construit astfel încât, pornind doar de la ce se vede, propagarea logică simplă (candidați unici) să poată continua până la capăt. Conflictele sunt arătate doar pentru indiciile vizibile.","Fog of war","Clues appear as you solve.","Clues (thermometers, arrows, Renban) are hidden in fog. A cell is lit if it or one of its neighbours (diagonals included) is given or correctly filled in; a clue becomes visible once at least one of its cells is lit. The puzzle is built so that, starting only from what is visible, simple logic (single candidates) can carry on to the end. Conflicts are shown only for visible clues."],
["antibishop", "topo", "Anti-alfil", "Fără aceeași cifră la doi pași pe diagonală.", "Pe lângă regulile clasice, două celule aflate la exact doi pași pe diagonală (câte 2 rânduri și 2 coloane distanță, mutarea „alfil” din șahul fairy) nu pot conține aceeași cifră. Nu e alfilul glisant (acela ar impune diagonale întregi); e doar saltul de 2×2. Mărimi 9×9 și 6×6.", "Anti-alfil", "No equal digits two diagonal steps apart.", "In addition to the classic rules, two cells exactly two steps apart diagonally (2 rows and 2 columns away; the fairy-chess “alfil” leap) cannot hold the same digit. This is the 2×2 leap, not the sliding bishop (which would force whole diagonals). Sizes 9×9 and 6×6."],
["anticamel", "topo", "Anti-cămilă", "Fără aceeași cifră la un salt de cămilă (1,3).", "Pe lângă regulile clasice, două celule la un salt de cămilă (1 rând și 3 coloane, sau 3 rânduri și 1 coloană) nu pot conține aceeași cifră. Doar 9×9.", "Anti-camel", "No equal digits a camel’s leap (1,3) apart.", "In addition to the classic rules, two cells a camel’s leap apart (1 row and 3 columns, or 3 rows and 1 column) cannot hold the same digit. 9×9 only."],
["antizebra", "topo", "Anti-zebră", "Fără aceeași cifră la un salt de zebră (2,3).", "Pe lângă regulile clasice, două celule la un salt de zebră (2 rânduri și 3 coloane, sau 3 rânduri și 2 coloane) nu pot conține aceeași cifră. Doar 9×9.", "Anti-zebra", "No equal digits a zebra’s leap (2,3) apart.", "In addition to the classic rules, two cells a zebra’s leap apart (2 rows and 3 columns, or 3 rows and 2 columns) cannot hold the same digit. 9×9 only."],
["torusking", "topo", "Tor anti-rege", "Anti-rege pe o grilă care se închide ca un tor.", "Grila se continuă pe margini: marginea de sus se lipește de cea de jos, stânga de dreapta. Două celule vecine pe diagonală (mutare de rege), inclusiv peste margine, nu pot conține aceeași cifră (de ex. colțul din stânga-sus este vecin diagonal cu cel din dreapta-jos). Doar 9×9.", "Torus anti-king", "Anti-king on a grid that wraps like a torus.", "The grid continues across the edges: top glued to bottom, left to right. Two cells a king’s move apart, including across an edge, cannot hold the same digit (for example the top-left corner is diagonal to the bottom-right corner). 9×9 only."],
["torusknight", "topo", "Tor anti-cal", "Anti-cal pe o grilă care se închide ca un tor.", "Grila se continuă pe margini (sus cu jos, stânga cu dreapta). Două celule la o mutare de cal, inclusiv peste margine, nu pot conține aceeași cifră. Doar 9×9.", "Torus anti-knight", "Anti-knight on a grid that wraps like a torus.", "The grid continues across the edges (top to bottom, left to right). Two cells a knight’s move apart, including across an edge, cannot hold the same digit. 9×9 only."],
["cylking", "topo", "Cilindru anti-rege", "Stânga se lipește de dreapta; sus și jos rămân margini.", "Marginea din stânga se lipește de cea din dreapta, ca pe un cilindru; sus și jos nu se lipesc. Două celule la o mutare de rege (inclusiv peste lipitura stânga–dreapta) nu pot conține aceeași cifră. Doar 9×9.", "Cylinder anti-king", "Left glued to right; top and bottom stay edges.", "The left edge is glued to the right edge like a cylinder; top and bottom are not glued. Two cells a king’s move apart (including across the left–right seam) cannot hold the same digit. 9×9 only."],
["mobiusking", "topo", "Möbius anti-rege", "Stânga se lipește de dreapta cu o răsucire.", "Marginea din stânga se lipește de cea din dreapta cu o răsucire (rândul r se leagă de rândul 10−r), ca o bandă Möbius. Două celule la o mutare de rege, inclusiv peste lipitură, nu pot conține aceeași cifră. Doar 9×9. Convenția de lipire este cea descrisă aici.", "Möbius anti-king", "Left glued to right with a twist.", "The left edge is glued to the right edge with a twist (row r joins row 10−r), like a Möbius strip. Two cells a king’s move apart, including across the seam, cannot hold the same digit. 9×9 only. The gluing convention is the one described here."],
["kleinking", "topo", "Klein anti-rege", "Sticlă Klein: stânga–dreapta cu răsucire, sus–jos simplu.", "Marginea din stânga se lipește de cea din dreapta cu o răsucire (rândul r se leagă de rândul 10−r), iar sus se lipește de jos fără răsucire — o sticlă Klein. Două celule la o mutare de rege, inclusiv peste lipituri, nu pot conține aceeași cifră. Doar 9×9. Convenția de lipire este cea descrisă aici.", "Klein anti-king", "Klein bottle: left–right twisted, top–bottom plain.", "The left edge is glued to the right edge with a twist (row r joins row 10−r), and top is glued to bottom without a twist: a Klein bottle. Two cells a king’s move apart, including across seams, cannot hold the same digit. 9×9 only. The gluing convention is the one described here."],
["projking", "topo", "Plan proiectiv anti-rege", "Ambele perechi de margini se lipesc cu răsucire.", "Stânga se lipește de dreapta cu răsucire (rândul r cu 10−r) și sus de jos cu răsucire (coloana c cu 10−c): un plan proiectiv real. Două celule la o mutare de rege, inclusiv peste lipituri, nu pot conține aceeași cifră. Doar 9×9. Convenția de lipire este cea descrisă aici.", "Projective-plane anti-king", "Both pairs of edges glued with a twist.", "Left is glued to right with a twist (row r joins 10−r) and top to bottom with a twist (column c joins 10−c): a real projective plane. Two cells a king’s move apart, including across seams, cannot hold the same digit. 9×9 only. The gluing convention is the one described here."],
["pandiag", "region", "Pandiagonal", "Pătrat latin cu toate diagonalele rupte.", "Pătrat latin (fără casete) în care, în plus, toate diagonalele „rupte” (care se continuă pe margine, ca pe un tor) în ambele direcții conțin fiecare cifră o dată. Mărimile 5 și 7 (pentru 4, 6, 8, 9 nu există astfel de pătrate).", "Pandiagonal", "Latin square with all broken diagonals.", "A Latin square (no boxes) in which, additionally, all “broken” diagonals (continuing across the edge as on a torus) in both directions contain each digit once. Sizes 5 and 7 (for 4, 6, 8, 9 no such squares exist)."],
["zero", "size", "Sudoku cu zero", "Cifrele merg de la 0 la N−1.", "Același joc ca Clasicul; singura diferență este că simbolurile sunt 0…N−1 (la 9×9: 0–8). Regulile sunt cele clasice, deci e mai degrabă o variantă de afișare.", "Zero Sudoku", "Digits run from 0 to N−1.", "The same game as Classic; only the symbols differ: 0…N−1 (at 9×9: 0–8). The rules are the classic ones, so this is more of a display variant."],
["symcomp", "global", "Simetrie complementară", "Celulele simetrice față de centru însumează N+1.", "Pe lângă regulile clasice, oricare două celule simetrice față de centrul grilei (rotire 180°) însumează N+1 (la 9×9: 10). Celula centrală este deci 5. Mărimi 9×9 și 4×4.", "Complementary symmetry", "Cells opposite through the centre sum to N+1.", "In addition to the classic rules, any two cells symmetric about the centre of the grid (180° rotation) sum to N+1 (at 9×9: 10); at 9×9 the centre cell is therefore 5. Sizes 9×9 and 4×4."],
["symparity", "global", "Paritate simetrică", "Celulele simetrice față de centru au aceeași paritate.", "Pe lângă regulile clasice, oricare două celule simetrice față de centrul grilei (rotire 180°) sunt ambele pare sau ambele impare.", "Symmetric parity", "Cells opposite through the centre share parity.", "In addition to the classic rules, any two cells symmetric about the centre of the grid (180° rotation) are both even or both odd."],
["cgrav", "global", "Centru de greutate", "Fiecare rând stă în echilibru ca un balansoar.", "Pe lângă regulile clasice, fiecare rând este în echilibru: dacă pozițiile se numerotează −4…+4 și fiecare cifră e o greutate, suma greutăților × pozițiilor este 0 (centrul de greutate este exact la mijloc). Doar 9×9; generarea poate dura câteva secunde la Ușor și până la ~20 s la Greu.", "Centre of gravity", "Every row balances like a seesaw.", "In addition to the classic rules, every row is balanced: number the positions −4…+4 and treat each digit as a weight; the sum of weight × position is 0 (the centre of gravity is exactly in the middle). 9×9 only; generation can take a few seconds at Easy and up to ~20 s at Hard."],
["lexrows", "global", "Rânduri lexicografice", "Rândurile cresc ca niște cuvinte (prima coloană: 1…N).", "Pe lângă regulile clasice, citind rândurile de sus în jos ca „cuvinte” de cifre, fiecare rând este strict mai mic lexicografic decât cel de dedesubt (se compară prima cifră diferită). Deoarece prima coloană conține cifre diferite, regula înseamnă de fapt că prima coloană, citită de sus în jos, este 1, 2, …, N.", "Lexicographic rows", "Rows increase like dictionary words.", "In addition to the classic rules, reading the rows top to bottom as digit “words”, each row is strictly smaller lexicographically than the one below it (compare at the first differing digit). Since the first column holds different digits, the rule in effect means that the first column, read top to bottom, is 1, 2, …, N."],
["extremes", "global", "Extreme alăturate", "Minimul și maximul din casetă se ating.", "Pe lângă regulile clasice, în fiecare casetă cifrele 1 și N stau în celule vecine, inclusiv pe diagonală (mutare de rege). Convenția „inclusiv diagonală” este aleasă aici: cu vecini doar ortogonali nu există grile 9×9 (verificat exhaustiv).", "Touching extremes", "The smallest and largest digit of each box touch.", "In addition to the classic rules, in each box the digits 1 and N lie in neighbouring cells, diagonals included (king’s move). Including diagonals is the convention chosen here: with orthogonal neighbours only, no 9×9 grid exists (checked exhaustively)."],
["boxbalance", "global", "Casete echilibrate", "Prima și ultima coloană a casetei au aceeași sumă.", "Pe lângă regulile clasice, în fiecare casetă suma celor din coloana din stânga este egală cu suma celor din coloana din dreapta.", "Balanced boxes", "First and last box column have equal sums.", "In addition to the classic rules, in every box the sum of the left column equals the sum of the right column."],
["lonely5", "global", "Cincele singuratic", "Un 5 are doar vecini pari.", "Pe lângă regulile clasice, orice 5 are numai vecini ortogonali pari. Mărimi 9×9 și 6×6.", "Lonely 5", "A 5 has only even neighbours.", "In addition to the classic rules, every 5 has only even orthogonal neighbours (so an odd digit never touches a 5). Sizes 9×9 and 6×6."],
["nolonely", "global", "Fără celule singure", "Fiecare celulă are un vecin consecutiv.", "Pe lângă regulile clasice, fiecare celulă are cel puțin un vecin ortogonal a cărui cifră diferă cu exact 1.", "No lonely cells", "Every cell has a consecutive neighbour.", "In addition to the classic rules, every cell has at least one orthogonal neighbour whose digit differs from its own by exactly 1."],
["noprog", "global", "Fără progresii", "Trei cifre alăturate nu formează progresie aritmetică.", "Pe lângă regulile clasice, trei celule alăturate pe un rând sau pe o coloană nu pot forma o progresie aritmetică (de ex. 2-4-6 sau 7-5-3 sunt interzise).", "No arithmetic progressions", "No three neighbours form an arithmetic progression.", "In addition to the classic rules, three adjacent cells in a row or column cannot form an arithmetic progression (for example 2-4-6 or 7-5-3 are forbidden)."],
["semimagic", "global", "Casete semi-magice", "Rândurile fiecărei casete însumează 15; la fel coloanele.", "Pe lângă regulile clasice, fiecare rând și fiecare coloană a fiecărei casete însumează 15. Casetele complet magice (cu diagonale) sunt imposibile, deoarece cele trei casete dintr-o bandă ar avea toate centrul 5 în același rând al grilei; de aceea diagonalele nu sunt constrânse. Doar 9×9 (la 4×4 rândurile și coloanele ar cere casete cu cifre repetate).", "Semi-magic boxes", "Rows and columns of every box sum to 15.", "In addition to the classic rules, every row and every column of every box sums to 15. Fully magic boxes (with diagonals) are impossible, since the three boxes of one band would all need centre 5 in the same grid row; so the diagonals are not constrained. 9×9 only (at 4×4 rows and columns would need boxes with repeated digits)."],
["radar", "outside", "Radar", "Indiciul spune unde e cel mai mare.", "Pe lângă regulile clasice, un număr în afara grilei arată pe ce poziție (numărând de la acel capăt) se află cifra cea mai mare (9 la 9×9) în rândul sau coloana respectivă.", "Radar", "The clue tells where the biggest digit is.", "In addition to the classic rules, a number outside the grid gives the position (counted from that end) of the largest digit (9 at 9×9) in that row or column."],
["sandnum", "outside", "Sandwich numeric", "Câte celule sunt între 1 și N.", "Pe lângă regulile clasice, un număr în afara grilei spune câte celule se află între cifra 1 și cifra N (9 la 9×9) în rândul sau coloana respectivă.", "Counting sandwich", "How many cells lie between 1 and N.", "In addition to the classic rules, a number outside the grid says how many cells lie between the digit 1 and the digit N (9 at 9×9) in that row or column."],
["sandpar", "outside", "Sandwich de paritate", "Câte cifre impare sunt între 1 și N.", "Pe lângă regulile clasice, un număr în afara grilei spune câte cifre impare se află între 1 și N în rândul sau coloana respectivă.", "Parity sandwich", "How many odd digits lie between 1 and N.", "In addition to the classic rules, a number outside the grid says how many odd digits lie between 1 and N in that row or column."],
["sand2", "outside", "Sandwich dublu", "Două sume: între 1 și 9, între 2 și 8.", "Pe lângă regulile clasice, indiciul „a,b” din afara grilei arată: a = suma cifrelor dintre 1 și 9, b = suma cifrelor dintre 2 și 8 în rândul sau coloana respectivă. Doar 9×9.", "Double sandwich", "Two sums: between 1 and 9, between 2 and 8.", "In addition to the classic rules, a clue “a,b” outside the grid means: a = sum of the digits between 1 and 9, b = sum of the digits between 2 and 8 in that row or column. 9×9 only."],
["subsol", "outside", "Subsol", "Ca Zgârie-norii, dar cu cifrele inversate.", "Pe lângă regulile clasice, un număr în afara grilei arată de câte ori, privind dinspre acel capăt, apare o cifră mai mică decât toate cele de dinaintea ei (prima cifră contează). Este opusul zgârie-norilor: aici numărăm minimele succesive. Este Zgârie-norii cu cifrele inversate (d devine N+1−d), deci logic izomorfă cu aceasta.", "Basement", "Like Skyscrapers, but with the digits reversed.", "In addition to the classic rules, a number outside the grid says how many times, looking from that end, a digit appears that is smaller than all digits before it (the first digit counts). It is the opposite of skyscrapers: here we count successive minima. It is Skyscrapers with the digits reversed (d becomes N+1−d), hence logically isomorphic to it."],
["prodmargin", "outside", "Produs la margine", "Produsul primelor două cifre.", "Pe lângă regulile clasice, un număr în afara grilei este produsul primelor două cifre din rândul sau coloana respectivă, privind dinspre acel capăt.", "Edge product", "Product of the first two digits.", "In addition to the classic rules, a number outside the grid is the product of the first two digits in that row or column, seen from that end."],
["diffmargin", "outside", "Diferență la margine", "Diferența primelor două cifre.", "Pe lângă regulile clasice, un număr în afara grilei este diferența (în valoare absolută) dintre primele două cifre din rândul sau coloana respectivă, privind dinspre acel capăt.", "Edge difference", "Difference of the first two digits.", "In addition to the classic rules, a number outside the grid is the absolute difference of the first two digits in that row or column, seen from that end."],
["ascents", "outside", "Urcări", "Câte perechi vecine cresc.", "Pe lângă regulile clasice, un număr în afara grilei spune de câte ori, privind dinspre acel capăt, o cifră este urmată imediat de una mai mare.", "Ascents", "How many neighbouring pairs go up.", "In addition to the classic rules, a number outside the grid says how many times, looking from that end, a digit is immediately followed by a larger one."],
["inversions", "outside", "Inversiuni", "Câte perechi sunt în ordine inversă.", "Pe lângă regulile clasice, un număr în afara grilei este numărul de inversiuni ale rândului/coloanei privit dinspre acel capăt: câte perechi de cifre (nu neapărat vecine) au cea mai din față mai mare decât cea de după ea.", "Inversions", "How many pairs are out of order.", "In addition to the classic rules, a number outside the grid is the number of inversions of that row/column seen from that end: how many pairs of digits (not necessarily adjacent) have the earlier one larger than the later one."],
["cycles", "outside", "Cicluri", "Câte cicluri are permutarea.", "Pe lângă regulile clasice, rândul/coloana citit dinspre capăt este o permutare (poziția i are cifra a_i). Indiciul din afara grilei este numărul de cicluri ale permutării (poziția i trimite la poziția a_i). Mărimi 9×9 și 6×6.", "Cycles", "How many cycles the permutation has.", "In addition to the classic rules, a row/column read from that end is a permutation (position i holds digit a_i). The clue outside is the number of cycles of the permutation (position i points to position a_i). Sizes 9×9 and 6×6."],
["fixedpts", "outside", "Puncte fixe", "Câte cifre stau pe poziția lor.", "Pe lângă regulile clasice, un număr în afara grilei spune câte cifre se află pe poziția egală cu valoarea lor (a doua celulă conține 2 etc.), numărând de la acel capăt. Mărimi 9×9 și 6×6.", "Fixed points", "How many digits sit at their own position.", "In addition to the classic rules, a number outside the grid says how many digits sit at the position equal to their value (the second cell holds a 2, etc.), counted from that end. Sizes 9×9 and 6×6."],
["altsum", "outside", "Sumă alternantă", "a₁ − a₂ + a₃ − …", "Pe lângă regulile clasice, un număr în afara grilei este suma alternantă a cifrelor, privind dinspre acel capăt: prima cifră minus a doua plus a treia și așa mai departe. Poate fi negativ. Mărimi 9×9 și 6×6.", "Alternating sum", "a₁ − a₂ + a₃ − …", "In addition to the classic rules, a number outside the grid is the alternating sum of the digits seen from that end: first digit minus second plus third and so on. It may be negative. Sizes 9×9 and 6×6."],
["dxsum", "outside", "Sume pe diagonale", "Primele d cifre pe o diagonală, d = prima cifră.", "Pe lângă regulile clasice, un indiciu la capătul unei diagonale (care pornește din celula de margine) spune suma primelor d celule de pe acea diagonală, unde d este prima cifră de pe ea; dacă diagonala are mai puțin de d celule, se adună toată diagonala (ca la X-Sums, dar pe diagonale). Mărimi 9×9 și 6×6.", "Diagonal X-sums", "First d cells of a diagonal, d = its first digit.", "In addition to the classic rules, a clue at the end of a diagonal (starting at an edge cell) gives the sum of the first d cells of that diagonal, where d is its first digit; if the diagonal has fewer than d cells, the whole diagonal is summed (as X-Sums, but on diagonals). Sizes 9×9 and 6×6."],
["relief", "cell", "Relief", "Câți vecini sunt mai mici.", "Pe lângă regulile clasice, un număr într-o celulă marcată arată câți dintre cei patru vecini ortogonali conțin o cifră mai mică decât cifra acelei celule. Cifra celulei rămâne de aflat.", "Relief", "How many neighbours are smaller.", "In addition to the classic rules, a number in a marked cell shows how many of its four orthogonal neighbours hold a smaller digit than that cell. The cell’s own digit still has to be found."],
["oddsweeper", "cell", "Mine impare", "Câți din cei 8 vecini sunt impari.", "Pe lângă regulile clasice, un număr într-o celulă marcată arată câți dintre cei opt vecini (diagonalele incluse) conțin cifre impare, ca într-un joc de deminare. Cifra celulei rămâne de aflat.", "Odd-sweeper", "How many of the 8 neighbours are odd.", "In addition to the classic rules, a number in a marked cell shows how many of its eight neighbours (diagonals included) hold odd digits, as in minesweeper. The cell’s own digit still has to be found."],
["compass", "cell", "Busolă", "Săgeata arată spre cel mai mare vecin.", "Pe lângă regulile clasice, o săgeată într-o celulă marcată arată spre cel mai mare dintre cei opt vecini ai ei (strict mai mare decât toți ceilalți vecini). Cifra celulei însăși nu se compară; la margine contează doar vecinii existenți.", "Compass", "The arrow points to the largest neighbour.", "In addition to the classic rules, an arrow in a marked cell points at the largest of its eight neighbours (strictly larger than all other neighbours). The cell’s own digit is not compared; at the edge only existing neighbours count."],
["quadsum", "cell", "Sumă în pătrat", "Suma unui bloc 2×2.", "Pe lângă regulile clasice, un număr la intersecția a patru celule este suma celor patru cifre (cifrele pot repeta, deoarece blocul poate atinge două sau patru casete).", "Quad sum", "Sum of a 2×2 block.", "In addition to the classic rules, a number at the junction of four cells is the sum of those four digits (digits may repeat, because the block can touch two or four boxes)."],
["stone", "cell", "Piatră 2×2", "Patru cifre diferite într-un bloc.", "Pe lângă regulile clasice, în fiecare bloc 2×2 marcat cu un pătrat cele patru cifre sunt toate diferite. Marcajele apar doar la blocuri care ating cel puțin două casete; un bloc nemarcat poate avea sau nu cifre diferite.", "Stone 2×2", "Four different digits in a block.", "In addition to the classic rules, in every 2×2 block marked with a square the four digits are all different. Marks appear only on blocks touching at least two boxes; an unmarked block may or may not have different digits."],
["domino", "cell", "Domino", "Placă de două celule cu cifre date.", "Pe lângă regulile clasice, o placă de domino acoperă două celule vecine și arată ce două cifre conțin (în orice ordine). Definiția aleasă aici este cea mai simplă; sursele diferă.", "Domino", "A two-cell tile showing its digits.", "In addition to the classic rules, a domino tile covers two neighbouring cells and shows which two digits they hold (in either order). The definition chosen here is the simplest one; sources differ."],
["pillsq", "cell", "Pastila pătrat perfect", "Două cifre citite formează un pătrat perfect.", "Pe lângă regulile clasice, o pastilă acoperă două celule vecine; numărul de două cifre citit în sensul săgeții este un pătrat perfect (16, 25, 36, 49, 64 sau 81). Doar 9×9.", "Perfect-square pill", "Two digits read form a perfect square.", "In addition to the classic rules, a pill covers two neighbouring cells; the two-digit number read in the direction of the arrow is a perfect square (16, 25, 36, 49, 64 or 81). 9×9 only."],
["primecage", "cell", "Cușcă primă", "Cifre diferite cu suma număr prim.", "Pe lângă regulile clasice, cifrele din fiecare cușcă punctată sunt diferite, iar suma lor este un număr prim (suma nu este afișată; cuștile sunt marcate cu P).", "Prime cage", "Distinct digits whose sum is prime.", "In addition to the classic rules, the digits in each dashed cage are different and their sum is a prime number (the sum is not shown; cages are marked P)."],
["balcage", "cell", "Cușcă echilibrată", "Suma este egală cu produsul.", "Pe lângă regulile clasice, în fiecare cușcă marcată Σ=Π suma cifrelor este egală cu produsul lor (cifrele pot repeta; de ex. 1+2+3 = 1·2·3).", "Balanced cage", "Sum equals product.", "In addition to the classic rules, in every cage marked Σ=Π the sum of the digits equals their product (digits may repeat; for example 1+2+3 = 1·2·3)."],
["doubler", "cell", "Dublatori", "Killer în care unele celule contează dublu.", "Ca la Killer (cifre diferite în cușcă, suma dată), dar o celulă marcată ×2 din cușcă se adună de două ori.", "Doublers", "Killer where some cells count twice.", "As in Killer (different digits in a cage, given sum), but a cell marked ×2 in the cage is added twice."],
["clonemir", "cell", "Clone în oglindă", "Două forme identice, a doua în oglindă.", "Pe lângă regulile clasice, zonele colorate marcate cu aceeași literă au aceeași formă, a doua fiind răsturnată stânga–dreapta; celulele corespondente conțin aceeași cifră.", "Mirror clone", "Two same shapes, the second mirrored.", "In addition to the classic rules, two coloured areas have the same shape, the second flipped left–right; corresponding cells hold the same digit."],
["diff", "mark", "Diferență", "Numărul dintre celule = diferența lor.", "Pe lângă regulile clasice, un număr între două celule vecine este diferența (în valoare absolută) dintre cifrele lor. Lipsa numărului nu spune nimic.", "Difference", "The number between cells is their difference.", "In addition to the classic rules, a number between two neighbouring cells is the absolute difference of their digits. A missing number says nothing."],
["kropkipos", "mark", "Kropki doar marcate", "Punctele date; lipsa punctului nu spune nimic.", "Ca la Kropki (alb = consecutive, negru = dublu), dar absența unui punct nu înseamnă nimic: poate exista o relație nemarcată.", "Kropki marked only", "Dots given; no dot says nothing.", "As in Kropki (white = consecutive, black = double), but the absence of a dot means nothing: an unmarked relation may exist."],
["xvpos", "mark", "XV doar marcate", "Semnele date; lipsa semnului nu spune nimic.", "Ca la XV (X = suma 10, V = suma 5), dar absența semnului nu înseamnă nimic. Doar 9×9.", "XV marked only", "Signs given; no sign says nothing.", "As in XV (X = sum 10, V = sum 5), but the absence of a sign means nothing. 9×9 only."],
["consecpos", "mark", "Consecutiv doar marcate", "Barele date; lipsa barei nu spune nimic.", "Ca la Consecutiv (bară = cifre consecutive), dar absența barei nu înseamnă nimic.", "Consecutive marked only", "Bars given; no bar says nothing.", "As in Consecutive (bar = consecutive digits), but the absence of a bar means nothing."],
["clueless", "mark", "Fără indicii", "Doar punctele Kropki; de regulă fără cifre date.", "Grila are de regulă zero cifre date (rar una singură, când punctele nu determină singure soluția); toate celelalte informații vin din punctele Kropki (alb = consecutive, negru = dublu, lipsa punctului = nici una). Nivelul de dificultate nu are efect.", "Clueless", "Only Kropki dots; usually no given digits.", "The grid usually has zero given digits (rarely a single one, when the dots alone do not fix the solution); all other information comes from the Kropki dots (white = consecutive, black = double, no dot = neither). The difficulty level has no effect."],
["legato", "line", "Legato", "Cifrele vecine diferă cel mult cu 2.", "Pe lângă regulile clasice, pe o linie legato două cifre vecine diferă cu cel mult 2. Linia poate trece și pe diagonală; două celule consecutive pot conține aceeași cifră doar dacă nu împart rând, coloană sau casetă.", "Legato", "Neighbouring digits differ by at most 2.", "In addition to the classic rules, on a legato line two neighbouring digits differ by at most 2 (and are different if they share a row, column or box). The line may also run diagonally; two consecutive cells can hold the same digit only if they share no row, column or box."],
["consonant", "line", "Consonanță", "Vecinii diferă cu 2, 3 sau 4.", "Pe lângă regulile clasice, pe o linie consonantă două cifre vecine diferă cu 2, 3 sau 4 (valoare absolută). Linia poate trece și pe diagonală; două celule consecutive pot conține aceeași cifră doar dacă nu împart rând, coloană sau casetă.", "Consonant line", "Neighbours differ by 2, 3 or 4.", "In addition to the classic rules, on a consonant line two neighbouring digits differ by 2, 3 or 4 (absolute value). The line may also run diagonally; two consecutive cells can hold the same digit only if they share no row, column or box."],
["fixstep", "line", "Pas fix", "Vecinii diferă exact cu 3.", "Pe lângă regulile clasice, pe o linie cu pas fix două cifre vecine diferă exact cu 3 (valoare absolută). Linia poate trece și pe diagonală; două celule consecutive pot conține aceeași cifră doar dacă nu împart rând, coloană sau casetă.", "Fixed-step line", "Neighbours differ by exactly 3.", "In addition to the classic rules, on a fixed-step line two neighbouring digits differ by exactly 3 (absolute value). The line may also run diagonally; two consecutive cells can hold the same digit only if they share no row, column or box."],
["compline", "line", "Linie complementară", "Vecinii însumează N+1.", "Pe lângă regulile clasice, pe o linie complementară două cifre vecine însumează N+1 (la 9×9: 10), deci linia alternează între o cifră și complementul ei. Linia poate trece și pe diagonală; două celule consecutive pot conține aceeași cifră doar dacă nu împart rând, coloană sau casetă.", "Complementary line", "Neighbours sum to N+1.", "In addition to the classic rules, on a complementary line two neighbouring digits sum to N+1 (at 9×9: 10), so the line alternates between a digit and its complement. The line may also run diagonally; two consecutive cells can hold the same digit only if they share no row, column or box."],
["zigzag", "line", "Zigzag", "Cifrele alternează sus–jos.", "Pe lângă regulile clasice, pe o linie zigzag cifrele merg alternativ în sus și în jos (fiecare cifră de pe interior este fie mai mare, fie mai mică decât ambii vecini). Linia poate trece și pe diagonală; două celule consecutive pot conține aceeași cifră doar dacă nu împart rând, coloană sau casetă.", "Zigzag", "Digits alternate up and down.", "In addition to the classic rules, on a zigzag line the digits alternately rise and fall (each inner digit is either larger or smaller than both neighbours). The line may also run diagonally; two consecutive cells can hold the same digit only if they share no row, column or box."],
["fibonacci", "line", "Fibonacci", "Fiecare cifră e suma celor două dinainte.", "Pe lângă regulile clasice, pe o linie Fibonacci (săgeata arată sensul) fiecare cifră de după primele două este suma celor două dinaintea ei. Linia poate trece și pe diagonală; două celule consecutive pot conține aceeași cifră doar dacă nu împart rând, coloană sau casetă.", "Fibonacci line", "Each digit is the sum of the two before.", "In addition to the classic rules, on a Fibonacci line (the arrow shows the direction) each digit after the first two is the sum of the two preceding digits. The line may also run diagonally; two consecutive cells can hold the same digit only if they share no row, column or box."],
["steps", "line", "Trepte", "Diferențele cu semn cresc.", "Pe lângă regulile clasice, pe o linie în trepte (săgeata arată sensul) diferența dintre două cifre vecine crește de la un pas la următorul, socotind diferențele cu semn (a₃−a₂ > a₂−a₁): 1-2-4 și 9-5-3 sunt permise, 4-3-1 nu. Linia poate trece și pe diagonală; două celule consecutive pot conține aceeași cifră doar dacă nu împart rând, coloană sau casetă.", "Steps", "Signed differences keep growing.", "In addition to the classic rules, on a steps line (the arrow shows the direction) the difference between neighbouring digits grows from step to step, counting signed differences (a₃−a₂ > a₂−a₁): 1-2-4 and 9-5-3 are allowed, 4-3-1 is not. The line may also run diagonally; two consecutive cells can hold the same digit only if they share no row, column or box."],
["progression", "line", "Progresie aritmetică", "Diferența dintre vecini e constantă.", "Pe lângă regulile clasice, pe o linie în progresie aritmetică diferența dintre cifre vecine este aceeași pe toată linia (crescătoare sau descrescătoare). Linia poate trece și pe diagonală; două celule consecutive pot conține aceeași cifră doar dacă nu împart rând, coloană sau casetă.", "Arithmetic progression", "Constant difference.", "In addition to the classic rules, on an arithmetic-progression line the difference between neighbouring digits is the same along the whole line (increasing or decreasing). The line may also run diagonally; two consecutive cells can hold the same digit only if they share no row, column or box."],
["echo", "line", "Ecou", "Cifra se repetă la fiecare 3 celule.", "Pe lângă regulile clasice, pe o linie-ecou celula de pe poziția i și cea de pe poziția i+3 conțin aceeași cifră (modelul se repetă din 3 în 3). Linia poate trece și pe diagonală; două celule consecutive pot conține aceeași cifră doar dacă nu împart rând, coloană sau casetă.", "Echo line", "The digit repeats every three cells.", "In addition to the classic rules, on an echo line the cell at position i and the cell at position i+3 hold the same digit (the pattern repeats every three cells). The line may also run diagonally; two consecutive cells can hold the same digit only if they share no row, column or box."],
["divisible", "line", "Linie divizibilă", "Numărul citit se împarte la m.", "Pe lângă regulile clasice, cifrele de pe linie, citite în sensul săgeții, formează un număr divizibil cu m (m este afișat lângă linie, de ex. ÷7). Doar 9×9.", "Divisible line", "The number read is divisible by m.", "In addition to the classic rules, the digits on the line, read in the direction of the arrow, form a number divisible by m (m is shown beside the line, e.g. ÷7). 9×9 only."],
["primeline", "line", "Linie primă", "Doar cifre prime.", "Pe lângă regulile clasice, toate celulele de pe o linie primă conțin cifre prime (2, 3, 5, 7; la 6×6: 2, 3, 5). Linia poate trece și pe diagonală; două celule consecutive pot conține aceeași cifră doar dacă nu împart rând, coloană sau casetă.", "Prime line", "Prime digits only.", "In addition to the classic rules, all cells on a prime line hold prime digits (2, 3, 5, 7; at 6×6: 2, 3, 5). The line may also run diagonally; two consecutive cells can hold the same digit only if they share no row, column or box."],
["sohei", "composite", "Sohei (inel de patru)", "Patru grile 9×9 legate într-un inel în romb.", "Patru grile 9×9 sunt așezate în romb (sus, dreapta, jos, stânga); fiecare două grile vecine împart o casetă 3×3 (în total patru casete comune), iar în mijloc rămâne un gol. Fiecare rând, coloană și casetă conține fiecare cifră o dată; cifrele din casetele comune contează pentru ambele grile. Geometria este o convenție aleasă aici; sursele diferă.", "Sohei (ring of four)", "Four 9×9 grids linked in a diamond ring.", "Four 9×9 grids are placed in a diamond (top, right, bottom, left); each two neighbouring grids share a 3×3 box (four shared boxes in all) and a hole remains in the middle. Every row, column and box holds each digit once; digits in shared boxes count for both grids. The geometry is a convention chosen here; sources differ."],
["kazaguruma", "composite", "Kazaguruma (moară de vânt)", "Centru plus patru brațe, fiecare suprapus pe două casete.", "O grilă 9×9 centrală și patru brațe 9×9 în formă de moară de vânt; fiecare braț se suprapune cu centrul pe două casete vecine (18 celule). Fiecare rând, coloană și casetă conține fiecare cifră o dată. Geometria este o convenție aleasă aici; sursele diferă.", "Kazaguruma (windmill)", "Centre plus four arms, each overlapping two boxes.", "A central 9×9 grid and four 9×9 arms in a windmill shape; each arm overlaps the centre on two neighbouring boxes (18 cells). Every row, column and box holds each digit once. The geometry is a convention chosen here; sources differ."],
["tripledoku", "composite", "Tripledoku (V)", "Trei grile în formă de V.", "Trei grile 9×9 așezate în V: stânga-sus, mijloc-jos și dreapta-sus; grila din mijloc împarte câte o casetă cu fiecare dintre celelalte două. Este aceeași idee ca Gattai-3, dar cu altă geometrie (V în loc de diagonală).", "Tripledoku (V)", "Three grids in a V shape.", "Three 9×9 grids placed in a V: top-left, middle-bottom and top-right; the middle grid shares one box with each of the other two. The same idea as Gattai-3, but with another geometry (V instead of a diagonal)."],
["cross", "composite", "Cruce", "Centru plus patru brațe, fiecare suprapus pe o bandă întreagă.", "O grilă 9×9 centrală și patru brațe (sus, stânga, dreapta, jos); fiecare braț se suprapune cu centrul pe o bandă întreagă de trei casete (27 celule), iar unele casete aparțin la trei grile. Fiecare rând, coloană și casetă conține fiecare cifră o dată. Geometria este o convenție aleasă aici.", "Cross", "Centre plus four arms, each overlapping a full band.", "A central 9×9 grid and four arms (top, left, right, bottom); each arm overlaps the centre on a whole band of three boxes (27 cells), and some boxes belong to three grids. Every row, column and box holds each digit once. The geometry is a convention chosen here."],
["cube3", "dim", "Cub latin 3D", "Fiecare linie a cubului conține fiecare cifră o dată.", "Cubul N×N×N este desfășurat în N straturi așezate unul lângă altul (separate prin spațiu gol). Fiecare linie în oricare dintre cele trei direcții — rând în strat, coloană în strat, și „în adâncime” (aceeași poziție în toate straturile) — conține fiecare cifră o dată. Mărimi 4, 5, 6. Cubul e foarte rigid: la „Greu” rămân puține cifre date. Vizualizarea este pe straturi; poți comuta pe „Vedere 3D” (trage ca să rotești cubul, glisorul ascunde straturile din față; selectezi celule cu clic).", "Latin cube 3D", "Every line of the cube holds each digit once.", "The N×N×N cube is unfolded into N layers placed side by side (separated by a gap). Every line in each of the three directions — row in a layer, column in a layer, and “in depth” (the same position in all layers) — holds each digit once. Sizes 4, 5, 6. The cube is very rigid: at “Hard” few givens remain. The view is layered; you can switch to “3D view” (drag to rotate the cube, the slider hides the front layers; click to select cells)."],
["cubebox", "dim", "Cub cu casete 2×2", "Cub latin 4×4×4 cu casete 2×2 în fiecare strat.", "Ca la Cubul latin 3D (4×4×4), dar în plus fiecare strat are patru casete 2×2 (conturate gros) care conțin fiecare cifră o dată: fiecare strat este deci un sudoku 4×4, iar liniile „în adâncime” conțin și ele fiecare cifră o dată. Doar 4×4×4.", "Cube with 2×2 boxes", "4×4×4 Latin cube with 2×2 boxes in every layer.", "As in the Latin cube 3D (4×4×4), but each layer additionally has four 2×2 boxes (thick outlines) holding each digit once: every layer is a 4×4 sudoku, and the “depth” lines also hold each digit once. 4×4×4 only."],
["hyper4", "dim", "Hipercub 4D", "Sudoku în patru dimensiuni.", "Hipercubul N×N×N×N este desfășurat ca o mozaică N×N de straturi N×N (primele două coordonate aleg stratul: rând și coloană de straturi). Fiecare linie pe oricare dintre cele patru axe conține fiecare cifră o dată. Mărimi 3 (81 celule) și 4 (256 celule). Foarte rigid: puține cifre date.", "Hypercube 4D", "Sudoku in four dimensions.", "The N×N×N×N hypercube is unfolded as an N×N mosaic of N×N layers (the first two coordinates pick the layer: layer row and layer column). Every line along any of the four axes holds each digit once. Sizes 3 (81 cells) and 4 (256 cells). Very rigid: few givens."],
["hyper5", "dim", "Hipercub 5D", "Sudoku în cinci dimensiuni (3⁵ = 243 celule).", "Hipercubul 3×3×3×3×3 este desfășurat în trei mozaici 3×3 de straturi 3×3, așezate una lângă alta. Fiecare linie pe oricare dintre cele cinci axe conține fiecare cifră o dată. Foarte rigid: doar câteva cifre date; tabla este lată, așa că celulele sunt mici pe ecrane înguste.", "Hypercube 5D", "Sudoku in five dimensions (3⁵ = 243 cells).", "The 3×3×3×3×3 hypercube is unfolded into three 3×3 mosaics of 3×3 layers placed side by side. Every line along any of the five axes holds each digit once. Very rigid: only a few givens; the board is wide, so cells are small on narrow screens."],
["greco", "dim", "Greco-Latin (pătrate ortogonale)", "Două pătrate latine suprapuse: fiecare pereche cifră–literă apare o dată.", "Două pătrate N×N alăturate: cel din stânga cu cifre, cel din dreapta cu litere (A, B, C…; la completare tasta „1/A” înseamnă cifra 1 în stânga sau litera A în dreapta). Fiecare rând și coloană din fiecare pătrat conține fiecare simbol o dată. În plus, cele două pătrate sunt ortogonale: dacă te uiți la aceeași poziție în ambele pătrate, perechea (cifră, literă) este diferită în toate cele N² poziții — fiecare pereche posibilă apare exact o dată. Mărimi 3, 4, 5, 7 (pentru 6 nu există astfel de perechi; 8 și 9 sunt omise pentru viteză). Cu 7×7 la „Greu” generarea poate dura cam 10–15 s.", "Greco-Latin (orthogonal squares)", "Two overlaid Latin squares: every digit–letter pair appears once.", "Two N×N squares side by side: the left one with digits, the right one with letters (A, B, C…; when filling in, the key “1/A” means digit 1 on the left or letter A on the right). In each square every row and column holds each symbol once. In addition the two squares are orthogonal: looking at the same position in both squares, the pair (digit, letter) is different in all N² positions — every possible pair appears exactly once. Sizes 3, 4, 5, 7 (for 6 no such pair exists, 8 and 9 are left out for speed). At 7×7 “Hard” generation can take about 10–15 s."]
];

fr: `<p><b>Sudoku sans frontières</b> est un atlas de variantes de Sudoku, avec un générateur et un résolveur qui s’exécutent en local, dans un seul fichier HTML. Il n’y a pas de compte, rien n’est envoyé sur le réseau et aucune ressource externe n’est chargée. L’état du jeu est conservé uniquement dans ce navigateur (clés <code>sff_*</code> dans <code>localStorage</code>).</p>
<h3>Fonctionnement</h3><p>Le moteur choisit d’abord une grille résolue qui respecte les règles de la variante, en déduit les indices (cages, thermomètres, points, etc.), puis retire les chiffres donnés un à un, tant qu’un résolveur à propagation démontre que la solution reste unique. Une grille générée a donc exactement une solution. Le même code régénère la même grille dans la même version de l’application.</p>
<h3>Limites</h3><ul><li>La difficulté est indicative : elle dépend du nombre de chiffres donnés, non des techniques logiques nécessaires.</li><li>Le niveau « difficile » retire autant de chiffres que possible ; dans les variantes à nombreux indices sur la grille, il peut rester très peu de chiffres donnés.</li><li>Les règles suivent les conventions usuelles de chaque variante ; lorsqu’il en existe plusieurs, la fiche indique laquelle a été retenue.</li><li>Les grilles 16×16 et 25×25 utilisent les symboles 1–9 et des lettres ; les grilles composées (Samurai, etc.) n’ont que les règles classiques, et les combinaisons très chargées peuvent être plus longues ou échouer.</li><li>L’indice et le « pas à pas » s’appuient sur la logique des candidats (unique dans une case, unique dans une ligne/colonne/région, règles de la variante) ; s’il n’existe pas de pas direct, ils révèlent un chiffre de la solution et le précisent.</li></ul>
<h3>Modes de jeu</h3><ul><li><b>Orbe</b> : seules les cases à 2 pas au plus de la sélection sont visibles.</li><li><b>Mémoire</b> : les chiffres donnés sont affichés quelques secondes, puis cachés ; « Regarder » coûte 30 s. Pas d’indices ni de surlignage des conflits.</li><li><b>Marathon</b> : 5 grilles d’affilée (facile, facile, moyen, moyen, difficile) avec un temps total.</li><li><b>Duel</b> : un adversaire horloge remplit une case toutes les quelques secondes (il recopie la solution connue, sans logique) ; s’il finit le premier, vous perdez.</li><li><b>Hardcore</b> : 3 vies, chaque chiffre faux en coûte une ; ni indice, ni vérification, ni notes automatiques.</li><li><b>Grille du jour</b> : la même grille pour tous un jour donné (date UTC), avec une série de jours consécutifs conservée localement.</li><li><b>Sonore</b> : chaque chiffre a une note ; une ligne, colonne ou région complétée joue un arpège.</li></ul>
<h3>Raccourcis</h3><p>Chiffres/lettres : remplir · <kbd>N</kbd> : notes · <kbd>Backspace</kbd> : effacer · flèches : déplacer · <kbd>Maj</kbd>/<kbd>Ctrl</kbd>+clic : sélection multiple · <kbd>Ctrl</kbd>+<kbd>Z</kbd>/<kbd>Y</kbd> : annuler/rétablir.</p>
<p class="small">Projet personnel, pas un service officiel. Licence : MIT (code, textes et captures), © 2026 Alexandru-Ionuț Chiuță. Le texte intégral figure dans le fichier LICENSE.</p>`,
it: `<p><b>Sudoku senza frontiere</b> è un atlante di varianti del Sudoku, con generatore e risolutore che girano in locale, in un unico file HTML. Non ha account, non invia nulla in rete e non carica alcuna risorsa esterna. Lo stato di gioco resta solo in questo browser (chiavi <code>sff_*</code> in <code>localStorage</code>).</p>
<h3>Come funziona</h3><p>Il motore sceglie prima una griglia risolta che rispetta le regole della variante, ne ricava gli indizi (gabbie, termometri, punti ecc.) e poi toglie le cifre date una a una, finché un risolutore a propagazione dimostra che la soluzione resta unica. Uno schema generato ha quindi esattamente una soluzione. Lo stesso codice rigenera lo stesso schema nella stessa versione dell’app.</p>
<h3>Limiti</h3><ul><li>La difficoltà è indicativa: dipende dal numero di cifre date, non dalle tecniche logiche richieste.</li><li>Il livello «difficile» toglie quante più cifre possibile; nelle varianti con molti indizi sulla griglia possono restare pochissime cifre date.</li><li>Le regole seguono le convenzioni abituali di ogni variante; dove ce n’è più di una, la scheda indica quale è stata scelta.</li><li>Le griglie 16×16 e 25×25 usano i simboli 1–9 e lettere; le griglie composte (Samurai ecc.) hanno solo le regole classiche, e le combinazioni molto cariche possono richiedere più tempo o fallire.</li><li>Il suggerimento e il «passo passo» usano la logica dei candidati (unico in una cella, unico in una riga/colonna/regione, regole della variante); se non esiste un passo diretto, rivelano una cifra della soluzione e lo dicono.</li></ul>
<h3>Modalità di gioco</h3><ul><li><b>Orbe</b>: si vedono solo le celle a non più di 2 passi dalla selezione.</li><li><b>Memoria</b>: le cifre date restano visibili per qualche secondo, poi si nascondono; «Sbircia» costa 30 s. Niente suggerimenti né evidenziazione dei conflitti.</li><li><b>Maratona</b>: 5 schemi di fila (facile, facile, medio, medio, difficile) con un tempo totale.</li><li><b>Duello</b>: un avversario a tempo riempie una cella ogni pochi secondi (copia la soluzione nota, senza logica); se finisce prima, perdi.</li><li><b>Hardcore</b>: 3 vite, ogni cifra sbagliata ne costa una; niente suggerimenti, verifica o appunti automatici.</li><li><b>Schema del giorno</b>: lo stesso schema per tutti in un dato giorno (data UTC), con una serie di giorni consecutivi conservata in locale.</li><li><b>Sonoro</b>: ogni cifra ha una nota; una riga, colonna o regione completata suona un arpeggio.</li></ul>
<h3>Scorciatoie</h3><p>Cifre/lettere: inserisci · <kbd>N</kbd>: appunti · <kbd>Backspace</kbd>: cancella · frecce: spostati · <kbd>Maiusc</kbd>/<kbd>Ctrl</kbd>+clic: selezione multipla · <kbd>Ctrl</kbd>+<kbd>Z</kbd>/<kbd>Y</kbd>: annulla/ripeti.</p>
<p class="small">Progetto personale, non un servizio ufficiale. Licenza: MIT (codice, testi e schermate), © 2026 Alexandru-Ionuț Chiuță. Il testo completo è nel file LICENSE.</p>`,
es: `<p><b>Sudoku sin fronteras</b> es un atlas de variantes de Sudoku, con generador y resolutor que se ejecutan en local, en un único archivo HTML. No tiene cuenta, no envía nada por la red y no carga ningún recurso externo. El estado de la partida se guarda solo en este navegador (claves <code>sff_*</code> en <code>localStorage</code>).</p>
<h3>Cómo funciona</h3><p>El motor elige primero una cuadrícula resuelta que respeta las reglas de la variante, deduce de ella las pistas (jaulas, termómetros, puntos, etc.) y luego quita los dígitos dados uno a uno, mientras un resolutor con propagación demuestre que la solución sigue siendo única. Un puzle generado tiene, por tanto, exactamente una solución. El mismo código regenera el mismo puzle en la misma versión de la aplicación.</p>
<h3>Límites</h3><ul><li>La dificultad es orientativa: depende del número de dígitos dados, no de las técnicas lógicas necesarias.</li><li>El nivel «difícil» quita tantos dígitos como puede; en variantes con muchas pistas en la cuadrícula pueden quedar muy pocos dígitos dados.</li><li>Las reglas siguen las convenciones habituales de cada variante; cuando hay varias, la ficha indica cuál se eligió.</li><li>Las cuadrículas de 16×16 y 25×25 usan los símbolos 1–9 y letras; las cuadrículas compuestas (Samurái, etc.) solo llevan las reglas clásicas, y las combinaciones muy cargadas pueden tardar más o fallar.</li><li>La pista y el «paso a paso» usan lógica de candidatos (único en una celda, único en una fila/columna/región, reglas de la variante); si no hay un paso directo, revelan un dígito de la solución y lo indican.</li></ul>
<h3>Modos de juego</h3><ul><li><b>Orbe</b>: solo se ven las celdas a 2 pasos como máximo de la selección.</li><li><b>Memoria</b>: los dígitos dados se muestran unos segundos y luego se ocultan; «Mirar» cuesta 30 s. Sin pistas ni resaltado de conflictos.</li><li><b>Maratón</b>: 5 puzles seguidos (fácil, fácil, medio, medio, difícil) con un tiempo total.</li><li><b>Duelo</b>: un adversario con reloj rellena una celda cada pocos segundos (copia la solución conocida, sin lógica); si termina primero, pierdes.</li><li><b>Hardcore</b>: 3 vidas, cada dígito erróneo cuesta una; sin pistas, comprobación ni notas automáticas.</li><li><b>Puzle del día</b>: el mismo puzle para todos en un día dado (fecha UTC), con una racha de días consecutivos guardada en local.</li><li><b>Sonoro</b>: cada dígito tiene una nota; una fila, columna o región completada suena como un arpegio.</li></ul>
<h3>Atajos</h3><p>Dígitos/letras: rellenar · <kbd>N</kbd>: notas · <kbd>Backspace</kbd>: borrar · flechas: mover · <kbd>Mayús</kbd>/<kbd>Ctrl</kbd>+clic: selección múltiple · <kbd>Ctrl</kbd>+<kbd>Z</kbd>/<kbd>Y</kbd>: deshacer/rehacer.</p>
<p class="small">Proyecto personal, no un servicio oficial. Licencia: MIT (código, textos y capturas), © 2026 Alexandru-Ionuț Chiuță. El texto completo está en el archivo LICENSE.</p>`,
