xtremidades sem seta excluem sequências monótonas)."],["Rossini","Randpfeil: Die ersten drei Ziffern steigen in einer Richtung.","Ein Pfeil außerhalb des Gitters besagt, dass die ersten drei Ziffern von diesem Ende aus streng monoton sind: Sie steigen in Pfeilrichtung (ins Gitter hinein) oder, wenn der Pfeil zum Rand zeigt, zum Rand hin, d. h. sie fallen nach innen. Konvention: Die Pfeilspitze zeigt auf die größte Ziffer. Ein fehlender Pfeil bedeutet nichts (dies ist nicht die klassische Rossini-Form, bei der Enden ohne Pfeil monotone Folgen ausschließen)."],["Rossini","Peremnyíl: az első három számjegy egy irányban emelkedik.","A rácson kívüli nyíl azt jelenti, hogy az onnan számított első három számjegy szigorúan monoton: a nyíl irányában (a rács belseje felé) nőnek, vagy ha a nyíl a perem felé mutat, a perem felé nőnek, azaz befelé haladva csökkennek. Megállapodás: a nyílhegy a legnagyobb számjegyre mutat. A hiányzó nyíl nem jelent semmit (ez nem a klasszikus Rossini-forma, ahol a nyíl nélküli végek kizárják a monoton sorozatokat)."]],"outside":[["Extérieur","Les chiffres du bord figurent parmi les trois premières cases.","Les chiffres écrits à l’extérieur de la grille doivent figurer parmi les trois premières cases de cette ligne ou colonne, comptées à partir de cette extrémité, dans n’importe quel ordre. Si trois chiffres sont donnés, ce sont exactement ces trois cases."],["Esterno","Le cifre del bordo compaiono tra le prime tre celle.","Le cifre scritte fuori dalla griglia devono comparire tra le prime tre celle di quella riga o colonna, contate da quell’estremità, in qualsiasi ordine. Se sono date tre cifre, sono esattamente quelle tre celle."],["Exterior","Los dígitos del borde aparecen entre las tres primeras celdas.","Los dígitos escritos fuera de la cuadrícula deben aparecer entre las tres primeras celdas de esa fila o columna, contadas desde ese extremo, en cualquier orden. Si se dan tres dígitos, son exactamente esas tres celdas."],["Exterior","Os algarismos da margem aparecem entre as três primeiras células.","Os algarismos escritos fora da grelha têm de aparecer entre as três primeiras células dessa linha ou coluna, contadas a partir dessa extremidade, por qualquer ordem. Se forem dados três algarismos, são exatamente essas três células."],["Außen","Randziffern kommen unter den ersten drei Feldern vor.","Ziffern, die außerhalb des Gitters stehen, müssen unter den ersten drei Feldern dieser Zeile oder Spalte, von diesem Ende aus gezählt, vorkommen, in beliebiger Reihenfolge. Sind drei Ziffern angegeben, sind es genau diese drei Felder."],["Külső","A peremszámjegyek az első három cella között szerepelnek.","A rácson kívül írt számjegyeknek az adott sor vagy oszlop első három cellája között kell szerepelniük, az adott végtől számolva, tetszőleges sorrendben. Ha három számjegy van megadva, akkor pontosan az a három cella az."]],"clone":[["Clone","Des régions identiques contiennent les mêmes chiffres.","Deux régions ou plus de la même couleur ont la même forme et des chiffres identiques dans les cases correspondantes (pour une même translation). Les régions ne se chevauchent pas et les cases correspondantes ne partagent ni ligne, ni colonne, ni bloc."],["Clone","Regioni identiche contengono le stesse cifre.","Due o più regioni dello stesso colore hanno la stessa forma e cifre identiche nelle celle corrispondenti (con la stessa traslazione). Le regioni non si sovrappongono e le celle corrispondenti non condividono riga, colonna o riquadro."],["Clon","Las regiones idénticas contienen los mismos dígitos.","Dos o más regiones del mismo color tienen la misma forma y dígitos idénticos en las celdas correspondientes (con la misma traslación). Las regiones no se solapan y las celdas correspondientes no comparten fila, columna ni caja."],["Clone","Regiões idênticas contêm os mesmos algarismos.","Duas ou mais regiões da mesma cor têm a mesma forma e algarismos idênticos nas células correspondentes (com a mesma translação). As regiões não se sobrepõem e as células correspondentes não partilham linha, coluna nem caixa."],["Klon","Identische Gebiete enthalten dieselben Ziffern.","Zwei oder mehr Gebiete derselben Farbe haben dieselbe Form und identische Ziffern in entsprechenden Feldern (bei gleicher Verschiebung). Die Gebiete überlappen sich nicht, und entsprechende Felder teilen keine Zeile, Spalte und keinen Block."],["Klón","Az azonos tartományokban ugyanazok a számjegyek vannak.","Két vagy több azonos színű tartomány alakja megegyezik, és a megfelelő celláikban azonos számjegyek állnak (azonos eltolás mellett). A tartományok nem fedik egymást, és a megfelelő celláknak nincs közös soruk, oszlopuk vagy blokkjuk."]],"regionsum":[["Lignes à sommes par région","Somme égale dans chaque bloc traversé.","Sur la ligne rose, la somme des chiffres situés dans chaque bloc que la ligne traverse est la même pour tous les blocs traversés (la ligne touche au moins deux blocs). Toutes les cases de la ligne dans ce bloc sont additionnées. Convention : si la ligne quitte un bloc puis y revient, les cases des deux passages sont additionnées ensemble (les règles publiées additionnent chaque segment continu séparément)."],["Linee con somme per regione","Somma uguale in ogni riquadro attraversato.","Sulla linea rosa la somma delle cifre dentro ciascun riquadro attraversato dalla linea è la stessa per tutti i riquadri attraversati (la linea tocca almeno due riquadri). Si sommano tutte le celle della linea dentro quel riquadro. Convenzione: se la linea esce da un riquadro e vi rientra, le celle di entrambi i passaggi si sommano insieme (le regole pubblicate sommano ogni segmento continuo separatamente)."],["Líneas con sumas por región","Suma igual en cada caja atravesada.","En la línea rosa, la suma de los dígitos dentro de cada caja que la línea atraviesa es la misma para todas las cajas atravesadas (la línea toca al menos dos cajas). Se suman todas las celdas de la línea dentro de esa caja. Convención: si la línea sale de una caja y vuelve a entrar, se suman juntas las celdas de ambos pasos (las reglas publicadas suman cada segmento continuo por separado)."],["Linhas com somas por região","Soma igual em cada caixa atravessada.","Na linha rosa, a soma dos algarismos dentro de cada caixa que a linha atravessa é a mesma para todas as caixas atravessadas (a linha toca pelo menos duas caixas). Somam-se todas as células da linha dentro dessa caixa. Convenção: se a linha sair de uma caixa e voltar a entrar, as células das duas passagens somam-se em conjunto (as regras publicadas somam cada segmento contínuo em separado)."],["Linien mit Gebietssummen","Gleiche Summe in jedem durchquerten Block.","Auf der rosa Linie ist die Summe der Ziffern innerhalb jedes Blocks, den die Linie durchquert, für alle durchquerten Blöcke gleich (die Linie berührt mindestens zwei Blöcke). Alle Felder der Linie in diesem Block werden addiert. Konvention: Verlässt die Linie einen Block und tritt wieder ein, werden die Felder beider Durchgänge zusammen addiert (veröffentlichte Regeln addieren jedes zusammenhängende Stück getrennt)."],["Tartományösszeg-vonalak","Egyenlő összeg minden átszelt blokkban.","A rózsaszín vonalon az egyes átszelt blokkokon belüli számjegyek összege minden átszelt blokkban ugyanannyi (a vonal legalább két blokkot érint). A vonal adott blokkon belüli összes cellája összeadódik. Megállapodás: ha a vonal elhagy egy blokkot, majd visszatér bele, a két áthaladás cellái együtt adódnak össze (a közzétett szabályok minden összefüggő szakaszt külön összegeznek)."]],"avgarrow":[["Flèche moyenne","Cercle = moyenne des chiffres de la flèche.","Le chiffre dans le cercle est la moyenne arithmétique des chiffres de la flèche (leur somme = leur nombre × le chiffre du cercle). Le signe μ marque la variante."],["Freccia media","Cerchio = media delle cifre della freccia.","La cifra nel cerchio è la media aritmetica delle cifre sulla freccia (la loro somma = il loro numero × la cifra del cerchio). Il segno μ indica la variante."],["Flecha media","Círculo = media de los dígitos de la flecha.","El dígito del círculo es la media aritmética de los dígitos de la flecha (su suma = su cantidad × el dígito del círculo). El signo μ marca la variante."],["Seta média","Círculo = média dos algarismos da seta.","O algarismo no círculo é a média aritmética dos algarismos da seta (a sua soma = a sua quantidade × o algarismo do círculo). O sinal μ marca a variante."],["Durchschnittspfeil","Kreis = Mittelwert der Pfeilziffern.","Die Ziffer im Kreis ist das arithmetische Mittel der Ziffern auf dem Pfeil (ihre Summe = ihre Anzahl × die Kreisziffer). Das Zeichen μ kennzeichnet die Variante."],["Átlagnyíl","Kör = a nyíl számjegyeinek átlaga.","A körben lévő számjegy a nyílon lévő számjegyek számtani közepe (összegük = darabszámuk × a kör számjegye). A μ jel jelöli a változatot."]],"prodarrow":[["Flèche produit","Cercle = produit des chiffres de la flèche.","Le chiffre dans le cercle est égal au produit des chiffres de la flèche. Le signe × marque la variante. Les flèches ont 2 à 3 cases."],["Freccia prodotto","Cerchio = prodotto delle cifre della freccia.","La cifra nel cerchio è uguale al prodotto delle cifre sulla freccia. Il segno × indica la variante. Le frecce hanno 2–3 celle."],["Flecha producto","Círculo = producto de los dígitos de la flecha.","El dígito del círculo es igual al producto de los dígitos de la flecha. El signo × marca la variante. Las flechas tienen 2–3 celdas."],["Seta produto","Círculo = produto dos algarismos da seta.","O algarismo no círculo é igual ao produto dos algarismos da seta. O sinal × marca a variante. As setas têm 2–3 células."],["Produktpfeil","Kreis = Produkt der Pfeilziffern.","Die Ziffer im Kreis ist gleich dem Produkt der Ziffern auf dem Pfeil. Das Zeichen × kennzeichnet die Variante. Pfeile haben 2–3 Felder."],["Szorzatnyíl","Kör = a nyíl számjegyeinek szorzata.","A körben lévő számjegy egyenlő a nyílon lévő számjegyek szorzatával. A × jel jelöli a változatot. A nyilak 2–3 cellásak."]],"pillarrow":[["Flèche pilule","La pilule forme un nombre à deux chiffres.","Les deux cases de la pilule forment un nombre à deux chiffres (dizaines, unités) ; les chiffres le long de la flèche ont pour somme ce nombre. 9×9 uniquement, donc dans ces puzzles la pilule commence par 1–4."],["Freccia pillola","La pillola forma un numero a due cifre.","Le due celle nella pillola formano un numero a due cifre (decine, unità); le cifre lungo la freccia sommano quel numero. Solo 9×9, quindi in questi puzzle la pillola inizia con 1–4."],["Flecha píldora","La píldora forma un número de dos cifras.","Las dos celdas de la píldora forman un número de dos cifras (decenas, unidades); los dígitos a lo largo de la flecha suman ese número. Solo 9×9, así que en estos puzles la píldora empieza por 1–4."],["Seta pílula","A pílula forma um número de dois algarismos.","As duas células da pílula formam um número de dois algarismos (dezenas, unidades); os algarismos ao longo da seta somam esse número. Só 9×9, por isso nestes puzzles a pílula começa por 1–4."],["Pillenpfeil","Die Pille bildet eine zweistellige Zahl.","Die beiden Felder in der Pille bilden eine zweistellige Zahl (Zehner, Einer); die Ziffern entlang des Pfeils ergeben zusammen diese Zahl. Nur 9×9, daher beginnt die Pille in diesen Rätseln mit 1–4."],["Pirulanyíl","A pirula kétjegyű számot alkot.","A pirulában lévő két cella kétjegyű számot alkot (tízes, egyes); a nyíl mentén lévő számjegyek összege ez a szám. Csak 9×9, ezért ezekben a rejtvényekben a pirula 1–4-gyel kezdődik."]],"strimko":[[null,"Des chaînes à la place des blocs.","Chaque ligne, colonne et chaîne (cercles reliés par des lignes, connectés aussi en diagonale) contient exactement une fois chaque chiffre. Il n’y a pas de blocs. Tailles 4–7."],[null,"Catene al posto dei riquadri.","Ogni riga, colonna e catena (cerchi uniti da linee, collegati anche in diagonale) contiene esattamente una volta ogni cifra. Non ci sono riquadri. Dimensioni 4–7."],[null,"Cadenas en lugar de cajas.","Cada fila, columna y cadena (círculos unidos por líneas, conectados también en diagonal) contiene exactamente una vez cada dígito. No hay cajas. Tamaños 4–7."],[null,"Cadeias em vez de caixas.","Cada linha, coluna e cadeia (círculos unidos por linhas, ligados também na diagonal) contém exatamente uma vez cada algarismo. Não há caixas. Tamanhos 4–7."],[null,"Ketten statt Blöcke.","Jede Zeile, Spalte und Kette (durch Linien verbundene Kreise, auch diagonal verbunden) enthält jede Ziffer genau einmal. Es gibt keine Blöcke. Größen 4–7."],[null,"Láncok a blokkok helyett.","Minden sor, oszlop és lánc (vonalakkal összekötött körök, átlósan is összekapcsolva) pontosan egyszer tartalmazza az összes számjegyet. Blokkok nincsenek. Méretek: 4–7."]],"indexing":[["Indexation","Le premier chiffre d’une ligne indique où est le 1.","Dans chaque ligne, le chiffre de la première case (la plus à gauche) donne le numéro de la colonne où se trouve le 1 de cette ligne. Si la première case contient 1, le 1 est juste là. Convention : les sources décrivent plusieurs formes d'« indexation » ; cette fiche utilise celle-ci, sur les lignes uniquement."],["Indicizzazione","La prima cifra di una riga dice dove sta l’1.","In ogni riga la cifra nella prima cella (la più a sinistra) indica il numero della colonna in cui si trova l’1 di quella riga. Se la prima cella contiene 1, l’1 è proprio lì. Convenzione: le fonti descrivono diverse forme di «indicizzazione»; questa scheda usa questa, solo sulle righe."],["Indexación","El primer dígito de una fila indica dónde está el 1.","En cada fila, el dígito de la primera celda (la más a la izquierda) indica el número de la columna donde está el 1 de esa fila. Si la primera celda contiene 1, el 1 está justo ahí. Convención: las fuentes describen varias formas de «indexación»; esta ficha usa esta, solo en las filas."],["Indexação","O primeiro algarismo de uma linha diz onde está o 1.","Em cada linha, o algarismo da primeira célula (a mais à esquerda) indica o número da coluna onde está o 1 dessa linha. Se a primeira célula contiver 1, o 1 está logo ali. Convenção: as fontes descrevem várias formas de «indexação»; esta ficha usa esta, só nas linhas."],["Indizierung","Die erste Ziffer einer Zeile sagt, wo die 1 steht.","In jeder Zeile gibt die Ziffer im ersten (linken) Feld die Spaltennummer an, in der die 1 dieser Zeile steht. Steht im ersten Feld eine 1, ist die 1 genau dort. Konvention: Die Quellen beschreiben mehrere Formen der „Indizierung“; diese Karte verwendet diese, nur für Zeilen."],["Indexelés","A sor első számjegye megmondja, hol van az 1.","Minden sorban az első (bal szélső) cellában lévő számjegy megadja annak az oszlopnak a számát, ahol a sor 1-ese áll. Ha az első cellában 1 van, akkor az 1 éppen ott van. Megállapodás: a források az „indexelés” több formáját írják le; ez a kártya ezt használja, csak a sorokra."]],"ratio":[["Rapport ×3","Points pour les paires en rapport 3:1.","Sur l’arête entre deux cases adjacentes, un cercle avec un 3 signifie qu’un chiffre est le triple de l’autre (1–3, 2–6 ou 3–9). Comme pour Kropki, s’il n’y a pas de cercle, les chiffres adjacents ne sont PAS dans un rapport 3:1. Convention choisie par cette application : les sources décrivent les variantes « ratio » de façon vague, donc ici « ratio » signifie strictement un facteur 3."],["Rapporto ×3","Punti per le coppie in rapporto 3:1.","Sul lato tra due celle adiacenti, un cerchio con un 3 significa che una cifra è il triplo dell’altra (1–3, 2–6 o 3–9). Come per Kropki, se non c’è il cerchio, le cifre adiacenti NON sono in rapporto 3:1. Convenzione scelta da questa app: le fonti descrivono in modo vago le varianti «ratio», quindi qui «ratio» significa rigorosamente fattore 3."],["Razón ×3","Puntos para parejas en razón 3:1.","En el borde entre dos celdas adyacentes, un círculo con un 3 significa que un dígito es el triple del otro (1–3, 2–6 o 3–9). Como en Kropki, si no hay círculo, los dígitos adyacentes NO están en razón 3:1. Convención elegida por esta aplicación: las fuentes describen las variantes «ratio» de forma vaga, así que aquí «ratio» significa estrictamente factor 3."],["Razão ×3","Pontos para pares em razão 3:1.","Na aresta entre duas células adjacentes, um círculo com um 3 significa que um algarismo é o triplo do outro (1–3, 2–6 ou 3–9). Tal como em Kropki, se não houver círculo, os algarismos adjacentes NÃO estão em razão 3:1. Convenção escolhida por esta aplicação: as fontes descrevem as variantes «ratio» de forma vaga, por isso aqui «ratio» significa estritamente fator 3."],["Verhältnis ×3","Punkte für Paare im Verhältnis 3:1.","Auf der Kante zwischen zwei benachbarten Feldern bedeutet ein Kreis mit einer 3, dass eine Ziffer das Dreifache der anderen ist (1–3, 2–6 oder 3–9). Wie bei Kropki gilt: Ohne Kreis stehen benachbarte Ziffern NICHT im Verhältnis 3:1. Von dieser App gewählte Konvention: Die Quellen beschreiben „Ratio“-Varianten vage, daher bedeutet „Ratio“ hier strikt den Faktor 3."],["Arány ×3","Pontok a 3:1 arányú párokhoz.","Két szomszédos cella közti éleken a 3-assal ellátott kör azt jelenti, hogy az egyik számjegy a másik háromszorosa (1–3, 2–6 vagy 3–9). Ahogy a Kropkinál, ha nincs kör, a szomszédos számjegyek NEM 3:1 arányúak. Az alkalmazás által választott megállapodás: a források homályosan írják le az „arány” változatokat, ezért itt az „arány” szigorúan 3-as szorzót jelent."]],"fog":[["Brouillard de guerre","Les indices apparaissent au fil de la résolution.","Les indices (thermomètres, flèches, Renban) sont cachés dans le brouillard. Une case est éclairée si elle-même ou l’une de ses voisines (diagonales comprises) est donnée ou correctement remplie ; un indice devient visible dès qu’au moins l’une de ses cases est éclairée. Le puzzle est construit de façon que, en partant seulement de ce qui est visible, une logique simple (candidats uniques) puisse mener jusqu’au bout. Les conflits ne sont signalés que pour les indices visibles."],["Nebbia di guerra","Gli indizi compaiono man mano che risolvi.","Gli indizi (termometri, frecce, Renban) sono nascosti nella nebbia. Una cella è illuminata se lei o una delle sue vicine (diagonali comprese) è data o riempita correttamente; un indizio diventa visibile quando almeno una delle sue celle è illuminata. Il puzzle è costruito in modo che, partendo solo da ciò che è visibile, una logica semplice (candidati unici) possa proseguire fino alla fine. I conflitti sono mostrati solo per gli indizi visibili."],["Niebla de guerra","Las pistas aparecen a medida que resuelves.","Las pistas (termómetros, flechas, Renban) están ocultas en la niebla. Una celda se ilumina si ella o una de sus vecinas (diagonales incluidas) es dada o está correctamente rellenada; una pista se hace visible cuando al menos una de sus celdas está iluminada. El puzle está construido de modo que, partiendo solo de lo visible, la lógica simple (candidatos únicos) pueda llegar hasta el final. Los conflictos solo se muestran para las pistas visibles."],["Nevoeiro de guerra","As pistas aparecem à medida que resolve.","As pistas (termómetros, setas, Renban) estão escondidas no nevoeiro. Uma célula fica iluminada se ela ou uma das suas vizinhas (diagonais incluídas) for dada ou estiver corretamente preenchida; uma pista torna-se visível quando pelo menos uma das suas células está iluminada. O puzzle é construído de modo que, partindo apenas do que é visível, a lógica simples (candidatos únicos) consiga chegar ao fim. Os conflitos só são mostrados para as pistas visíveis."],["Nebel des Krieges","Hinweise erscheinen beim Lösen.","Hinweise (Thermometer, Pfeile, Renban) sind im Nebel verborgen. Ein Feld ist beleuchtet, wenn es selbst oder einer seiner Nachbarn (Diagonalen eingeschlossen) vorgegeben oder richtig ausgefüllt ist; ein Hinweis wird sichtbar, sobald mindestens eines seiner Felder beleuchtet ist. Das Rätsel ist so gebaut, dass einfache Logik (einzige Kandidaten) allein vom Sichtbaren aus bis zum Ende weiterführen kann. Konflikte werden nur für sichtbare Hinweise angezeigt."],["Háború köde","A támpontok a megoldás során jelennek meg.","A támpontok (hőmérők, nyilak, Renban) ködben rejtőznek. Egy cella meg van világítva, ha ő maga vagy egyik szomszédja (az átlósakat is beleértve) adott vagy helyesen kitöltött; egy támpont akkor válik láthatóvá, ha legalább egy cellája meg van világítva. A rejtvény úgy van felépítve, hogy a láthatóból kiindulva az egyszerű logika (egyedüli jelöltek) végig el tudjon vezetni. Az ütközéseket csak a látható támpontoknál jelzi."]],"antibishop":[["Anti-fou","Pas de chiffres égaux à deux pas en diagonale.","En plus des règles classiques, deux cases situées exactement à deux pas en diagonale (2 lignes et 2 colonnes d’écart ; le saut « alfil » des échecs féeriques) ne peuvent pas contenir le même chiffre. C’est le saut 2×2, pas le fou glissant (qui imposerait des diagonales entières). Tailles 9×9 et 6×6."],["Anti-alfiere","Nessuna cifra uguale a due passi in diagonale.","Oltre alle regole classiche, due celle esattamente a due passi in diagonale (2 righe e 2 colonne di distanza; il salto «alfil» degli scacchi eterodossi) non possono contenere la stessa cifra. È il salto 2×2, non l’alfiere scorrevole (che imporrebbe intere diagonali). Dimensioni 9×9 e 6×6."],["Anti-alfil","Sin dígitos iguales a dos pasos en diagonal.","Además de las reglas clásicas, dos celdas situadas exactamente a dos pasos en diagonal (2 filas y 2 columnas de distancia; el salto «alfil» del ajedrez heterodoxo) no pueden contener el mismo dígito. Es el salto 2×2, no el alfil deslizante (que impondría diagonales enteras). Tamaños 9×9 y 6×6."],["Anti-bispo","Sem algarismos iguais a dois passos na diagonal.","Além das regras clássicas, duas células exatamente a dois passos na diagonal (2 linhas e 2 colunas de distância; o salto «alfil» do xadrez heterodoxo) não podem conter o mesmo algarismo. É o salto 2×2, não o bispo deslizante (que imporia diagonais inteiras). Tamanhos 9×9 e 6×6."],["Anti-Läufer","Keine gleichen Ziffern zwei Diagonalschritte entfernt.","Zusätzlich zu den klassischen Regeln dürfen zwei Felder, die genau zwei Schritte diagonal auseinanderliegen (2 Zeilen und 2 Spalten Abstand; der „Alfil“-Sprung des Märchenschachs), nicht dieselbe Ziffer enthalten. Es ist der 2×2-Sprung, nicht der gleitende Läufer (der ganze Diagonalen erzwingen würde). Größen 9×9 und 6×6."],["Anti-futó","Nincs egyforma számjegy két átlós lépésre.","A klasszikus szabályokon túl két, pontosan két átlós lépésnyire lévő cella (2 sor és 2 oszlop távolság; a tündérsakk „alfil” ugrása) nem tartalmazhatja ugyanazt a számjegyet. Ez a 2×2-es ugrás, nem a csúszó futó (ami egész átlókat kényszerítene ki). Méretek: 9×9 és 6×6."]],"anticamel":[["Anti-chameau","Pas de chiffres égaux à un saut de chameau (1,3).","En plus des règles classiques, deux cases séparées par un saut de chameau (1 ligne et 3 colonnes, ou 3 lignes et 1 colonne) ne peuvent pas contenir le même chiffre. 9×9 uniquement."],["Anti-cammello","Nessuna cifra uguale a un salto di cammello (1,3).","Oltre alle regole classiche, due celle a un salto di cammello (1 riga e 3 colonne, o 3 righe e 1 colonna) non possono contenere la stessa cifra. Solo 9×9."],["Anti-camello","Sin dígitos iguales a un salto de camello (1,3).","Además de las reglas clásicas, dos celdas a un salto de camello (1 fila y 3 columnas, o 3 filas y 1 columna) no pueden contener el mismo dígito. Solo 9×9."],["Anti-camelo","Sem algarismos iguais a um salto de camelo (1,3).","Além das regras clássicas, duas células a um salto de camelo (1 linha e 3 colunas, ou 3 linhas e 1 coluna) não podem conter o mesmo algarismo. Só 9×9."],["Anti-Kamel","Keine gleichen Ziffern im Kamelsprung (1,3).","Zusätzlich zu den klassischen Regeln dürfen zwei Felder im Abstand eines Kamelsprungs (1 Zeile und 3 Spalten oder 3 Zeilen und 1 Spalte) nicht dieselbe Ziffer enthalten. Nur 9×9."],["Anti-teve","Nincs egyforma számjegy tevelépésnyire (1,3).","A klasszikus szabályokon túl két, tevelépésnyire lévő cella (1 sor és 3 oszlop, vagy 3 sor és 1 oszlop) nem tartalmazhatja ugyanazt a számjegyet. Csak 9×9."]],"antizebra":[["Anti-zèbre","Pas de chiffres égaux à un saut de zèbre (2,3).","En plus des règles classiques, deux cases séparées par un saut de zèbre (2 lignes et 3 colonnes, ou 3 lignes et 2 colonnes) ne peuvent pas contenir le même chiffre. 9×9 uniquement."],["Anti-zebra","Nessuna cifra uguale a un salto di zebra (2,3).","Oltre alle regole classiche, due celle a un salto di zebra (2 righe e 3 colonne, o 3 righe e 2 colonne) non possono contenere la stessa cifra. Solo 9×9."],["Anti-cebra","Sin dígitos iguales a un salto de cebra (2,3).","Además de las reglas clásicas, dos celdas a un salto de cebra (2 filas y 3 columnas, o 3 filas y 2 columnas) no pueden contener el mismo dígito. Solo 9×9."],["Anti-zebra","Sem algarismos iguais a um salto de zebra (2,3).","Além das regras clássicas, duas células a um salto de zebra (2 linhas e 3 colunas, ou 3 linhas e 2 colunas) não podem conter o mesmo algarismo. Só 9×9."],["Anti-Zebra","Keine gleichen Ziffern im Zebrasprung (2,3).","Zusätzlich zu den klassischen Regeln dürfen zwei Felder im Abstand eines Zebrasprungs (2 Zeilen und 3 Spalten oder 3 Zeilen und 2 Spalten) nicht dieselbe Ziffer enthalten. Nur 9×9."],["Anti-zebra","Nincs egyforma számjegy zebralépésnyire (2,3).","A klasszikus szabályokon túl két, zebralépésnyire lévő cella (2 sor és 3 oszlop, vagy 3 sor és 2 oszlop) nem tartalmazhatja ugyanazt a számjegyet. Csak 9×9."]],"torusking":[["Tore anti-roi","Anti-roi sur une grille qui se referme comme un tore.","La grille se prolonge au-delà des bords : le haut est collé au bas, la gauche à la droite. Deux cases séparées par un mouvement de roi, y compris à travers un bord, ne peuvent pas contenir le même chiffre (par exemple, le coin en haut à gauche est en diagonale avec le coin en bas à droite). 9×9 uniquement."],["Toro anti-re","Anti-re su una griglia che si richiude come un toro.","La griglia continua oltre i bordi: l’alto è incollato al basso, la sinistra alla destra. Due celle a una mossa di re, anche attraverso un bordo, non possono contenere la stessa cifra (per esempio l’angolo in alto a sinistra è in diagonale con l’angolo in basso a destra). Solo 9×9."],["Toro anti-rey","Anti-rey en una cuadrícula que se cierra como un toro.","La cuadrícula continúa a través de los bordes: la parte superior está pegada a la inferior, la izquierda a la derecha. Dos celdas a un movimiento de rey, incluso a través de un borde, no pueden contener el mismo dígito (por ejemplo, la esquina superior izquierda es diagonal a la esquina inferior derecha). Solo 9×9."],["Toro anti-rei","Anti-rei numa grelha que se fecha como um toro.","A grelha continua através das margens: o topo está colado ao fundo, a esquerda à direita. Duas células a um movimento de rei, mesmo através de uma margem, não podem conter o mesmo algarismo (por exemplo, o canto superior esquerdo está na diagonal do canto inferior direito). Só 9×9."],["Torus-Anti-König","Anti-König auf einem Gitter, das sich wie ein Torus schließt.","Das Gitter setzt sich über die Ränder fort: oben ist mit unten verklebt, links mit rechts. Zwei Felder im Abstand eines Königszugs, auch über einen Rand hinweg, dürfen nicht dieselbe Ziffer enthalten (zum Beispiel liegt die Ecke oben links diagonal zur Ecke unten rechts). Nur 9×9."],["Tórusz anti-király","Anti-király tórusz módjára záródó rácson.","A rács a széleken túl folytatódik: a teteje az aljához, a bal széle a jobbhoz van ragasztva. Két, királylépésnyire lévő cella, akár egy élen átívelve is, nem tartalmazhatja ugyanazt a számjegyet (például a bal felső sarok átlósan szomszédos a jobb alsó sarokkal). Csak 9×9."]],"torusknight":[["Tore anti-cavalier","Anti-cavalier sur une grille qui se referme comme un tore.","La grille se prolonge au-delà des bords (le haut vers le bas, la gauche vers la droite). Deux cases séparées par un saut de cavalier, y compris à travers un bord, ne peuvent pas contenir le même chiffre. 9×9 uniquement."],["Toro anti-cavallo","Anti-cavallo su una griglia che si richiude come un toro.","La griglia continua oltre i bordi (l’alto verso il basso, la sinistra verso la destra). Due celle a un salto di cavallo, anche attraverso un bordo, non possono contenere la stessa cifra. Solo 9×9."],["Toro anti-caballo","Anti-caballo en una cuadrícula que se cierra como un toro.","La cuadrícula continúa a través de los bordes (la parte superior con la inferior, la izquierda con la derecha). Dos celdas a un salto de caballo, incluso a través de un borde, no pueden contener el mismo dígito. Solo 9×9."],["Toro anti-cavalo","Anti-cavalo numa grelha que se fecha como um toro.","A grelha continua através das margens (o topo com o fundo, a esquerda com a direita). Duas células a um salto de cavalo, mesmo através de uma margem, não podem conter o mesmo algarismo. Só 9×9."],["Torus-Anti-Springer","Anti-Springer auf einem Gitter, das sich wie ein Torus schließt.","Das Gitter setzt sich über die Ränder fort (oben nach unten, links nach rechts). Zwei Felder im Abstand eines Springerzugs, auch über einen Rand hinweg, dürfen nicht dieselbe Ziffer enthalten. Nur 9×9."],["Tórusz anti-huszár","Anti-huszár tórusz módjára záródó rácson.","A rács a széleken túl folytatódik (a teteje az aljára, a bal széle a jobbra). Két, huszárlépésnyire lévő cella, akár egy élen átívelve is, nem tartalmazhatja ugyanazt a számjegyet. Csak 9×9."]],"cylking":[["Cylindre anti-roi","Gauche collée à droite ; haut et bas restent des bords.","Le bord gauche est collé au bord droit comme un cylindre ; le haut et le bas ne sont pas collés. Deux cases séparées par un mouvement de roi (y compris à travers la couture gauche–droite) ne peuvent pas contenir le même chiffre. 9×9 uniquement."],["Cilindro anti-re","Sinistra incollata a destra; alto e basso restano bordi.","Il bordo sinistro è incollato al bordo destro come un cilindro; alto e basso non sono incollati. Due celle a una mossa di re (anche attraverso la giunzione sinistra–destra) non possono contenere la stessa cifra. Solo 9×9."],["Cilindro anti-rey","Izquierda pegada a derecha; arriba y abajo siguen siendo bordes.","El borde izquierdo está pegado al derecho como un cilindro; arriba y abajo no están pegados. Dos celdas a un movimiento de rey (incluso a través de la costura izquierda–derecha) no pueden contener el mismo dígito. Solo 9×9."],["Cilindro anti-rei","Esquerda colada à direita; topo e fundo continuam a ser margens.","A margem esquerda está colada à direita como um cilindro; o topo e o fundo não estão colados. Duas células a um movimento de rei (mesmo através da costura esquerda–direita) não podem conter o mesmo algarismo. Só 9×9."],["Zylinder-Anti-König","Links an rechts geklebt; oben und unten bleiben Ränder.","Der linke Rand ist wie bei einem Zylinder an den rechten geklebt; oben und unten sind nicht verklebt. Zwei Felder im Abstand eines Königszugs (auch über die Naht links–rechts hinweg) dürfen nicht dieselbe Ziffer enthalten. Nur 9×9."],["Henger anti-király","A bal oldal a jobbhoz ragasztva; a teteje és az alja marad él.","A bal szél hengerszerűen a jobb széléhez van ragasztva; a teteje és az alja nincs összeragasztva. Két, királylépésnyire lévő cella (a bal–jobb varraton átívelve is) nem tartalmazhatja ugyanazt a számjegyet. Csak 9×9."]],"mobiusking":[["Möbius anti-roi","Gauche collée à droite avec une torsion.","Le bord gauche est collé au bord droit avec une torsion (la ligne r rejoint la ligne 10−r), comme un ruban de Möbius. Deux cases séparées par un mouvement de roi, y compris à travers la couture, ne peuvent pas contenir le même chiffre. 9×9 uniquement. La convention de collage est celle décrite ici."],["Möbius anti-re","Sinistra incollata a destra con una torsione.","Il bordo sinistro è incollato al bordo destro con una torsione (la riga r si unisce alla riga 10−r), come un nastro di Möbius. Due celle a una mossa di re, anche attraverso la giunzione, non possono contenere la stessa cifra. Solo 9×9. La convenzione di incollaggio è quella descritta qui."],["Möbius anti-rey","Izquierda pegada a derecha con un giro.","El borde izquierdo está pegado al derecho con un giro (la fila r se une a la fila 10−r), como una cinta de Möbius. Dos celdas a un movimiento de rey, incluso a través de la costura, no pueden contener el mismo dígito. Solo 9×9. La convención de pegado es la descrita aquí."],["Möbius anti-rei","Esquerda colada à direita com uma torção.","A margem esquerda está colada à direita com uma torção (a linha r junta-se à linha 10−r), como uma fita de Möbius. Duas células a um movimento de rei, mesmo através da costura, não podem conter o mesmo algarismo. Só 9×9. A convenção de colagem é a descrita aqui."],["Möbius-Anti-König","Links an rechts geklebt mit einer Drehung.","Der linke Rand ist mit einer Drehung an den rechten geklebt (Zeile r schließt an Zeile 10−r an), wie bei einem Möbiusband. Zwei Felder im Abstand eines Königszugs, auch über die Naht hinweg, dürfen nicht dieselbe Ziffer enthalten. Nur 9×9. Die Verklebungskonvention ist die hier beschriebene."],["Möbius anti-király","A bal oldal a jobbhoz ragasztva, megcsavarva.","A bal szél megcsavarással a jobb széléhez van ragasztva (az r sor a 10−r sorhoz csatlakozik), mint egy Möbius-szalag. Két, királylépésnyire lévő cella, akár a varraton átívelve is, nem tartalmazhatja ugyanazt a számjegyet. Csak 9×9. A ragasztási megállapodás az itt leírt."]],"kleinking":[["Klein anti-roi","Bouteille de Klein : gauche–droite tordu, haut–bas simple.","Le bord gauche est collé au bord droit avec une torsion (la ligne r rejoint la ligne 10−r), et le haut est collé au bas sans torsion : une bouteille de Klein. Deux cases séparées par un mouvement de roi, y compris à travers les coutures, ne peuvent pas contenir le même chiffre. 9×9 uniquement. La convention de collage est celle décrite ici."],["Klein anti-re","Bottiglia di Klein: sinistra–destra con torsione, alto–basso semplice.","Il bordo sinistro è incollato al bordo destro con una torsione (la riga r si unisce alla riga 10−r), e l’alto è incollato al basso senza torsione: una bottiglia di Klein. Due celle a una mossa di re, anche attraverso le giunzioni, non possono contenere la stessa cifra. Solo 9×9. La convenzione di incollaggio è quella descritta qui."],["Klein anti-rey","Botella de Klein: izquierda–derecha con giro, arriba–abajo simple.","El borde izquierdo está pegado al derecho con un giro (la fila r se une a la fila 10−r), y el superior al inferior sin giro: una botella de Klein. Dos celdas a un movimiento de rey, incluso a través de las costuras, no pueden contener el mismo dígito. Solo 9×9. La convención de pegado es la descrita aquí."],["Klein anti-rei","Garrafa de Klein: esquerda–direita com torção, topo–fundo simples.","A margem esquerda está colada à direita com uma torção (a linha r junta-se à linha 10−r), e o topo ao fundo sem torção: uma garrafa de Klein. Duas células a um movimento de rei, mesmo através das costuras, não podem conter o mesmo algarismo. Só 9×9. A convenção de colagem é a descrita aqui."],["Klein-Anti-König","Kleinsche Flasche: links–rechts gedreht, oben–unten glatt.","Der linke Rand ist mit einer Drehung an den rechten geklebt (Zeile r schließt an Zeile 10−r an), und oben ist ohne Drehung an unten geklebt: eine Kleinsche Flasche. Zwei Felder im Abstand eines Königszugs, auch über Nähte hinweg, dürfen nicht dieselbe Ziffer enthalten. Nur 9×9. Die Verklebungskonvention ist die hier beschriebene."],["Klein anti-király","Klein-palack: bal–jobb megcsavarva, felül–alul simán.","A bal szél megcsavarással a jobb széléhez van ragasztva (az r sor a 10−r sorhoz csatlakozik), a teteje pedig csavarás nélkül az aljához: ez egy Klein-palack. Két, királylépésnyire lévő cella, akár varratokon átívelve is, nem tartalmazhatja ugyanazt a számjegyet. Csak 9×9. A ragasztási megállapodás az itt leírt."]],"projking":[["Anti-roi du plan projectif","Les deux paires de bords collées avec une torsion.","La gauche est collée à la droite avec une torsion (la ligne r rejoint 10−r) et le haut au bas avec une torsion (la colonne c rejoint 10−c) : un véritable plan projectif. Deux cases séparées par un mouvement de roi, y compris à travers les coutures, ne peuvent pas contenir le même chiffre. 9×9 uniquement. La convention de collage est celle décrite ici."],["Anti-re del piano proiettivo","Entrambe le coppie di bordi incollate con una torsione.","La sinistra è incollata alla destra con una torsione (la riga r si unisce a 10−r) e l’alto al basso con una torsione (la colonna c si unisce a 10−c): un vero piano proiettivo. Due celle a una mossa di re, anche attraverso le giunzioni, non possono contenere la stessa cifra. Solo 9×9. La convenzione di incollaggio è quella descritta qui."],["Anti-rey del plano proyectivo","Ambos pares de bordes pegados con un giro.","La izquierda está pegada a la derecha con un giro (la fila r se une a 10−r) y la parte superior a la inferior con un giro (la columna c se une a 10−c): un auténtico plano proyectivo. Dos celdas a un movimiento de rey, incluso a través de las costuras, no pueden contener el mismo dígito. Solo 9×9. La convención de pegado es la descrita aquí."],["Anti-rei do plano projetivo","Ambos os pares de margens colados com uma torção.","A esquerda está colada à direita com uma torção (a linha r junta-se a 10−r) e o topo ao fundo com uma torção (a coluna c junta-se a 10−c): um verdadeiro plano projetivo. Duas células a um movimento de rei, mesmo através das costuras, não podem conter o mesmo algarismo. Só 9×9. A convenção de colagem é a descrita aqui."],["Anti-König der projektiven Ebene","Beide Randpaare mit einer Drehung verklebt.","Links ist mit einer Drehung an rechts geklebt (Zeile r schließt an 10−r an) und oben mit einer Drehung an unten (Spalte c schließt an 10−c an): eine echte projektive Ebene. Zwei Felder im Abstand eines Königszugs, auch über Nähte hinweg, dürfen nicht dieselbe Ziffer enthalten. Nur 9×9. Die Verklebungskonvention ist die hier beschriebene."],["Projektív sík anti-király","Mindkét élpár megcsavarva ragasztva.","A bal oldal megcsavarással a jobbhoz van ragasztva (az r sor a 10−r-hez csatlakozik), a teteje pedig megcsavarással az aljához (a c oszlop a 10−c-hez csatlakozik): egy valódi projektív sík. Két, királylépésnyire lévő cella, akár varratokon átívelve is, nem tartalmazhatja ugyanazt a számjegyet. Csak 9×9. A ragasztási megállapodás az itt leírt."]],"pandiag":[["Pandiagonal","Carré latin avec toutes les diagonales brisées.","Un carré latin (sans blocs) dans lequel, en plus, toutes les diagonales « brisées » (qui se prolongent à travers le bord comme sur un tore) dans les deux sens contiennent une fois chaque chiffre. Tailles 5 et 7 (pour 4, 6, 8, 9, de tels carrés n’existent pas)."],["Pandiagonale","Quadrato latino con tutte le diagonali spezzate.","Un quadrato latino (senza riquadri) in cui, inoltre, tutte le diagonali «spezzate» (che proseguono oltre il bordo come su un toro) nelle due direzioni contengono ogni cifra una volta. Dimensioni 5 e 7 (per 4, 6, 8, 9 tali quadrati non esistono)."],["Pandiagonal","Cuadrado latino con todas las diagonales rotas.","Un cuadrado latino (sin cajas) en el que, además, todas las diagonales «rotas» (que continúan a través del borde como en un toro) en ambos sentidos contienen cada dígito una vez. Tamaños 5 y 7 (para 4, 6, 8, 9 no existen tales cuadrados)."],["Pandiagonal","Quadrado latino com todas as diagonais quebradas.","Um quadrado latino (sem caixas) em que, além disso, todas as diagonais «quebradas» (que continuam através da margem como num toro) nos dois sentidos contêm cada algarismo uma vez. Tamanhos 5 e 7 (para 4, 6, 8, 9 não existem tais quadrados)."],["Pandiagonal","Lateinisches Quadrat mit allen gebrochenen Diagonalen.","Ein lateinisches Quadrat (ohne Blöcke), bei dem zusätzlich alle „gebrochenen“ Diagonalen (die sich wie auf einem Torus über den Rand fortsetzen) in beiden Richtungen jede Ziffer einmal enthalten. Größen 5 und 7 (für 4, 6, 8, 9 gibt es solche Quadrate nicht)."],["Pandiagonális","Latin négyzet az összes tört átlóval.","Latin négyzet (blokkok nélkül), amelyben ráadásul az összes „tört” átló (amely az élen túl folytatódik, mint egy tóruszon) mindkét irányban egyszer tartalmazza az összes számjegyet. Méretek: 5 és 7 (4, 6, 8, 9 esetén nincs ilyen négyzet)."]],"zero":[["Sudoku zéro","Les chiffres vont de 0 à N−1.","Le même jeu que le Classique ; seuls les symboles diffèrent : 0…N−1 (en 9×9 : 0–8). Les règles sont les règles classiques, c’est donc plutôt une variante d’affichage."],["Sudoku zero","Le cifre vanno da 0 a N−1.","Lo stesso gioco del Classico; cambiano solo i simboli: 0…N−1 (nel 9×9: 0–8). Le regole sono quelle classiche, quindi è più una variante di visualizzazione."],["Sudoku cero","Los dígitos van de 0 a N−1.","El mismo juego que el Clásico; solo cambian los símbolos: 0…N−1 (en 9×9: 0–8). Las reglas son las clásicas, así que es más bien una variante de presentación."],["Sudoku zero","Os algarismos vão de 0 a N−1.","O mesmo jogo do Clássico; só mudam os símbolos: 0…N−1 (em 9×9: 0–8). As regras são as clássicas, por isso é mais uma variante de apresentação."],["Null-Sudoku","Die Ziffern laufen von 0 bis N−1.","Dasselbe Spiel wie Klassisch; nur die Symbole unterscheiden sich: 0…N−1 (bei 9×9: 0–8). Die Regeln sind die klassischen, es ist also eher eine Darstellungsvariante."],["Nulla sudoku","A számjegyek 0-tól N−1-ig futnak.","Ugyanaz a játék, mint a Klasszikus; csak a jelek különböznek: 0…N−1 (9×9-en: 0–8). A szabályok a klasszikusak, ezért ez inkább megjelenítési változat."]],"symcomp":[["Symétrie complémentaire","Les cases opposées par rapport au centre totalisent N+1.","En plus des règles classiques, deux cases symétriques par rapport au centre de la grille (rotation de 180°) ont pour somme N+1 (en 9×9 : 10) ; en 9×9, la case centrale vaut donc 5. Tailles 9×9 et 4×4."],["Simmetria complementare","Le celle opposte rispetto al centro sommano N+1.","Oltre alle regole classiche, due celle simmetriche rispetto al centro della griglia (rotazione di 180°) sommano N+1 (nel 9×9: 10); nel 9×9 la cella centrale è quindi 5. Dimensioni 9×9 e 4×4."],["Simetría complementaria","Las celdas opuestas respecto al centro suman N+1.","Además de las reglas clásicas, dos celdas simétricas respecto al centro de la cuadrícula (giro de 180°) suman N+1 (en 9×9: 10); en 9×9, por tanto, la celda central es 5. Tamaños 9×9 y 4×4."],["Simetria complementar","As células opostas em relação ao centro somam N+1.","Além das regras clássicas, duas células simétricas em relação ao centro da grelha (rotação de 180°) somam N+1 (em 9×9: 10); em 9×9, a célula central é portanto 5. Tamanhos 9×9 e 4×4."],["Komplementäre Symmetrie","Gegenüberliegende Felder am Mittelpunkt ergeben N+1.","Zusätzlich zu den klassischen Regeln ergeben zwei zur Gittermitte symmetrische Felder (180°-Drehung) zusammen N+1 (bei 9×9: 10); bei 9×9 ist das Mittelfeld daher 5. Größen 9×9 und 4×4."],["Kiegészítő szimmetria","A középpontra tükrös cellák összege N+1.","A klasszikus szabályokon túl a rács középpontjára szimmetrikus két cella (180°-os forgatás) összege N+1 (9×9-en: 10); 9×9-en a középső cella ezért 5. Méretek: 9×9 és 4×4."]],"symparity":[["Parité symétrique","Les cases opposées par rapport au centre ont la même parité.","En plus des règles classiques, deux cases symétriques par rapport au centre de la grille (rotation de 180°) sont toutes deux paires ou toutes deux impaires."],["Parità simmetrica","Le celle opposte rispetto al centro hanno la stessa parità.","Oltre alle regole classiche, due celle simmetriche rispetto al centro della griglia (rotazione di 180°) sono entrambe pari o entrambe dispari."],["Paridad simétrica","Las celdas opuestas respecto al centro comparten paridad.","Además de las reglas clásicas, dos celdas simétricas respecto al centro de la cuadrícula (giro de 180°) son ambas pares o ambas impares."],["Paridade simétrica","As células opostas em relação ao centro partilham a paridade.","Além das regras clássicas, duas células simétricas em relação ao centro da grelha (rotação de 180°) são ambas pares ou ambas ímpares."],["Symmetrische Parität","Gegenüberliegende Felder am Mittelpunkt haben dieselbe Parität.","Zusätzlich zu den klassischen Regeln sind zwei zur Gittermitte symmetrische Felder (180°-Drehung) entweder beide gerade oder beide ungerade."],["Szimmetrikus paritás","A középpontra tükrös cellák paritása azonos.","A klasszikus szabályokon túl a rács középpontjára szimmetrikus két cella (180°-os forgatás) vagy mindkettő páros, vagy mindkettő páratlan."]],"cgrav":[["Centre de gravité","Chaque ligne s’équilibre comme une balançoire.","En plus des règles classiques, chaque ligne est équilibrée : numérotez les positions −4…+4 et traitez chaque chiffre comme un poids ; la somme de poids × position est 0 (le centre de gravité est exactement au milieu). 9×9 uniquement ; la génération peut prendre quelques secondes en Facile et jusqu’à ~20 s en Difficile."],["Centro di gravità","Ogni riga si bilancia come un’altalena.","Oltre alle regole classiche, ogni riga è in equilibrio: numera le posizioni −4…+4 e tratta ogni cifra come un peso; la somma di peso × posizione è 0 (il baricentro è esattamente al centro). Solo 9×9; la generazione può richiedere qualche secondo in Facile e fino a ~20 s in Difficile."],["Centro de gravedad","Cada fila se equilibra como un balancín.","Además de las reglas clásicas, cada fila está equilibrada: numera las posiciones −4…+4 y trata cada dígito como un peso; la suma de peso × posición es 0 (el centro de gravedad está exactamente en el medio). Solo 9×9; la generación puede tardar unos segundos en Fácil y hasta ~20 s en Difícil."],["Centro de gravidade","Cada linha equilibra-se como um balancé.","Além das regras clássicas, cada linha está equilibrada: numere as posições −4…+4 e trate cada algarismo como um peso; a soma de peso × posição é 0 (o centro de gravidade está exatamente no meio). Só 9×9; a geração pode demorar alguns segundos em Fácil e até ~20 s em Difícil."],["Schwerpunkt","Jede Zeile hält sich im Gleichgewicht wie eine Wippe.","Zusätzlich zu den klassischen Regeln ist jede Zeile ausbalanciert: Nummerieren Sie die Positionen −4…+4 und behandeln Sie jede Ziffer als Gewicht; die Summe aus Gewicht × Position ist 0 (der Schwerpunkt liegt genau in der Mitte). Nur 9×9; die Erzeugung kann bei Leicht einige Sekunden und bei Schwer bis zu ~20 s dauern."],["Súlypont","Minden sor egyensúlyban van, mint egy libikóka.","A klasszikus szabályokon túl minden sor kiegyensúlyozott: számozd a pozíciókat −4…+4-ig, és kezeld minden számjegyet súlyként; a súly × pozíció összege 0 (a súlypont pontosan középen van). Csak 9×9; a generálás Könnyű szinten néhány másodpercig, Nehéznél akár ~20 másodpercig is tarthat."]],"lexrows":[["Lignes lexicographiques","Les lignes croissent comme des mots du dictionnaire.","En plus des règles classiques, en lisant les lignes de haut en bas comme des « mots » de chiffres, chaque ligne est strictement plus petite lexicographiquement que celle du dessous (comparaison au premier chiffre différent). Comme la première colonne contient des chiffres différents, la règle revient en pratique à dire que la première colonne, lue de haut en bas, est 1, 2, …, N."],["Righe lessicografiche","Le righe crescono come parole del dizionario.","Oltre alle regole classiche, leggendo le righe dall’alto in basso come «parole» di cifre, ogni riga è strettamente minore in ordine lessicografico di quella sotto (si confronta alla prima cifra diversa). Poiché la prima colonna contiene cifre diverse, la regola significa in pratica che la prima colonna, letta dall’alto in basso, è 1, 2, …, N."],["Filas lexicográficas","Las filas crecen como palabras del diccionario.","Además de las reglas clásicas, al leer las filas de arriba abajo como «palabras» de dígitos, cada fila es estrictamente menor lexicográficamente que la de debajo (se compara en el primer dígito distinto). Como la primera columna contiene dígitos distintos, la regla significa en la práctica que la primera columna, leída de arriba abajo, es 1, 2, …, N."],["Linhas lexicográficas","As linhas crescem como palavras do dicionário.","Além das regras clássicas, ao ler as linhas de cima para baixo como «palavras» de algarismos, cada linha é estritamente menor lexicograficamente do que a de baixo (compara-se no primeiro algarismo diferente). Como a primeira coluna contém algarismos diferentes, a regra significa na prática que a primeira coluna, lida de cima para baixo, é 1, 2, …, N."],["Lexikografische Zeilen","Zeilen steigen wie Wörter im Wörterbuch.","Zusätzlich zu den klassischen Regeln gilt, wenn man die Zeilen von oben nach unten als Ziffern-„Wörter“ liest: Jede Zeile ist lexikographisch echt kleiner als die darunter (verglichen wird an der ersten abweichenden Ziffer). Da die erste Spalte verschiedene Ziffern enthält, bedeutet die Regel in der Praxis, dass die erste Spalte, von oben nach unten gelesen, 1, 2, …, N lautet."],["Lexikografikus sorok","A sorok úgy nőnek, mint a szótári szavak.","A klasszikus szabályokon túl, ha a sorokat fentről lefelé számjegy-„szavakként” olvassuk, minden sor lexikografikusan szigorúan kisebb az alatta lévőnél (az első eltérő számjegynél hasonlítjuk össze). Mivel az első oszlop különböző számjegyeket tartalmaz, a szabály a gyakorlatban azt jelenti, hogy az első oszlop fentről lefelé olvasva 1, 2, …, N."]],"extremes":[["Extrêmes adjacents","Le plus petit et le plus grand chiffre de chaque bloc se touchent.","En plus des règles classiques, dans chaque bloc les chiffres 1 et N se trouvent dans des cases voisines, diagonales comprises (mouvement du roi). Inclure les diagonales est la convention choisie ici : avec seulement les voisins orthogonaux, aucune grille 9×9 n’existe (vérifié de façon exhaustive)."],["Estremi adiacenti","La cifra più piccola e quella più grande di ogni riquadro si toccano.","Oltre alle regole classiche, in ogni riquadro le cifre 1 e N si trovano in celle vicine, diagonali comprese (mossa del re). Includere le diagonali è la convenzione scelta qui: con i soli vicini ortogonali non esiste nessuna griglia 9×9 (verificato in modo esaustivo)."],["Extremos adyacentes","El dígito menor y el mayor de cada caja se tocan.","Además de las reglas clásicas, en cada caja los dígitos 1 y N están en celdas vecinas, diagonales incluidas (movimiento de rey). Incluir las diagonales es la convención elegida aquí: con solo vecinas ortogonales no existe ninguna cuadrícula 9×9 (comprobado de forma exhaustiva)."],["Extremos adjacentes","O menor e o maior algarismo de cada caixa tocam-se.","Além das regras clássicas, em cada caixa os algarismos 1 e N estão em células vizinhas, diagonais incluídas (movimento de rei). Incluir as diagonais é a convenção escolhida aqui: só com vizinhas ortogonais não existe nenhuma grelha 9×9 (verificado de forma exaustiva)."],["Benachbarte Extreme","Die kleinste und die größte Ziffer jedes Blocks berühren sich.","Zusätzlich zu den klassischen Regeln liegen in jedem Block die Ziffern 1 und N in benachbarten Feldern, Diagonalen eingeschlossen (Königszug). Die Einbeziehung der Diagonalen ist die hier gewählte Konvention: Nur mit orthogonalen Nachbarn existiert kein 9×9-Gitter (erschöpfend geprüft)."],["Szomszédos szélsőértékek","Minden blokk legkisebb és legnagyobb számjegye érintkezik.","A klasszikus szabályokon túl minden blokkban az 1 és az N számjegy szomszédos cellákban van, az átlókat is beleértve (királylépés). Az átlók bevonása az itt választott megállapodás: csak ortogonális szomszédokkal nem létezik 9×9-es rács (kimerítően ellenőrizve)."]],"boxbalance":[["Blocs équilibrés","Les première et dernière colonnes d’un bloc ont des sommes égales.","En plus des règles classiques, dans chaque bloc la somme de la colonne de gauche est égale à la somme de la colonne de droite."],["Riquadri bilanciati","La prima e l’ultima colonna di un riquadro hanno somme uguali.","Oltre alle regole classiche, in ogni riquadro la somma della colonna sinistra è uguale alla somma della colonna destra."],["Cajas equilibradas","La primera y la última columna de cada caja tienen sumas iguales.","Además de las reglas clásicas, en cada caja la suma de la columna izquierda es igual a la suma de la columna derecha."],["Caixas equilibradas","A primeira e a última coluna de cada caixa têm somas iguais.","Além das regras clássicas, em cada caixa a soma da coluna esquerda é igual à soma da coluna direita."],["Ausgeglichene Blöcke","Erste und letzte Blockspalte haben gleiche Summen.","Zusätzlich zu den klassischen Regeln ist in jedem Block die Summe der linken Spalte gleich der Summe der rechten Spalte."],["Kiegyensúlyozott blokkok","Az első és az utolsó blokkoszlop összege egyenlő.","A klasszikus szabályokon túl minden blokkban a bal oldali oszlop összege egyenlő a jobb oldali oszlop összegével."]],"lonely5":[["Le 5 solitaire","Un 5 n’a que des voisins pairs.","En plus des règles classiques, chaque 5 n’a que des voisins orthogonaux pairs (un chiffre impair ne touche donc jamais un 5). Tailles 9×9 et 6×6."],["Il 5 solitario","Un 5 ha solo vicini pari.","Oltre alle regole classiche, ogni 5 ha solo vicini ortogonali pari (quindi una cifra dispari non tocca mai un 5). Dimensioni 9×9 e 6×6."],["El 5 solitario","Un 5 solo tiene vecinos pares.","Además de las reglas clásicas, cada 5 solo tiene vecinos ortogonales pares (así que un dígito impar nunca toca a un 5). Tamaños 9×9 y 6×6."],["O 5 solitário","Um 5 só tem vizinhos pares.","Além das regras clássicas, cada 5 só tem vizinhos ortogonais pares (portanto um algarismo ímpar nunca toca num 5). Tamanhos 9×9 e 6×6."],["Die einsame 5","Eine 5 hat nur gerade Nachbarn.","Zusätzlich zu den klassischen Regeln hat jede 5 nur gerade orthogonale Nachbarn (eine ungerade Ziffer berührt also nie eine 5). Größen 9×9 und 6×6."],["A magányos 5-ös","Az 5-nek csak páros szomszédai vannak.","A klasszikus szabályokon túl minden 5-nek csak páros ortogonális szomszédai vannak (így páratlan számjegy sosem érint 5-öst). Méretek: 9×9 és 6×6."]],"nolonely":[["Sans cases isolées","Chaque case a un voisin consécutif.","En plus des règles classiques, chaque case a au moins un voisin orthogonal dont le chiffre diffère exactement de 1 du sien."],["Senza celle isolate","Ogni cella ha un vicino consecutivo.","Oltre alle regole classiche, ogni cella ha almeno un vicino ortogonale la cui cifra differisce esattamente di 1 dalla sua."],["Sin celdas solitarias","Cada celda tiene un vecino consecutivo.","Además de las reglas clásicas, cada celda tiene al menos un vecino ortogonal cuyo dígito difiere exactamente en 1 del suyo."],["Sem células isoladas","Cada célula tem um vizinho consecutivo.","Além das regras clássicas, cada célula tem pelo menos um vizinho ortogonal cujo algarismo difere exatamente 1 do seu."],["Keine einsamen Felder","Jedes Feld hat einen aufeinanderfolgenden Nachbarn.","Zusätzlich zu den klassischen Regeln hat jedes Feld mindestens einen orthogonalen Nachbarn, dessen Ziffer sich um genau 1 von seiner eigenen unterscheidet."],["Nincs magányos cella","Minden cellának van egymást követő szomszédja.","A klasszikus szabályokon túl minden cellának van legalább egy ortogonális szomszédja, amelynek számjegye pontosan 1-gyel különbözik az övétől."]],"noprog":[["Pas de progressions arithmétiques","Trois voisins ne forment jamais une progression arithmétique.","En plus des règles classiques, trois cases adjacentes d’une ligne ou d’une colonne ne peuvent pas former une progression arithmétique (par exemple 2-4-6 ou 7-5-3 sont interdits)."],["Nessuna progressione aritmetica","Tre vicini non formano mai una progressione aritmetica.","Oltre alle regole classiche, tre celle adiacenti in una riga o colonna non possono formare una progressione aritmetica (per esempio 2-4-6 o 7-5-3 sono vietati)."],["Sin progresiones aritméticas","Tres vecinos no forman nunca una progresión aritmética.","Además de las reglas clásicas, tres celdas adyacentes de una fila o columna no pueden formar una progresión aritmética (por ejemplo, 2-4-6 o 7-5-3 están prohibidos)."],["Sem progressões aritméticas","Três vizinhos nunca formam uma progressão aritmética.","Além das regras clássicas, três células adjacentes numa linha ou coluna não podem formar uma progressão aritmética (por exemplo, 2-4-6 ou 7-5-3 são proibidos)."],["Keine arithmetischen Folgen","Keine drei Nachbarn bilden eine arithmetische Folge.","Zusätzlich zu den klassischen Regeln dürfen drei benachbarte Felder in einer Zeile oder Spalte keine arithmetische Folge bilden (zum Beispiel sind 2-4-6 oder 7-5-3 verboten)."],["Nincs számtani sorozat","Három szomszéd sem alkot számtani sorozatot.","A klasszikus szabályokon túl három szomszédos cella egy sorban vagy oszlopban nem alkothat számtani sorozatot (például a 2-4-6 vagy a 7-5-3 tilos)."]],"semimagic":[["Blocs semi-magiques","Les lignes et colonnes de chaque bloc totalisent 15.","En plus des règles classiques, chaque ligne et chaque colonne de chaque bloc a pour somme 15. Des blocs entièrement magiques (avec les diagonales) sont impossibles, car les trois blocs d’une bande devraient tous avoir le centre 5 sur la même ligne de la grille ; les diagonales ne sont donc pas contraintes. 9×9 uniquement (en 4×4, les lignes et colonnes exigeraient des blocs avec des chiffres répétés)."],["Riquadri semimagici","Righe e colonne di ogni riquadro sommano 15.","Oltre alle regole classiche, ogni riga e ogni colonna di ogni riquadro somma 15. Riquadri completamente magici (con le diagonali) sono impossibili, perché i tre riquadri di una fascia dovrebbero avere tutti il centro 5 sulla stessa riga della griglia; le diagonali quindi non sono vincolate. Solo 9×9 (nel 4×4 righe e colonne richiederebbero riquadri con cifre ripetute)."],["Cajas semimágicas","Las filas y columnas de cada caja suman 15.","Además de las reglas clásicas, cada fila y cada columna de cada caja suma 15. Las cajas totalmente mágicas (con las diagonales) son imposibles, porque las tres cajas de una banda tendrían que tener todas el centro 5 en la misma fila de la cuadrícula; por eso las diagonales no se restringen. Solo 9×9 (en 4×4 las filas y columnas exigirían cajas con dígitos repetidos)."],["Caixas semimágicas","As linhas e colunas de cada caixa somam 15.","Além das regras clássicas, cada linha e cada coluna de cada caixa soma 15. Caixas totalmente mágicas (com as diagonais) são impossíveis, porque as três caixas de uma faixa teriam todas de ter o centro 5 na mesma linha da grelha; por isso as diagonais não são restringidas. Só 9×9 (em 4×4 as linhas e colunas exigiriam caixas com algarismos repetidos)."],["Halbmagische Blöcke","Zeilen und Spalten jedes Blocks ergeben 15.","Zusätzlich zu den klassischen Regeln ergibt jede Zeile und jede Spalte jedes Blocks die Summe 15. Vollständig magische Blöcke (mit Diagonalen) sind unmöglich, da die drei Blöcke eines Streifens alle die Mitte 5 in derselben Gitterzeile haben müssten; die Diagonalen sind deshalb nicht eingeschränkt. Nur 9×9 (bei 4×4 würden Zeilen und Spalten Blöcke mit wiederholten Ziffern erfordern)."],["Félig mágikus blokkok","Minden blokk sorainak és oszlopainak összege 15.","A klasszikus szabályokon túl minden blokk minden sorának és oszlopának összege 15. Teljesen mágikus blokkok (az átlókkal együtt) lehetetlenek, mert egy sáv három blokkjának mindegyikében a 5-ös középnek ugyanabban a rácssorban kellene lennie; ezért az átlókra nincs megkötés. Csak 9×9 (4×4-en a sorok és oszlopok ismétlődő számjegyű blokkokat kívánnának)."]],"radar":[["Radar","L’indice dit où se trouve le plus grand chiffre.","En plus des règles classiques, un nombre à l’extérieur de la grille donne la position (comptée à partir de cette extrémité) du plus grand chiffre (9 en 9×9) dans cette ligne ou colonne."],["Radar","L’indizio dice dove si trova la cifra più grande.","Oltre alle regole classiche, un numero fuori dalla griglia indica la posizione (contata da quell’estremità) della cifra più grande (9 nel 9×9) in quella riga o colonna."],["Radar","La pista dice dónde está el dígito mayor.","Además de las reglas clásicas, un número fuera de la cuadrícula da la posición (contada desde ese extremo) del dígito mayor (9 en 9×9) en esa fila o columna."],["Radar","A pista diz onde está o maior algarismo.","Além das regras clássicas, um número fora da grelha dá a posição (contada a partir dessa extremidade) do maior algarismo (9 em 9×9) nessa linha ou coluna."],["Radar","Der Hinweis sagt, wo die größte Ziffer steht.","Zusätzlich zu den klassischen Regeln gibt eine Zahl außerhalb des Gitters die Position (von diesem Ende aus gezählt) der größten Ziffer (9 bei 9×9) in dieser Zeile oder Spalte an."],["Radar","A támpont megmondja, hol van a legnagyobb számjegy.","A klasszikus szabályokon túl a rácson kívüli szám megadja a legnagyobb számjegy (9×9-en a 9) helyzetét (az adott végtől számolva) az adott sorban vagy oszlopban."]],"sandnum":[["Sandwich numérique","Combien de cases se trouvent entre 1 et N.","En plus des règles classiques, un nombre à l’extérieur de la grille indique combien de cases se trouvent entre le chiffre 1 et le chiffre N (9 en 9×9) dans cette ligne ou colonne."],["Sandwich numerico","Quante celle stanno tra 1 e N.","Oltre alle regole classiche, un numero fuori dalla griglia indica quante celle stanno tra la cifra 1 e la cifra N (9 nel 9×9) in quella riga o colonna."],["Sándwich numérico","Cuántas celdas hay entre 1 y N.","Además de las reglas clásicas, un número fuera de la cuadrícula indica cuántas celdas hay entre el dígito 1 y el dígito N (9 en 9×9) en esa fila o columna."],["Sanduíche numérico","Quantas células há entre 1 e N.","Além das regras clássicas, um número fora da grelha indica quantas células há entre o algarismo 1 e o algarismo N (9 em 9×9) nessa linha ou coluna."],["Zählsandwich","Wie viele Felder zwischen 1 und N liegen.","Zusätzlich zu den klassischen Regeln gibt eine Zahl außerhalb des Gitters an, wie viele Felder zwischen der Ziffer 1 und der Ziffer N (9 bei 9×9) in dieser Zeile oder Spalte liegen."],["Számláló szendvics","Hány cella van 1 és N között.","A klasszikus szabályokon túl a rácson kívüli szám megmondja, hány cella van az 1-es és az N számjegy (9×9-en a 9) között az adott sorban vagy oszlopban."]],"sandpar":[["Sandwich de parité","Combien de chiffres impairs se trouvent entre 1 et N.","En plus des règles classiques, un nombre à l’extérieur de la grille indique combien de chiffres impairs se trouvent entre 1 et N dans cette ligne ou colonne."],["Sandwich di parità","Quante cifre dispari stanno tra 1 e N.","Oltre alle regole classiche, un numero fuori dalla griglia indica quante cifre dispari stanno tra 1 e N in quella riga o colonna."],["Sándwich de paridad","Cuántos dígitos impares hay entre 1 y N.","Además de las reglas clásicas, un número fuera de la cuadrícula indica cuántos dígitos impares hay entre 1 y N en esa fila o columna."],["Sanduíche de paridade","Quantos algarismos ímpares há entre 1 e N.","Além das regras clássicas, um número fora da grelha indica quantos algarismos ímpares há entre 1 e N nessa linha ou coluna."],["Paritätssandwich","Wie viele ungerade Ziffern zwischen 1 und N liegen.","Zusätzlich zu den klassischen Regeln gibt eine Zahl außerhalb des Gitters an, wie viele ungerade Ziffern in dieser Zeile oder Spalte zwischen 1 und N liegen."],["Paritásszendvics","Hány páratlan számjegy van 1 és N között.","A klasszikus szabályokon túl a rácson kívüli szám megmondja, hány páratlan számjegy van az 1 és az N között az adott sorban vagy oszlopban."]],"sand2":[["Double sandwich","Deux sommes : entre 1 et 9, entre 2 et 8.","En plus des règles classiques, un indice « a,b » à l’extérieur de la grille signifie : a = somme des chiffres entre 1 et 9, b = somme des chiffres entre 2 et 8 dans cette ligne ou colonne. 9×9 uniquement."],["Sandwich doppio","Due somme: tra 1 e 9, tra 2 e 8.","Oltre alle regole classiche, un indizio «a,b» fuori dalla griglia significa: a = somma delle cifre tra 1 e 9, b = somma delle cifre tra 2 e 8 in quella riga o colonna. Solo 9×9."],["Sándwich doble","Dos sumas: entre 1 y 9, entre 2 y 8.","Además de las reglas clásicas, una pista «a,b» fuera de la cuadrícula significa: a = suma de los dígitos entre 1 y 9, b = suma de los dígitos entre 2 y 8 en esa fila o columna. Solo 9×9."],["Sanduíche duplo","Duas somas: entre 1 e 9, entre 2 e 8.","Além das regras clássicas, uma pista «a,b» fora da grelha significa: a = soma dos algarismos entre 1 e 9, b = soma dos algarismos entre 2 e 8 nessa linha ou coluna. Só 9×9."],["Doppelsandwich","Zwei Summen: zwischen 1 und 9, zwischen 2 und 8.","Zusätzlich zu den klassischen Regeln bedeutet ein Hinweis „a,b“ außerhalb des Gitters: a = Summe der Ziffern zwischen 1 und 9, b = Summe der Ziffern zwischen 2 und 8 in dieser Zeile oder Spalte. Nur 9×9."],["Dupla szendvics","Két összeg: 1 és 9 között, 2 és 8 között.","A klasszikus szabályokon túl a rácson kívüli „a,b” támpont azt jelenti: a = az 1 és 9 közötti számjegyek összege, b = a 2 és 8 közötti számjegyek összege az adott sorban vagy oszlopban. Csak 9×9."]],"subsol":[["Sous-sol","Comme les Gratte-ciel, mais avec les chiffres inversés.","En plus des règles classiques, un nombre à l’extérieur de la grille indique combien de fois, en regardant depuis cette extrémité, apparaît un chiffre plus petit que tous les chiffres qui le précèdent (le premier chiffre compte). C’est l’opposé des gratte-ciel : ici on compte les minima successifs. C’est les Gratte-ciel avec les chiffres inversés (d devient N+1−d), donc logiquement isomorphe."],["Seminterrato","Come i Grattacieli, ma con le cifre invertite.","Oltre alle regole classiche, un numero fuori dalla griglia indica quante volte, guardando da quell’estremità, compare una cifra più piccola di tutte quelle che la precedono (la prima cifra conta). È l’opposto dei grattacieli: qui si contano i minimi successivi. Sono i Grattacieli con le cifre invertite (d diventa N+1−d), quindi logicamente isomorfi."],["Sótano","Como los Rascacielos, pero con los dígitos invertidos.","Además de las reglas clásicas, un número fuera de la cuadrícula indica cuántas veces, mirando desde ese extremo, aparece un dígito menor que todos los anteriores (el primer dígito cuenta). Es lo opuesto a los rascacielos: aquí se cuentan los mínimos sucesivos. Son los Rascacielos con los dígitos invertidos (d pasa a ser N+1−d), por lo que es lógicamente isomorfo."],["Cave","Como os Arranha-céus, mas com os algarismos invertidos.","Além das regras clássicas, um número fora da grelha indica quantas vezes, olhando a partir dessa extremidade, aparece um algarismo menor do que todos os anteriores (o primeiro algarismo conta). É o oposto dos arranha-céus: aqui contam-se os mínimos sucessivos. São os Arranha-céus com os algarismos invertidos (d passa a N+1−d), logo logicamente isomorfo."],["Keller","Wie Wolkenkratzer, aber mit vertauschten Ziffern.","Zusätzlich zu den klassischen Regeln gibt eine Zahl außerhalb des Gitters an, wie oft man von diesem Ende aus eine Ziffer sieht, die kleiner ist als alle vorherigen (die erste Ziffer zählt mit). Es ist das Gegenstück zu den Wolkenkratzern: Hier werden aufeinanderfolgende Minima gezählt. Es sind die Wolkenkratzer mit vertauschten Ziffern (d wird zu N+1−d), also logisch isomorph."],["Pince","Mint a Felhőkarcolók, de megfordított számjegyekkel.","A klasszikus szabályokon túl a rácson kívüli szám megmondja, hányszor jelenik meg az adott végről nézve olyan számjegy, amely kisebb az összes előtte állónál (az első számjegy is számít). Ez a felhőkarcolók ellentéte: itt egymást követő minimumokat számolunk. Ez a Felhőkarcolók megfordított számjegyekkel (d helyett N+1−d), tehát logikailag izomorf vele."]],"prodmargin":[["Produit en bordure","Produit des deux premiers chiffres.","En plus des règles classiques, un nombre à l’extérieur de la grille est le produit des deux premiers chiffres de cette ligne ou colonne, vus depuis cette extrémité."],["Prodotto sul bordo","Prodotto delle prime due cifre.","Oltre alle regole classiche, un numero fuori dalla griglia è il prodotto delle prime due cifre di quella riga o colonna, viste da quell’estremità."],["Producto en el borde","Producto de los dos primeros dígitos.","Además de las reglas clásicas, un número fuera de la cuadrícula es el producto de los dos primeros dígitos de esa fila o columna, vistos desde ese extremo."],["Produto na margem","Produto dos dois primeiros algarismos.","Além das regras clássicas, um número fora da grelha é o produto dos dois primeiros algarismos dessa linha ou coluna, vistos a partir dessa extremidade."],["Randprodukt","Produkt der ersten beiden Ziffern.","Zusätzlich zu den klassischen Regeln ist eine Zahl außerhalb des Gitters das Produkt der ersten beiden Ziffern dieser Zeile oder Spalte, von diesem Ende aus gesehen."],["Szélső szorzat","Az első két számjegy szorzata.","A klasszikus szabályokon túl a rácson kívüli szám az adott sor vagy oszlop első két számjegyének szorzata, az adott végről nézve."]],"diffmargin":[["Différence en bordure","Différence des deux premiers chiffres.","En plus des règles classiques, un nombre à l’extérieur de la grille est la différence absolue des deux premiers chiffres de cette ligne ou colonne, vus depuis cette extrémité."],["Differenza sul bordo","Differenza delle prime due cifre.","Oltre alle regole classiche, un numero fuori dalla griglia è la differenza assoluta delle prime due cifre di quella riga o colonna, viste da quell’estremità."],["Diferencia en el borde","Diferencia de los dos primeros dígitos.","Además de las reglas clásicas, un número fuera de la cuadrícula es la diferencia absoluta de los dos primeros dígitos de esa fila o columna, vistos desde ese extremo."],["Diferença na margem","Diferença dos dois primeiros algarismos.","Além das regras clássicas, um número fora da grelha é a diferença absoluta dos dois primeiros algarismos dessa linha ou coluna, vistos a partir dessa extremidade."],["Randdifferenz","Differenz der ersten beiden Ziffern.","Zusätzlich zu den klassischen Regeln ist eine Zahl außerhalb des Gitters die absolute Differenz der ersten beiden Ziffern dieser Zeile oder Spalte, von diesem Ende aus gesehen."],["Szélső különbség","Az első két számjegy különbsége.","A klasszikus szabályokon túl a rácson kívüli szám az adott sor vagy oszlop első két számjegyének abszolút különbsége, az adott végről nézve."]],"ascents":[["Montées","Combien de paires voisines montent.","En plus des règles classiques, un nombre à l’extérieur de la grille indique combien de fois, en regardant depuis cette extrémité, un chiffre est immédiatement suivi d’un plus grand."],["Salite","Quante coppie vicine salgono.","Oltre alle regole classiche, un numero fuori dalla griglia indica quante volte, guardando da quell’estremità, una cifra è seguita immediatamente da una più grande."],["Ascensos","Cuántas parejas vecinas suben.","Además de las reglas clásicas, un número fuera de la cuadrícula indica cuántas veces, mirando desde ese extremo, a un dígito le sigue inmediatamente uno mayor."],["Subidas","Quantos pares vizinhos sobem.","Além das regras clássicas, um número fora da grelha indica quantas vezes, olhando a partir dessa extremidade, um algarismo é imediatamente seguido de um maior."],["Anstiege","Wie viele benachbarte Paare steigen.","Zusätzlich zu den klassischen Regeln gibt eine Zahl außerhalb des Gitters an, wie oft man von diesem Ende aus auf eine Ziffer unmittelbar eine größere folgen sieht."],["Emelkedések","Hány szomszédos pár emelkedik.","A klasszikus szabályokon túl a rácson kívüli szám megmondja, hányszor követ egy számjegyet közvetlenül nagyobb, az adott végről nézve."]],"inversions":[["Inversions","Combien de paires sont dans le désordre.","En plus des règles classiques, un nombre à l’extérieur de la grille est le nombre d’inversions de cette ligne/colonne vue depuis cette extrémité : combien de paires de chiffres (pas nécessairement adjacents) ont le premier plus grand que le second."],["Inversioni","Quante coppie sono fuori ordine.","Oltre alle regole classiche, un numero fuori dalla griglia è il numero di inversioni di quella riga/colonna vista da quell’estremità: quante coppie di cifre (non necessariamente adiacenti) hanno la prima maggiore della seconda."],["Inversiones","Cuántas parejas están desordenadas.","Además de las reglas clásicas, un número fuera de la cuadrícula es el número de inversiones de esa fila/columna vista desde ese extremo: cuántas parejas de dígitos (no necesariamente adyacentes) tienen el primero mayor que el segundo."],["Inversões","Quantos pares estão fora de ordem.","Além das regras clássicas, um número fora da grelha é o número de inversões dessa linha/coluna vista a partir dessa extremidade: quantos pares de algarismos (não necessariamente adjacentes) têm o primeiro maior do que o segundo."],["Inversionen","Wie viele Paare in falscher Reihenfolge stehen.","Zusätzlich zu den klassischen Regeln ist eine Zahl außerhalb des Gitters die Zahl der Inversionen dieser Zeile/Spalte, von diesem Ende aus gesehen: wie viele Paare von Ziffern (nicht notwendigerweise benachbart) die frühere größer als die spätere haben."],["Inverziók","Hány pár van rossz sorrendben.","A klasszikus szabályokon túl a rácson kívüli szám az adott sor/oszlop inverzióinak száma az adott végről nézve: hány számjegypárnál (nem feltétlenül szomszédosnál) nagyobb a korábbi a későbbinél."]],"cycles":[["Cycles","Combien de cycles a la permutation.","En plus des règles classiques, une ligne/colonne lue depuis cette extrémité est une permutation (la position i contient le chiffre a_i). L’indice à l’extérieur est le nombre de cycles de la permutation (la position i pointe vers la position a_i). Tailles 9×9 et 6×6."],["Cicli","Quanti cicli ha la permutazione.","Oltre alle regole classiche, una riga/colonna letta da quell’estremità è una permutazione (la posizione i contiene la cifra a_i). L’indizio fuori è il numero di cicli della permutazione (la posizione i punta alla posizione a_i). Dimensioni 9×9 e 6×6."],["Ciclos","Cuántos ciclos tiene la permutación.","Además de las reglas clásicas, una fila/columna leída desde ese extremo es una permutación (la posición i contiene el dígito a_i). La pista exterior es el número de ciclos de la permutación (la posición i apunta a la posición a_i). Tamaños 9×9 y 6×6."],["Ciclos","Quantos ciclos tem a permutação.","Além das regras clássicas, uma linha/coluna lida a partir dessa extremidade é uma permutação (a posição i contém o algarismo a_i). A pista exterior é o número de ciclos da permutação (a posição i aponta para a posição a_i). Tamanhos 9×9 e 6×6."],["Zyklen","Wie viele Zyklen die Permutation hat.","Zusätzlich zu den klassischen Regeln ist eine von diesem Ende aus gelesene Zeile/Spalte eine Permutation (Position i enthält die Ziffer a_i). Der Hinweis außen ist die Zahl der Zyklen der Permutation (Position i zeigt auf Position a_i). Größen 9×9 und 6×6."],["Ciklusok","Hány ciklusa van a permutációnak.","A klasszikus szabályokon túl az adott végről olvasott sor/oszlop permutáció (az i. pozícióban az a_i számjegy áll). A kívül álló támpont a permutáció ciklusainak száma (az i. pozíció az a_i pozícióra mutat). Méretek: 9×9 és 6×6."]],"fixedpts":[["Points fixes","Combien de chiffres sont à leur propre position.","En plus des règles classiques, un nombre à l’extérieur de la grille indique combien de chiffres se trouvent à la position égale à leur valeur (la deuxième case contient un 2, etc.), comptée à partir de cette extrémité. Tailles 9×9 et 6×6."],["Punti fissi","Quante cifre stanno nella propria posizione.","Oltre alle regole classiche, un numero fuori dalla griglia indica quante cifre stanno nella posizione uguale al loro valore (la seconda cella contiene un 2 ecc.), contata da quell’estremità. Dimensioni 9×9 e 6×6."],["Puntos fijos","Cuántos dígitos están en su propia posición.","Además de las reglas clásicas, un número fuera de la cuadrícula indica cuántos dígitos están en la posición igual a su valor (la segunda celda contiene un 2, etc.), contada desde ese extremo. Tamaños 9×9 y 6×6."],["Pontos fixos","Quantos algarismos estão na sua própria posição.","Além das regras clássicas, um número fora da grelha indica quantos algarismos estão na posição igual ao seu valor (a segunda célula contém um 2, etc.), contada a partir dessa extremidade. Tamanhos 9×9 e 6×6."],["Fixpunkte","Wie viele Ziffern an ihrer eigenen Position stehen.","Zusätzlich zu den klassischen Regeln gibt eine Zahl außerhalb des Gitters an, wie viele Ziffern an der Position stehen, die ihrem Wert entspricht (das zweite Feld enthält eine 2 usw.), von diesem Ende aus gezählt. Größen 9×9 und 6×6."],["Fixpontok","Hány számjegy áll a saját pozícióján.","A klasszikus szabályokon túl a rácson kívüli szám megmondja, hány számjegy áll az értékével egyenlő pozíción (a második cellában 2-es van stb.), az adott végtől számolva. Méretek: 9×9 és 6×6."]],"altsum":[["Somme alternée","a₁ − a₂ + a₃ − …","En plus des règles classiques, un nombre à l’extérieur de la grille est la somme alternée des chiffres vus depuis cette extrémité : premier chiffre moins deuxième plus troisième, et ainsi de suite. Elle peut être négative. Tailles 9×9 et 6×6."],["Somma alternata","a₁ − a₂ + a₃ − …","Oltre alle regole classiche, un numero fuori dalla griglia è la somma alternata delle cifre viste da quell’estremità: prima cifra meno seconda più terza e così via. Può essere negativa. Dimensioni 9×9 e 6×6."],["Suma alterna","a₁ − a₂ + a₃ − …","Además de las reglas clásicas, un número fuera de la cuadrícula es la suma alternada de los dígitos vistos desde ese extremo: primer dígito menos segundo más tercero y así sucesivamente. Puede ser negativa. Tamaños 9×9 y 6×6."],["Soma alternada","a₁ − a₂ + a₃ − …","Além das regras clássicas, um número fora da grelha é a soma alternada dos algarismos vistos a partir dessa extremidade: primeiro algarismo menos segundo mais terceiro e assim por diante. Pode ser negativa. Tamanhos 9×9 e 6×6."],["Alternierende Summe","a₁ − a₂ + a₃ − …","Zusätzlich zu den klassischen Regeln ist eine Zahl außerhalb des Gitters die alternierende Summe der von diesem Ende aus gesehenen Ziffern: erste Ziffer minus zweite plus dritte und so weiter. Sie kann negativ sein. Größen 9×9 und 6×6."],["Váltakozó összeg","a₁ − a₂ + a₃ − …","A klasszikus szabályokon túl a rácson kívüli szám az adott végről látott számjegyek váltakozó összege: az első számjegy mínusz a második plusz a harmadik és így tovább. Lehet negatív. Méretek: 9×9 és 6×6."]],"dxsum":[["Sommes X diagonales","Les d premières cases d’une diagonale, d = son premier chiffre.","En plus des règles classiques, un indice à l’extrémité d’une diagonale (partant d’une case du bord) donne la somme des d premières cases de cette diagonale, où d est son premier chiffre ; si la diagonale compte moins de d cases, toute la diagonale est additionnée (comme les X-Sums, mais sur des diagonales). Tailles 9×9 et 6×6."],["Somme X diagonali","Le prime d celle di una diagonale, d = la sua prima cifra.","Oltre alle regole classiche, un indizio all’estremità di una diagonale (che parte da una cella del bordo) dà la somma delle prime d celle di quella diagonale, dove d è la sua prima cifra; se la diagonale ha meno di d celle, si somma l’intera diagonale (come le X-Sums, ma sulle diagonali). Dimensioni 9×9 e 6×6."],["Sumas X diagonales","Las d primeras celdas de una diagonal, d = su primer dígito.","Además de las reglas clásicas, una pista al final de una diagonal (que parte de una celda del borde) da la suma de las d primeras celdas de esa diagonal, donde d es su primer dígito; si la diagonal tiene menos de d celdas, se suma toda la diagonal (como las X-Sums, pero en diagonales). Tamaños 9×9 y 6×6."],["Somas X diagonais","As primeiras d células de uma diagonal, d = o seu primeiro algarismo.","Além das regras cláss
