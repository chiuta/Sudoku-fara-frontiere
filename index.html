icas, uma pista na extremidade de uma diagonal (a partir de uma célula da margem) dá a soma das primeiras d células dessa diagonal, em que d é o seu primeiro algarismo; se a diagonal tiver menos de d células, soma-se a diagonal toda (como as X-Sums, mas em diagonais). Tamanhos 9×9 e 6×6."],["Diagonale X-Summen","Die ersten d Felder einer Diagonale, d = ihre erste Ziffer.","Zusätzlich zu den klassischen Regeln gibt ein Hinweis am Ende einer Diagonale (die an einem Randfeld beginnt) die Summe der ersten d Felder dieser Diagonale an, wobei d ihre erste Ziffer ist; hat die Diagonale weniger als d Felder, wird die ganze Diagonale summiert (wie X-Sums, aber auf Diagonalen). Größen 9×9 und 6×6."],["Átlós X-összegek","Egy átló első d cellája, d = az első számjegye.","A klasszikus szabályokon túl egy átló végén (peremcellából induló) lévő támpont az átló első d cellájának összegét adja meg, ahol d az átló első számjegye; ha az átlónak d-nél kevesebb cellája van, az egész átlót összeadjuk (mint az X-Sums, de átlókon). Méretek: 9×9 és 6×6."]],"relief":[["Relief","Combien de voisins sont plus petits.","En plus des règles classiques, un nombre dans une case marquée indique combien de ses quatre voisins orthogonaux contiennent un chiffre plus petit que celui de cette case. Le chiffre de la case elle-même reste à trouver."],["Rilievo","Quanti vicini sono più piccoli.","Oltre alle regole classiche, un numero in una cella segnata mostra quanti dei suoi quattro vicini ortogonali contengono una cifra più piccola di quella della cella. La cifra della cella stessa va ancora trovata."],["Relieve","Cuántos vecinos son menores.","Además de las reglas clásicas, un número en una celda marcada muestra cuántos de sus cuatro vecinos ortogonales contienen un dígito menor que el de esa celda. El dígito de la propia celda aún hay que encontrarlo."],["Relevo","Quantos vizinhos são menores.","Além das regras clássicas, um número numa célula marcada mostra quantos dos seus quatro vizinhos ortogonais contêm um algarismo menor do que o dessa célula. O algarismo da própria célula ainda tem de ser encontrado."],["Relief","Wie viele Nachbarn kleiner sind.","Zusätzlich zu den klassischen Regeln zeigt eine Zahl in einem markierten Feld, wie viele seiner vier orthogonalen Nachbarn eine kleinere Ziffer enthalten als dieses Feld. Die Ziffer des Feldes selbst muss noch gefunden werden."],["Dombormű","Hány szomszéd kisebb.","A klasszikus szabályokon túl a jelölt cellában lévő szám megmutatja, hogy négy ortogonális szomszédja közül hányban van a cella számjegyénél kisebb számjegy. A cella saját számjegyét még meg kell találni."]],"oddsweeper":[["Démineur impair","Combien des 8 voisins sont impairs.","En plus des règles classiques, un nombre dans une case marquée indique combien de ses huit voisins (diagonales comprises) contiennent des chiffres impairs, comme au démineur. Le chiffre de la case elle-même reste à trouver."],["Campo minato dispari","Quanti degli 8 vicini sono dispari.","Oltre alle regole classiche, un numero in una cella segnata mostra quanti dei suoi otto vicini (diagonali comprese) contengono cifre dispari, come nel campo minato. La cifra della cella stessa va ancora trovata."],["Buscaminas impar","Cuántos de los 8 vecinos son impares.","Además de las reglas clásicas, un número en una celda marcada muestra cuántos de sus ocho vecinos (diagonales incluidas) contienen dígitos impares, como en el buscaminas. El dígito de la propia celda aún hay que encontrarlo."],["Campo minado ímpar","Quantos dos 8 vizinhos são ímpares.","Além das regras clássicas, um número numa célula marcada mostra quantos dos seus oito vizinhos (diagonais incluídas) contêm algarismos ímpares, como no campo minado. O algarismo da própria célula ainda tem de ser encontrado."],["Ungerade Minensucher","Wie viele der 8 Nachbarn ungerade sind.","Zusätzlich zu den klassischen Regeln zeigt eine Zahl in einem markierten Feld, wie viele seiner acht Nachbarn (Diagonalen eingeschlossen) ungerade Ziffern enthalten, wie beim Minesweeper. Die Ziffer des Feldes selbst muss noch gefunden werden."],["Páratlan aknakereső","A 8 szomszéd közül hány páratlan.","A klasszikus szabályokon túl a jelölt cellában lévő szám megmutatja, hogy nyolc szomszédja (az átlósakat is beleértve) közül hány tartalmaz páratlan számjegyet, mint az aknakeresőben. A cella saját számjegyét még meg kell találni."]],"compass":[["Boussole","La flèche pointe vers le plus grand voisin.","En plus des règles classiques, une flèche dans une case marquée pointe vers le plus grand de ses huit voisins (strictement plus grand que tous les autres voisins). Le chiffre de la case elle-même n’est pas comparé ; au bord, seuls les voisins existants comptent."],["Bussola","La freccia punta al vicino più grande.","Oltre alle regole classiche, una freccia in una cella segnata punta al più grande dei suoi otto vicini (strettamente maggiore di tutti gli altri vicini). La cifra della cella stessa non viene confrontata; sul bordo contano solo i vicini esistenti."],["Brújula","La flecha apunta al vecino mayor.","Además de las reglas clásicas, una flecha en una celda marcada apunta al mayor de sus ocho vecinos (estrictamente mayor que todos los demás vecinos). El dígito de la propia celda no se compara; en el borde solo cuentan los vecinos existentes."],["Bússola","A seta aponta para o maior vizinho.","Além das regras clássicas, uma seta numa célula marcada aponta para o maior dos seus oito vizinhos (estritamente maior do que todos os outros vizinhos). O algarismo da própria célula não é comparado; na margem só contam os vizinhos existentes."],["Kompass","Der Pfeil zeigt auf den größten Nachbarn.","Zusätzlich zu den klassischen Regeln zeigt ein Pfeil in einem markierten Feld auf den größten seiner acht Nachbarn (echt größer als alle anderen Nachbarn). Die Ziffer des Feldes selbst wird nicht verglichen; am Rand zählen nur vorhandene Nachbarn."],["Iránytű","A nyíl a legnagyobb szomszédra mutat.","A klasszikus szabályokon túl a jelölt cellában lévő nyíl nyolc szomszédja közül a legnagyobbra mutat (szigorúan nagyobb az összes többi szomszédnál). A cella saját számjegyét nem hasonlítjuk össze; a szélen csak a létező szomszédok számítanak."]],"quadsum":[["Somme de quadruplet","Somme d’un bloc 2×2.","En plus des règles classiques, un nombre à la jonction de quatre cases est la somme de ces quatre chiffres (les chiffres peuvent se répéter, car le bloc peut toucher deux ou quatre blocs)."],["Somma di quadruplo","Somma di un blocco 2×2.","Oltre alle regole classiche, un numero all’incrocio di quattro celle è la somma di quelle quattro cifre (le cifre possono ripetersi, perché il blocco può toccare due o quattro riquadri)."],["Suma de cuádruple","Suma de un bloque 2×2.","Además de las reglas clásicas, un número en la unión de cuatro celdas es la suma de esos cuatro dígitos (los dígitos pueden repetirse, porque el bloque puede tocar dos o cuatro cajas)."],["Soma de quádruplo","Soma de um bloco 2×2.","Além das regras clássicas, um número na junção de quatro células é a soma desses quatro algarismos (os algarismos podem repetir-se, porque o bloco pode tocar duas ou quatro caixas)."],["Quadrupelsumme","Summe eines 2×2-Blocks.","Zusätzlich zu den klassischen Regeln ist eine Zahl an der Kreuzung von vier Feldern die Summe dieser vier Ziffern (Ziffern dürfen sich wiederholen, weil der Block zwei oder vier Blöcke berühren kann)."],["Négyesösszeg","Egy 2×2-es blokk összege.","A klasszikus szabályokon túl négy cella találkozásánál lévő szám e négy számjegy összege (a számjegyek ismétlődhetnek, mert a blokk két vagy négy blokkot is érinthet)."]],"stone":[["Pierre 2×2","Quatre chiffres différents dans un bloc.","En plus des règles classiques, dans chaque bloc 2×2 marqué d’un carré les quatre chiffres sont tous différents. Les marques n’apparaissent que sur des blocs touchant au moins deux blocs ; un bloc non marqué peut avoir ou non des chiffres différents."],["Pietra 2×2","Quattro cifre diverse in un blocco.","Oltre alle regole classiche, in ogni blocco 2×2 segnato con un quadrato le quattro cifre sono tutte diverse. I segni compaiono solo su blocchi che toccano almeno due riquadri; un blocco non segnato può avere o meno cifre diverse."],["Piedra 2×2","Cuatro dígitos distintos en un bloque.","Además de las reglas clásicas, en cada bloque 2×2 marcado con un cuadrado los cuatro dígitos son todos distintos. Las marcas aparecen solo en bloques que tocan al menos dos cajas; un bloque sin marcar puede tener o no dígitos distintos."],["Pedra 2×2","Quatro algarismos diferentes num bloco.","Além das regras clássicas, em cada bloco 2×2 marcado com um quadrado os quatro algarismos são todos diferentes. As marcas só aparecem em blocos que tocam pelo menos duas caixas; um bloco sem marca pode ou não ter algarismos diferentes."],["Stein 2×2","Vier verschiedene Ziffern in einem Block.","Zusätzlich zu den klassischen Regeln sind in jedem mit einem Quadrat markierten 2×2-Block die vier Ziffern alle verschieden. Markierungen erscheinen nur bei Blöcken, die mindestens zwei Blöcke berühren; ein unmarkierter Block kann verschiedene Ziffern haben oder nicht."],["Kő 2×2","Négy különböző számjegy egy blokkban.","A klasszikus szabályokon túl minden négyzettel jelölt 2×2-es blokkban a négy számjegy mind különböző. A jelek csak olyan blokkoknál jelennek meg, amelyek legalább két blokkot érintenek; egy jelöletlen blokkban lehetnek különböző számjegyek, de nem kötelező."]],"domino":[["Domino","Une tuile de deux cases montrant ses chiffres.","En plus des règles classiques, une tuile de domino couvre deux cases voisines et indique quels deux chiffres elles contiennent (dans un ordre quelconque). La définition retenue ici est la plus simple ; les sources diffèrent."],["Domino","Una tessera di due celle che mostra le sue cifre.","Oltre alle regole classiche, una tessera di domino copre due celle vicine e mostra quali due cifre contengono (in qualsiasi ordine). La definizione scelta qui è la più semplice; le fonti differiscono."],["Dominó","Una ficha de dos celdas que muestra sus dígitos.","Además de las reglas clásicas, una ficha de dominó cubre dos celdas vecinas y muestra qué dos dígitos contienen (en cualquier orden). La definición elegida aquí es la más sencilla; las fuentes difieren."],["Dominó","Uma peça de duas células que mostra os seus algarismos.","Além das regras clássicas, uma peça de dominó cobre duas células vizinhas e mostra que dois algarismos contêm (por qualquer ordem). A definição escolhida aqui é a mais simples; as fontes diferem."],["Domino","Ein Zweifelder-Stein, der seine Ziffern zeigt.","Zusätzlich zu den klassischen Regeln bedeckt ein Dominostein zwei benachbarte Felder und zeigt, welche zwei Ziffern sie enthalten (in beliebiger Reihenfolge). Die hier gewählte Definition ist die einfachste; die Quellen weichen voneinander ab."],["Dominó","Kétcellás csempe, amely mutatja a számjegyeit.","A klasszikus szabályokon túl egy dominócsempe két szomszédos cellát fed le, és megmutatja, mely két számjegyet tartalmazzák (tetszőleges sorrendben). Az itt választott meghatározás a legegyszerűbb; a források eltérnek."]],"pillsq":[["Pilule carré parfait","Les deux chiffres lus forment un carré parfait.","En plus des règles classiques, une pilule couvre deux cases voisines ; le nombre à deux chiffres lu dans le sens de la flèche est un carré parfait (16, 25, 36, 49, 64 ou 81). 9×9 uniquement."],["Pillola quadrato perfetto","Le due cifre lette formano un quadrato perfetto.","Oltre alle regole classiche, una pillola copre due celle vicine; il numero a due cifre letto nella direzione della freccia è un quadrato perfetto (16, 25, 36, 49, 64 o 81). Solo 9×9."],["Píldora de cuadrado perfecto","Los dos dígitos leídos forman un cuadrado perfecto.","Además de las reglas clásicas, una píldora cubre dos celdas vecinas; el número de dos cifras leído en el sentido de la flecha es un cuadrado perfecto (16, 25, 36, 49, 64 u 81). Solo 9×9."],["Pílula de quadrado perfeito","Os dois algarismos lidos formam um quadrado perfeito.","Além das regras clássicas, uma pílula cobre duas células vizinhas; o número de dois algarismos lido no sentido da seta é um quadrado perfeito (16, 25, 36, 49, 64 ou 81). Só 9×9."],["Pille mit Quadratzahl","Die zwei gelesenen Ziffern bilden eine Quadratzahl.","Zusätzlich zu den klassischen Regeln bedeckt eine Pille zwei benachbarte Felder; die in Pfeilrichtung gelesene zweistellige Zahl ist eine Quadratzahl (16, 25, 36, 49, 64 oder 81). Nur 9×9."],["Négyzetszám-pirula","A két leolvasott számjegy négyzetszámot alkot.","A klasszikus szabályokon túl egy pirula két szomszédos cellát fed le; a nyíl irányában olvasott kétjegyű szám négyzetszám (16, 25, 36, 49, 64 vagy 81). Csak 9×9."]],"primecage":[["Cage première","Chiffres distincts dont la somme est première.","En plus des règles classiques, les chiffres de chaque cage en pointillés sont différents et leur somme est un nombre premier (la somme n’est pas affichée ; les cages sont marquées P)."],["Gabbia prima","Cifre distinte la cui somma è un numero primo.","Oltre alle regole classiche, le cifre di ogni gabbia tratteggiata sono diverse e la loro somma è un numero primo (la somma non è indicata; le gabbie sono segnate con P)."],["Jaula prima","Dígitos distintos cuya suma es un número primo.","Además de las reglas clásicas, los dígitos de cada jaula punteada son distintos y su suma es un número primo (la suma no se muestra; las jaulas se marcan con P)."],["Gaiola prima","Algarismos distintos cuja soma é um número primo.","Além das regras clássicas, os algarismos de cada gaiola tracejada são diferentes e a sua soma é um número primo (a soma não é mostrada; as gaiolas são marcadas com P)."],["Primzahlkäfig","Verschiedene Ziffern, deren Summe eine Primzahl ist.","Zusätzlich zu den klassischen Regeln sind die Ziffern in jedem gestrichelten Käfig verschieden, und ihre Summe ist eine Primzahl (die Summe wird nicht angezeigt; Käfige sind mit P markiert)."],["Prím ketrec","Különböző számjegyek, amelyek összege prím.","A klasszikus szabályokon túl minden szaggatott ketrecben a számjegyek különbözők, és összegük prímszám (az összeg nincs kiírva; a ketrecek P betűvel vannak jelölve)."]],"balcage":[["Cage équilibrée","La somme est égale au produit.","En plus des règles classiques, dans chaque cage marquée Σ=Π la somme des chiffres est égale à leur produit (les chiffres peuvent se répéter ; par exemple 1+2+3 = 1·2·3)."],["Gabbia bilanciata","La somma è uguale al prodotto.","Oltre alle regole classiche, in ogni gabbia segnata con Σ=Π la somma delle cifre è uguale al loro prodotto (le cifre possono ripetersi; per esempio 1+2+3 = 1·2·3)."],["Jaula equilibrada","La suma es igual al producto.","Además de las reglas clásicas, en cada jaula marcada con Σ=Π la suma de los dígitos es igual a su producto (los dígitos pueden repetirse; por ejemplo, 1+2+3 = 1·2·3)."],["Gaiola equilibrada","A soma é igual ao produto.","Além das regras clássicas, em cada gaiola marcada com Σ=Π a soma dos algarismos é igual ao seu produto (os algarismos podem repetir-se; por exemplo, 1+2+3 = 1·2·3)."],["Ausgeglichener Käfig","Summe gleich Produkt.","Zusätzlich zu den klassischen Regeln ist in jedem mit Σ=Π markierten Käfig die Summe der Ziffern gleich ihrem Produkt (Ziffern dürfen sich wiederholen; zum Beispiel 1+2+3 = 1·2·3)."],["Kiegyensúlyozott ketrec","Az összeg egyenlő a szorzattal.","A klasszikus szabályokon túl minden Σ=Π jelölésű ketrecben a számjegyek összege egyenlő a szorzatukkal (a számjegyek ismétlődhetnek; például 1+2+3 = 1·2·3)."]],"doubler":[["Doubleurs","Killer où certaines cases comptent double.","Comme au Killer (chiffres différents dans une cage, somme donnée), mais une case marquée ×2 dans la cage est additionnée deux fois."],["Raddoppiatori","Killer in cui alcune celle contano il doppio.","Come nel Killer (cifre diverse in una gabbia, somma data), ma una cella segnata ×2 nella gabbia viene sommata due volte."],["Duplicadores","Killer donde algunas celdas cuentan el doble.","Como en el Killer (dígitos distintos en una jaula, suma dada), pero una celda marcada ×2 en la jaula se suma dos veces."],["Duplicadores","Killer em que algumas células contam o dobro.","Como no Killer (algarismos diferentes numa gaiola, soma dada), mas uma célula marcada ×2 na gaiola é somada duas vezes."],["Verdoppler","Killer, bei dem manche Felder doppelt zählen.","Wie beim Killer (verschiedene Ziffern in einem Käfig, gegebene Summe), aber ein im Käfig mit ×2 markiertes Feld wird zweimal addiert."],["Duplázók","Killer, ahol néhány cella kétszer számít.","Mint a Killernél (különböző számjegyek egy ketrecben, megadott összeg), de a ketrecben ×2-vel jelölt cella kétszer adódik hozzá."]],"clonemir":[["Clone miroir","Deux formes identiques, la seconde en miroir.","En plus des règles classiques, deux zones colorées ont la même forme, la seconde retournée gauche–droite ; les cases correspondantes contiennent le même chiffre."],["Clone speculare","Due forme uguali, la seconda speculare.","Oltre alle regole classiche, due aree colorate hanno la stessa forma, la seconda ribaltata sinistra–destra; le celle corrispondenti contengono la stessa cifra."],["Clon espejo","Dos formas iguales, la segunda en espejo.","Además de las reglas clásicas, dos zonas coloreadas tienen la misma forma, la segunda invertida izquierda–derecha; las celdas correspondientes contienen el mismo dígito."],["Clone espelhado","Duas formas iguais, a segunda em espelho.","Além das regras clássicas, duas zonas coloridas têm a mesma forma, a segunda invertida esquerda–direita; as células correspondentes contêm o mesmo algarismo."],["Spiegelklon","Zwei gleiche Formen, die zweite gespiegelt.","Zusätzlich zu den klassischen Regeln haben zwei farbige Bereiche dieselbe Form, der zweite links–rechts gespiegelt; entsprechende Felder enthalten dieselbe Ziffer."],["Tükörklón","Két azonos alakzat, a második tükrözve.","A klasszikus szabályokon túl két színezett terület alakja azonos, a második balra–jobbra tükrözve; a megfelelő cellák ugyanazt a számjegyet tartalmazzák."]],"diff":[["Différence","Le nombre entre les cases est leur différence.","En plus des règles classiques, un nombre entre deux cases voisines est la différence absolue de leurs chiffres. Un nombre absent ne dit rien."],["Differenza","Il numero tra le celle è la loro differenza.","Oltre alle regole classiche, un numero tra due celle vicine è la differenza assoluta delle loro cifre. Un numero mancante non dice nulla."],["Diferencia","El número entre celdas es su diferencia.","Además de las reglas clásicas, un número entre dos celdas vecinas es la diferencia absoluta de sus dígitos. Un número ausente no dice nada."],["Diferença","O número entre células é a sua diferença.","Além das regras clássicas, um número entre duas células vizinhas é a diferença absoluta dos seus algarismos. Um número em falta não diz nada."],["Differenz","Die Zahl zwischen den Feldern ist ihre Differenz.","Zusätzlich zu den klassischen Regeln ist eine Zahl zwischen zwei benachbarten Feldern die absolute Differenz ihrer Ziffern. Eine fehlende Zahl sagt nichts."],["Különbség","A cellák közti szám a különbségük.","A klasszikus szabályokon túl két szomszédos cella közti szám a számjegyeik abszolút különbsége. A hiányzó szám nem mond semmit."]],"kropkipos":[["Kropki marqués seulement","Points donnés ; l’absence de point ne dit rien.","Comme au Kropki (blanc = consécutifs, noir = double), mais l’absence de point ne signifie rien : une relation non marquée peut exister."],["Solo Kropki indicati","Punti dati; l’assenza di punto non dice nulla.","Come nel Kropki (bianco = consecutive, nero = doppio), ma l’assenza di un punto non significa nulla: una relazione non segnata può esistere."],["Solo Kropki marcados","Puntos dados; la ausencia de punto no dice nada.","Como en el Kropki (blanco = consecutivos, negro = doble), pero la ausencia de un punto no significa nada: puede existir una relación sin marcar."],["Só Kropki marcados","Pontos dados; a ausência de ponto não diz nada.","Como no Kropki (branco = consecutivos, preto = dobro), mas a ausência de um ponto não significa nada: pode existir uma relação não marcada."],["Nur markierte Kropki","Punkte gegeben; ein fehlender Punkt sagt nichts.","Wie bei Kropki (weiß = aufeinanderfolgend, schwarz = doppelt), aber das Fehlen eines Punktes bedeutet nichts: Eine nicht markierte Beziehung kann bestehen."],["Csak jelölt Kropki","Pontok megadva; a pont hiánya nem mond semmit.","Mint a Kropkinál (fehér = egymást követő, fekete = dupla), de a pont hiánya nem jelent semmit: jelöletlen kapcsolat is fennállhat."]],"xvpos":[["XV marqués seulement","Signes donnés ; l’absence de signe ne dit rien.","Comme au XV (X = somme 10, V = somme 5), mais l’absence de signe ne signifie rien. 9×9 uniquement."],["Solo XV indicati","Segni dati; l’assenza di segno non dice nulla.","Come nell’XV (X = somma 10, V = somma 5), ma l’assenza di un segno non significa nulla. Solo 9×9."],["Solo XV marcados","Signos dados; la ausencia de signo no dice nada.","Como en el XV (X = suma 10, V = suma 5), pero la ausencia de un signo no significa nada. Solo 9×9."],["Só XV marcados","Sinais dados; a ausência de sinal não diz nada.","Como no XV (X = soma 10, V = soma 5), mas a ausência de um sinal não significa nada. Só 9×9."],["Nur markierte XV","Zeichen gegeben; ein fehlendes Zeichen sagt nichts.","Wie bei XV (X = Summe 10, V = Summe 5), aber das Fehlen eines Zeichens bedeutet nichts. Nur 9×9."],["Csak jelölt XV","Jelek megadva; a jel hiánya nem mond semmit.","Mint az XV-nél (X = összeg 10, V = összeg 5), de a jel hiánya nem jelent semmit. Csak 9×9."]],"consecpos":[["Consécutifs marqués seulement","Barres données ; l’absence de barre ne dit rien.","Comme au Consécutif (barre = chiffres consécutifs), mais l’absence de barre ne signifie rien."],["Solo consecutivi indicati","Barre date; l’assenza di barra non dice nulla.","Come nel Consecutivo (barra = cifre consecutive), ma l’assenza di una barra non significa nulla."],["Solo consecutivos marcados","Barras dadas; la ausencia de barra no dice nada.","Como en el Consecutivo (barra = dígitos consecutivos), pero la ausencia de una barra no significa nada."],["Só consecutivos marcados","Barras dadas; a ausência de barra não diz nada.","Como no Consecutivo (barra = algarismos consecutivos), mas a ausência de uma barra não significa nada."],["Nur markierte Nachbarzahlen","Balken gegeben; ein fehlender Balken sagt nichts.","Wie bei Aufeinanderfolgend (Balken = aufeinanderfolgende Ziffern), aber das Fehlen eines Balkens bedeutet nichts."],["Csak jelölt egymást követők","Rudak megadva; a rúd hiánya nem mond semmit.","Mint az Egymást követőnél (rúd = egymást követő számjegyek), de a rúd hiánya nem jelent semmit."]],"clueless":[["Sans indice","Seulement des points Kropki ; en général aucun chiffre donné.","La grille n’a en général aucun chiffre donné (rarement un seul, quand les points seuls ne fixent pas la solution) ; toute l’information vient des points Kropki (blanc = consécutifs, noir = double, pas de point = ni l’un ni l’autre). Le niveau de difficulté n’a aucun effet."],["Senza indizi","Solo punti Kropki; di solito nessuna cifra data.","La griglia di solito non ha cifre date (raramente una sola, quando i soli punti non fissano la soluzione); tutte le altre informazioni vengono dai punti Kropki (bianco = consecutive, nero = doppio, nessun punto = né l’uno né l’altro). Il livello di difficoltà non ha effetto."],["Sin pistas","Solo puntos Kropki; normalmente sin dígitos dados.","La cuadrícula normalmente no tiene dígitos dados (rara vez uno solo, cuando los puntos por sí solos no fijan la solución); toda la demás información procede de los puntos Kropki (blanco = consecutivos, negro = doble, sin punto = ninguna de las dos cosas). El nivel de dificultad no tiene efecto."],["Sem pistas","Só pontos Kropki; normalmente sem algarismos dados.","A grelha normalmente não tem algarismos dados (raramente um só, quando os pontos por si sós não fixam a solução); toda a restante informação vem dos pontos Kropki (branco = consecutivos, preto = dobro, sem ponto = nenhuma das duas coisas). O nível de dificuldade não tem efeito."],["Ohne Hinweise","Nur Kropki-Punkte; meist keine vorgegebenen Ziffern.","Das Gitter hat meist keine vorgegebenen Ziffern (selten eine einzige, wenn die Punkte allein die Lösung nicht festlegen); alle weiteren Informationen stammen von den Kropki-Punkten (weiß = aufeinanderfolgend, schwarz = doppelt, kein Punkt = keins von beidem). Der Schwierigkeitsgrad hat keine Wirkung."],["Támpont nélkül","Csak Kropki-pontok; általában nincs adott számjegy.","A rácson általában nincs adott számjegy (ritkán egyetlen, ha a pontok önmagukban nem határozzák meg a megoldást); minden más információ a Kropki-pontokból származik (fehér = egymást követő, fekete = dupla, nincs pont = egyik sem). A nehézségi szintnek nincs hatása."]],"legato":[["Legato","Les chiffres voisins diffèrent d’au plus 2.","En plus des règles classiques, sur une ligne legato deux chiffres voisins diffèrent d’au plus 2 (et sont différents s’ils partagent une ligne, une colonne ou un bloc). La ligne peut aussi passer en diagonale ; deux cases consécutives ne peuvent contenir le même chiffre que si elles ne partagent ni ligne, ni colonne, ni bloc."],["Legato","Le cifre vicine differiscono di al massimo 2.","Oltre alle regole classiche, su una linea legato due cifre vicine differiscono di al massimo 2 (e sono diverse se condividono una riga, una colonna o un riquadro). La linea può passare anche in diagonale; due celle consecutive possono contenere la stessa cifra solo se non condividono riga, colonna né riquadro."],["Legato","Los dígitos vecinos difieren como máximo en 2.","Además de las reglas clásicas, en una línea legato dos dígitos vecinos difieren como máximo en 2 (y son distintos si comparten fila, columna o caja). La línea también puede ir en diagonal; dos celdas consecutivas solo pueden contener el mismo dígito si no comparten fila, columna ni caja."],["Legato","Os algarismos vizinhos diferem no máximo em 2.","Além das regras clássicas, numa linha legato dois algarismos vizinhos diferem no máximo em 2 (e são diferentes se partilharem linha, coluna ou caixa). A linha também pode seguir na diagonal; duas células consecutivas só podem conter o mesmo algarismo se não partilharem linha, coluna nem caixa."],["Legato","Benachbarte Ziffern unterscheiden sich um höchstens 2.","Zusätzlich zu den klassischen Regeln unterscheiden sich auf einer Legato-Linie zwei benachbarte Ziffern um höchstens 2 (und sind verschieden, wenn sie eine Zeile, Spalte oder einen Block teilen). Die Linie darf auch diagonal verlaufen; zwei aufeinanderfolgende Felder dürfen nur dann dieselbe Ziffer enthalten, wenn sie keine Zeile, Spalte und keinen Block teilen."],["Legato","A szomszédos számjegyek legfeljebb 2-vel különböznek.","A klasszikus szabályokon túl egy legato vonalon két szomszédos számjegy legfeljebb 2-vel különbözik (és különböznek, ha közös soruk, oszlopuk vagy blokkjuk van). A vonal haladhat átlósan is; két egymást követő cella csak akkor tartalmazhatja ugyanazt a számjegyet, ha nincs közös soruk, oszlopuk és blokkjuk."]],"consonant":[["Ligne consonante","Les voisins diffèrent de 2, 3 ou 4.","En plus des règles classiques, sur une ligne consonante deux chiffres voisins diffèrent de 2, 3 ou 4 (valeur absolue). La ligne peut aussi passer en diagonale ; deux cases consécutives ne peuvent contenir le même chiffre que si elles ne partagent ni ligne, ni colonne, ni bloc."],["Linea consonante","I vicini differiscono di 2, 3 o 4.","Oltre alle regole classiche, su una linea consonante due cifre vicine differiscono di 2, 3 o 4 (valore assoluto). La linea può passare anche in diagonale; due celle consecutive possono contenere la stessa cifra solo se non condividono riga, colonna né riquadro."],["Línea consonante","Los vecinos difieren en 2, 3 o 4.","Además de las reglas clásicas, en una línea consonante dos dígitos vecinos difieren en 2, 3 o 4 (valor absoluto). La línea también puede ir en diagonal; dos celdas consecutivas solo pueden contener el mismo dígito si no comparten fila, columna ni caja."],["Linha consonante","Os vizinhos diferem em 2, 3 ou 4.","Além das regras clássicas, numa linha consonante dois algarismos vizinhos diferem em 2, 3 ou 4 (valor absoluto). A linha também pode seguir na diagonal; duas células consecutivas só podem conter o mesmo algarismo se não partilharem linha, coluna nem caixa."],["Konsonante Linie","Nachbarn unterscheiden sich um 2, 3 oder 4.","Zusätzlich zu den klassischen Regeln unterscheiden sich auf einer konsonanten Linie zwei benachbarte Ziffern um 2, 3 oder 4 (Betrag). Die Linie darf auch diagonal verlaufen; zwei aufeinanderfolgende Felder dürfen nur dann dieselbe Ziffer enthalten, wenn sie keine Zeile, Spalte und keinen Block teilen."],["Konszonáns vonal","A szomszédok 2-vel, 3-mal vagy 4-gyel különböznek.","A klasszikus szabályokon túl egy konszonáns vonalon két szomszédos számjegy 2-vel, 3-mal vagy 4-gyel különbözik (abszolút értékben). A vonal haladhat átlósan is; két egymást követő cella csak akkor tartalmazhatja ugyanazt a számjegyet, ha nincs közös soruk, oszlopuk és blokkjuk."]],"fixstep":[["Ligne à pas fixe","Les voisins diffèrent d’exactement 3.","En plus des règles classiques, sur une ligne à pas fixe deux chiffres voisins diffèrent d’exactement 3 (valeur absolue). La ligne peut aussi passer en diagonale ; deux cases consécutives ne peuvent contenir le même chiffre que si elles ne partagent ni ligne, ni colonne, ni bloc."],["Linea a passo fisso","I vicini differiscono esattamente di 3.","Oltre alle regole classiche, su una linea a passo fisso due cifre vicine differiscono esattamente di 3 (valore assoluto). La linea può passare anche in diagonale; due celle consecutive possono contenere la stessa cifra solo se non condividono riga, colonna né riquadro."],["Línea de paso fijo","Los vecinos difieren exactamente en 3.","Además de las reglas clásicas, en una línea de paso fijo dos dígitos vecinos difieren exactamente en 3 (valor absoluto). La línea también puede ir en diagonal; dos celdas consecutivas solo pueden contener el mismo dígito si no comparten fila, columna ni caja."],["Linha de passo fixo","Os vizinhos diferem exatamente em 3.","Além das regras clássicas, numa linha de passo fixo dois algarismos vizinhos diferem exatamente em 3 (valor absoluto). A linha também pode seguir na diagonal; duas células consecutivas só podem conter o mesmo algarismo se não partilharem linha, coluna nem caixa."],["Linie mit festem Schritt","Nachbarn unterscheiden sich um genau 3.","Zusätzlich zu den klassischen Regeln unterscheiden sich auf einer Linie mit festem Abstand zwei benachbarte Ziffern um genau 3 (Betrag). Die Linie darf auch diagonal verlaufen; zwei aufeinanderfolgende Felder dürfen nur dann dieselbe Ziffer enthalten, wenn sie keine Zeile, Spalte und keinen Block teilen."],["Fix lépésközű vonal","A szomszédok pontosan 3-mal különböznek.","A klasszikus szabályokon túl egy állandó lépésközű vonalon két szomszédos számjegy pontosan 3-mal különbözik (abszolút értékben). A vonal haladhat átlósan is; két egymást követő cella csak akkor tartalmazhatja ugyanazt a számjegyet, ha nincs közös soruk, oszlopuk és blokkjuk."]],"compline":[["Ligne complémentaire","Les voisins ont pour somme N+1.","En plus des règles classiques, sur une ligne complémentaire deux chiffres voisins ont pour somme N+1 (en 9×9 : 10), de sorte que la ligne alterne entre un chiffre et son complément. La ligne peut aussi passer en diagonale ; deux cases consécutives ne peuvent contenir le même chiffre que si elles ne partagent ni ligne, ni colonne, ni bloc."],["Linea complementare","I vicini sommano N+1.","Oltre alle regole classiche, su una linea complementare due cifre vicine sommano N+1 (nel 9×9: 10), quindi la linea alterna una cifra e il suo complemento. La linea può passare anche in diagonale; due celle consecutive possono contenere la stessa cifra solo se non condividono riga, colonna né riquadro."],["Línea complementaria","Los vecinos suman N+1.","Además de las reglas clásicas, en una línea complementaria dos dígitos vecinos suman N+1 (en 9×9: 10), de modo que la línea alterna entre un dígito y su complemento. La línea también puede ir en diagonal; dos celdas consecutivas solo pueden contener el mismo dígito si no comparten fila, columna ni caja."],["Linha complementar","Os vizinhos somam N+1.","Além das regras clássicas, numa linha complementar dois algarismos vizinhos somam N+1 (em 9×9: 10), pelo que a linha alterna entre um algarismo e o seu complemento. A linha também pode seguir na diagonal; duas células consecutivas só podem conter o mesmo algarismo se não partilharem linha, coluna nem caixa."],["Komplementärlinie","Nachbarn ergeben zusammen N+1.","Zusätzlich zu den klassischen Regeln ergeben auf einer komplementären Linie zwei benachbarte Ziffern zusammen N+1 (bei 9×9: 10); die Linie wechselt also zwischen einer Ziffer und ihrem Komplement. Die Linie darf auch diagonal verlaufen; zwei aufeinanderfolgende Felder dürfen nur dann dieselbe Ziffer enthalten, wenn sie keine Zeile, Spalte und keinen Block teilen."],["Kiegészítő vonal","A szomszédok összege N+1.","A klasszikus szabályokon túl egy kiegészítő vonalon két szomszédos számjegy összege N+1 (9×9-en: 10), így a vonal egy számjegy és a kiegészítője között váltakozik. A vonal haladhat átlósan is; két egymást követő cella csak akkor tartalmazhatja ugyanazt a számjegyet, ha nincs közös soruk, oszlopuk és blokkjuk."]],"zigzag":[["Zigzag","Les chiffres alternent montée et descente.","En plus des règles classiques, sur une ligne en zigzag les chiffres montent et descendent alternativement (chaque chiffre intérieur est soit plus grand, soit plus petit que ses deux voisins). La ligne peut aussi passer en diagonale ; deux cases consécutives ne peuvent contenir le même chiffre que si elles ne partagent ni ligne, ni colonne, ni bloc."],["Zigzag","Le cifre alternano salita e discesa.","Oltre alle regole classiche, su una linea a zigzag le cifre salgono e scendono alternativamente (ogni cifra interna è o maggiore o minore di entrambe le vicine). La linea può passare anche in diagonale; due celle consecutive possono contenere la stessa cifra solo se non condividono riga, colonna né riquadro."],["Zigzag","Los dígitos alternan subida y bajada.","Además de las reglas clásicas, en una línea en zigzag los dígitos suben y bajan alternativamente (cada dígito interior es mayor o menor que sus dos vecinos). La línea también puede ir en diagonal; dos celdas consecutivas solo pueden contener el mismo dígito si no comparten fila, columna ni caja."],["Ziguezague","Os algarismos alternam subida e descida.","Além das regras clássicas, numa linha em ziguezague os algarismos sobem e descem alternadamente (cada algarismo interior é maior ou menor do que os dois vizinhos). A linha também pode seguir na diagonal; duas células consecutivas só podem conter o mesmo algarismo se não partilharem linha, coluna nem caixa."],["Zickzack","Die Ziffern wechseln zwischen Steigen und Fallen.","Zusätzlich zu den klassischen Regeln steigen und fallen die Ziffern auf einer Zickzack-Linie abwechselnd (jede innere Ziffer ist entweder größer oder kleiner als beide Nachbarn). Die Linie darf auch diagonal verlaufen; zwei aufeinanderfolgende Felder dürfen nur dann dieselbe Ziffer enthalten, wenn sie keine Zeile, Spalte und keinen Block teilen."],["Cikkcakk","A számjegyek felváltva emelkednek és csökkennek.","A klasszikus szabályokon túl egy cikcakk vonalon a számjegyek felváltva emelkednek és csökkennek (minden belső számjegy vagy nagyobb, vagy kisebb mindkét szomszédjánál). A vonal haladhat átlósan is; két egymást követő cella csak akkor tartalmazhatja ugyanazt a számjegyet, ha nincs közös soruk, oszlopuk és blokkjuk."]],"fibonacci":[["Ligne de Fibonacci","Chaque chiffre est la somme des deux précédents.","En plus des règles classiques, sur une ligne de Fibonacci (la flèche indique le sens) chaque chiffre après les deux premiers est la somme des deux chiffres précédents. La ligne peut aussi passer en diagonale ; deux cases consécutives ne peuvent contenir le même chiffre que si elles ne partagent ni ligne, ni colonne, ni bloc."],["Linea di Fibonacci","Ogni cifra è la somma delle due precedenti.","Oltre alle regole classiche, su una linea di Fibonacci (la freccia indica il verso) ogni cifra dopo le prime due è la somma delle due cifre precedenti. La linea può passare anche in diagonale; due celle consecutive possono contenere la stessa cifra solo se non condividono riga, colonna né riquadro."],["Línea de Fibonacci","Cada dígito es la suma de los dos anteriores.","Además de las reglas clásicas, en una línea de Fibonacci (la flecha indica el sentido) cada dígito posterior a los dos primeros es la suma de los dos dígitos anteriores. La línea también puede ir en diagonal; dos celdas consecutivas solo pueden contener el mismo dígito si no comparten fila, columna ni caja."],["Linha de Fibonacci","Cada algarismo é a soma dos dois anteriores.","Além das regras clássicas, numa linha de Fibonacci (a seta indica o sentido) cada algarismo depois dos dois primeiros é a soma dos dois algarismos anteriores. A linha também pode seguir na diagonal; duas células consecutivas só podem conter o mesmo algarismo se não partilharem linha, coluna nem caixa."],["Fibonacci-Linie","Jede Ziffer ist die Summe der beiden vorherigen.","Zusätzlich zu den klassischen Regeln ist auf einer Fibonacci-Linie (der Pfeil zeigt die Richtung) jede Ziffer nach den ersten beiden die Summe der beiden vorangehenden Ziffern. Die Linie darf auch diagonal verlaufen; zwei aufeinanderfolgende Felder dürfen nur dann dieselbe Ziffer enthalten, wenn sie keine Zeile, Spalte und keinen Block teilen."],["Fibonacci-vonal","Minden számjegy az előző kettő összege.","A klasszikus szabályokon túl egy Fibonacci-vonalon (a nyíl mutatja az irányt) az első kettő utáni minden számjegy az előző két számjegy összege. A vonal haladhat átlósan is; két egymást követő cella csak akkor tartalmazhatja ugyanazt a számjegyet, ha nincs közös soruk, oszlopuk és blokkjuk."]],"steps":[["Marches","Les différences signées ne cessent de croître.","En plus des règles classiques, sur une ligne à pas croissants (la flèche indique le sens) la différence entre chiffres voisins croît d’un pas à l’autre, en comptant les différences signées (a₃−a₂ > a₂−a₁) : 1-2-4 et 9-5-3 sont permis, 4-3-1 ne l’est pas. La ligne peut aussi passer en diagonale ; deux cases consécutives ne peuvent contenir le même chiffre que si elles ne partagent ni ligne, ni colonne, ni bloc."],["Gradini","Le differenze con segno continuano a crescere.","Oltre alle regole classiche, su una linea a passi crescenti (la freccia indica il verso) la differenza tra cifre vicine cresce da un passo all’altro, contando le differenze con segno (a₃−a₂ > a₂−a₁): 1-2-4 e 9-5-3 sono permessi, 4-3-1 no. La linea può passare anche in diagonale; due celle consecutive possono contenere la stessa cifra solo se non condividono riga, colonna né riquadro."],["Escalones","Las diferencias con signo siguen creciendo.","Además de las reglas clásicas, en una línea de pasos crecientes (la flecha indica el sentido) la diferencia entre dígitos vecinos crece de paso en paso, contando diferencias con signo (a₃−a₂ > a₂−a₁): 1-2-4 y 9-5-3 están permitidos, 4-3-1 no. La línea también puede ir en diagonal; dos celdas consecutivas solo pueden contener el mismo dígito si no comparten fila, columna ni caja."],["Degraus","As diferenças com sinal continuam a crescer.","Além das regras clássicas, numa linha de passos crescentes (a seta indica o sentido) a diferença entre algarismos vizinhos cresce de passo em passo, contando diferenças com sinal (a₃−a₂ > a₂−a₁): 1-2-4 e 9-5-3 são permitidos, 4-3-1 não. A linha também pode seguir na diagonal; duas células consecutivas só podem conter o mesmo algarismo se não partilharem linha, coluna nem caixa."],["Stufen","Die vorzeichenbehafteten Differenzen wachsen weiter.","Zusätzlich zu den klassischen Regeln wächst auf einer Stufenlinie (der Pfeil zeigt die Richtung) die Differenz zwischen benachbarten Ziffern von Schritt zu Schritt, wobei vorzeichenbehaftete Differenzen gezählt werden (a₃−a₂ > a₂−a₁): 1-2-4 und 9-5-3 sind erlaubt, 4-3-1 nicht. Die Linie darf auch diagonal verlaufen; zwei aufeinanderfolgende Felder dürfen nur dann dieselbe Ziffer enthalten, wenn sie keine Zeile, Spalte und keinen Block teilen."],["Lépcsők","Az előjeles különbségek tovább nőnek.","A klasszikus szabályokon túl egy lépcsős vonalon (a nyíl mutatja az irányt) a szomszédos számjegyek különbsége lépésről lépésre nő, előjeles különbségeket számolva (a₃−a₂ > a₂−a₁): az 1-2-4 és a 9-5-3 megengedett, a 4-3-1 nem. A vonal haladhat átlósan is; két egymást követő cella csak akkor tartalmazhatja ugyanazt a számjegyet, ha nincs közös soruk, oszlopuk és blokkjuk."]],"progression":[["Progression arithmétique","Différence constante.","En plus des règles classiques, sur une ligne en progression arithmétique la différence entre chiffres voisins est la même tout le long de la ligne (croissante ou décroissante). La ligne peut aussi passer en diagonale ; deux cases consécutives ne peuvent contenir le même chiffre que si elles ne partagent ni ligne, ni colonne, ni bloc."],["Progressione aritmetica","Differenza costante.","Oltre alle regole classiche, su una linea a progressione aritmetica la differenza tra cifre vicine è la stessa lungo tutta la linea (crescente o decrescente). La linea può passare anche in diagonale; due celle consecutive possono contenere la stessa cifra solo se non condividono riga, colonna né riquadro."],["Progresión aritmética","Diferencia constante.","Además de las reglas clásicas, en una línea de progresión aritmética la diferencia entre dígitos vecinos es la misma a lo largo de toda la línea (creciente o decreciente). La línea también puede ir en diagonal; dos celdas consecutivas solo pueden contener el mismo dígito si no comparten fila, columna ni caja."],["Progressão aritmética","Diferença constante.","Além das regras clássicas, numa linha de progressão aritmética a diferença entre algarismos vizinhos é a mesma ao longo de toda a linha (crescente ou decrescente). A linha também pode seguir na diagonal; duas células consecutivas só podem conter o mesmo algarismo se não partilharem linha, coluna nem caixa."],["Arithmetische Folge","Konstante Differenz.","Zusätzlich zu den klassischen Regeln ist auf einer Linie mit arithmetischer Folge die Differenz zwischen benachbarten Ziffern entlang der ganzen Linie gleich (steigend oder fallend). Die Linie darf auch diagonal verlaufen; zwei aufeinanderfolgende Felder dürfen nur dann dieselbe Ziffer enthalten, wenn sie keine Zeile, Spalte und keinen Block teilen."],["Számtani sorozat","Állandó különbség.","A klasszikus szabályokon túl egy számtani sorozat vonalon a szomszédos számjegyek különbsége az egész vonal mentén ugyanaz (növekvő vagy csökkenő). A vonal haladhat átlósan is; két egymást követő cella csak akkor tartalmazhatja ugyanazt a számjegyet, ha nincs közös soruk, oszlopuk és blokkjuk."]],"echo":[["Ligne d’écho","Le chiffre se répète toutes les trois cases.","En plus des règles classiques, sur une ligne d’écho la case en position i et la case en position i+3 contiennent le même chiffre (le motif se répète toutes les trois cases). La ligne peut aussi passer en diagonale ; deux cases consécutives ne peuvent contenir le même chiffre que si elles ne partagent ni ligne, ni colonne, ni bloc."],["Linea eco","La cifra si ripete ogni tre celle.","Oltre alle regole classiche, su una linea eco la cella in posizione i e la cella in posizione i+3 contengono la stessa cifra (lo schema si ripete ogni tre celle). La linea può passare anche in diagonale; due celle consecutive possono contenere la stessa cifra solo se non condividono riga, colonna né riquadro."],["Línea de eco","El dígito se repite cada tres celdas.","Además de las reglas clásicas, en una línea de eco la celda en la posición i y la celda en la posición i+3 contienen el mismo dígito (el patrón se repite cada tres celdas). La línea también puede ir en diagonal; dos celdas consecutivas solo pueden contener el mismo dígito si no comparten fila, columna ni caja."],["Linha de eco","O algarismo repete-se de três em três células.","Além das regras clássicas, numa linha de eco a célula na posição i e a célula na posição i+3 contêm o mesmo algarismo (o padrão repete-se de três em três células). A linha também pode seguir na diagonal; duas células consecutivas só podem conter o mesmo algarismo se não partilharem linha, coluna nem caixa."],["Echolinie","Die Ziffer wiederholt sich alle drei Felder.","Zusätzlich zu den klassischen Regeln enthalten auf einer Echolinie das Feld an Position i und das Feld an Position i+3 dieselbe Ziffer (das Muster wiederholt sich alle drei Felder). Die Linie darf auch diagonal verlaufen; zwei aufeinanderfolgende Felder dürfen nur dann dieselbe Ziffer enthalten, wenn sie keine Zeile, Spalte und keinen Block teilen."],["Visszhangvonal","A számjegy három cellánként ismétlődik.","A klasszikus szabályokon túl egy visszhangvonalon az i. pozíciójú és az i+3. pozíciójú cella ugyanazt a számjegyet tartalmazza (a minta három cellánként ismétlődik). A vonal haladhat átlósan is; két egymást követő cella csak akkor tartalmazhatja ugyanazt a számjegyet, ha nincs közös soruk, oszlopuk és blokkjuk."]],"divisible":[["Ligne divisible","Le nombre lu est divisible par m.","En plus des règles classiques, les chiffres de la ligne, lus dans le sens de la flèche, forment un nombre divisible par m (m est indiqué à côté de la ligne, p. ex. ÷7). 9×9 uniquement."],["Linea divisibile","Il numero letto è divisibile per m.","Oltre alle regole classiche, le cifre sulla linea, lette nella direzione della freccia, formano un numero divisibile per m (m è indicato accanto alla linea, ad es. ÷7). Solo 9×9."],["Línea divisible","El número leído es divisible por m.","Además de las reglas clásicas, los dígitos de la línea, leídos en el sentido de la flecha, forman un número divisible por m (m se muestra junto a la línea, p. ej. ÷7). Solo 9×9."],["Linha divisível","O número lido é divisível por m.","Além das regras clássicas, os algarismos da linha, lidos no sentido da seta, formam um número divisível por m (m é mostrado junto à linha, p. ex. ÷7). Só 9×9."],["Teilbare Linie","Die gelesene Zahl ist durch m teilbar.","Zusätzlich zu den klassischen Regeln bilden die Ziffern auf der Linie, in Pfeilrichtung gelesen, eine durch m teilbare Zahl (m steht neben der Linie, z. B. ÷7). Nur 9×9."],["Osztható vonal","Az olvasott szám osztható m-mel.","A klasszikus szabályokon túl a vonalon lévő számjegyek, a nyíl irányában olvasva, m-mel osztható számot alkotnak (m a vonal mellett van feltüntetve, pl. ÷7). Csak 9×9."]],"primeline":[["Ligne de nombres premiers","Seulement des chiffres premiers.","En plus des règles classiques, toutes les cases d’une ligne de nombres premiers contiennent des chiffres premiers (2, 3, 5, 7 ; en 6×6 : 2, 3, 5). La ligne peut aussi passer en diagonale ; deux cases consécutives ne peuvent contenir le même chiffre que si elles ne partagent ni ligne, ni colonne, ni bloc."],["Linea di numeri primi","Solo cifre prime.","Oltre alle regole classiche, tutte le celle di una linea di numeri primi contengono cifre prime (2, 3, 5, 7; nel 6×6: 2, 3, 5). La linea può passare anche in diagonale; due celle consecutive possono contenere la stessa cifra solo se non condividono riga, colonna né riquadro."],["Línea de primos","Solo dígitos primos.","Además de las reglas clásicas, todas las celdas de una línea de primos contienen dígitos primos (2, 3, 5, 7; en 6×6: 2, 3, 5). La línea también puede ir en diagonal; dos celdas consecutivas solo pueden contener el mismo dígito si no comparten fila, columna ni caja."],["Linha de primos","Só algarismos primos.","Além das regras clássicas, todas as células de uma linha de primos contêm algarismos primos (2, 3, 5, 7; em 6×6: 2, 3, 5). A linha também pode seguir na diagonal; duas células consecutivas só podem conter o mesmo algarismo se não partilharem linha, coluna nem caixa."],["Primzahllinie","Nur Primziffern.","Zusätzlich zu den klassischen Regeln enthalten alle Felder einer Primlinie Primziffern (2, 3, 5, 7; bei 6×6: 2, 3, 5). Die Linie darf auch diagonal verlaufen; zwei aufeinanderfolgende Felder dürfen nur dann dieselbe Ziffer enthalten, wenn sie keine Zeile, Spalte und keinen Block teilen."],["Prímvonal","Csak prímszámjegyek.","A klasszikus szabályokon túl egy prímvonal minden cellája prímszámjegyet tartalmaz (2, 3, 5, 7; 6×6-on: 2, 3, 5). A vonal haladhat átlósan is; két egymást követő cella csak akkor tartalmazhatja ugyanazt a számjegyet, ha nincs közös soruk, oszlopuk és blokkjuk."]],"sohei":[["Sohei (anneau de quatre)","Quatre grilles 9×9 reliées en anneau losange.","Quatre grilles 9×9 sont disposées en losange (haut, droite, bas, gauche) ; deux grilles voisines partagent un bloc 3×3 (quatre blocs partagés en tout) et un trou subsiste au milieu. Chaque ligne, colonne et bloc contient une fois chaque chiffre ; les chiffres des blocs partagés comptent pour les deux grilles. La géométrie est une convention choisie ici ; les sources diffèrent."],["Sohei (anello di quattro)","Quattro griglie 9×9 unite in un anello a rombo.","Quattro griglie 9×9 sono disposte a rombo (alto, destra, basso, sinistra); ogni due griglie vicine condividono un riquadro 3×3 (quattro riquadri condivisi in tutto) e al centro resta un buco. Ogni riga, colonna e riquadro contiene ogni cifra una volta; le cifre nei riquadri condivisi contano per entrambe le griglie. La geometria è una convenzione scelta qui; le fonti differiscono."],["Sohei (anillo de cuatro)","Cuatro cuadrículas 9×9 unidas en un anillo de rombo.","Cuatro cuadrículas 9×9 se colocan en rombo (arriba, derecha, abajo, izquierda); cada dos cuadrículas vecinas comparten una caja 3×3 (cuatro cajas compartidas en total) y queda un hueco en el medio. Cada fila, columna y caja contiene cada dígito una vez; los dígitos de las cajas compartidas cuentan para ambas cuadrículas. La geometría es una convención elegida aquí; las fuentes difieren."],["Sohei (anel de quatro)","Quatro grelhas 9×9 ligadas num anel em losango.","Quatro grelhas 9×9 são colocadas em losango (cima, direita, baixo, esquerda); cada duas grelhas vizinhas partilham uma caixa 3×3 (quatro caixas partilhadas ao todo) e fica um buraco no meio. Cada linha, coluna e caixa contém cada algarismo uma vez; os algarismos das caixas partilhadas contam para ambas as grelhas. A geometria é uma convenção escolhida aqui; as fontes diferem."],["Sohei (Vierer-Ring)","Vier 9×9-Gitter in einem Rautenring verbunden.","Vier 9×9-Gitter sind rautenförmig angeordnet (oben, rechts, unten, links); je zwei benachbarte Gitter teilen sich einen 3×3-Block (insgesamt vier gemeinsame Blöcke), und in der Mitte bleibt ein Loch. Jede Zeile, Spalte und jeder Block enthält jede Ziffer einmal; Ziffern in gemeinsamen Blöcken zählen für beide Gitter. Die Geometrie ist eine hier gewählte Konvention; die Quellen weichen voneinander ab."],["Sohei (négyes gyűrű)","Négy 9×9-es rács rombusz alakú gyűrűben összekapcsolva.","Négy 9×9-es rács rombuszban helyezkedik el (fent, jobbra, lent, balra); minden két szomszédos rács egy 3×3-as blokkon osztozik (összesen négy közös blokk), és középen egy lyuk marad. Minden sor, oszlop és blokk egyszer tartalmazza az összes számjegyet; a közös blokkok számjegyei mindkét rácsra számítanak. A geometria az itt választott megállapodás; a források eltérnek."]],"kazaguruma":[["Kazaguruma (moulin à vent)","Un centre plus quatre bras, chacun chevauchant deux blocs.","Une grille 9×9 centrale et quatre bras 9×9 en forme de moulin à vent ; chaque bras chevauche le centre sur deux blocs voisins (18 cases). Chaque ligne, colonne et bloc contient une fois chaque chiffre. La géométrie est une convention choisie ici ; les sources diffèrent."],["Kazaguruma (mulino a vento)","Centro più quattro bracci, ciascuno sovrapposto a due riquadri.","Una griglia 9×9 centrale e quattro bracci 9×9 a forma di mulino a vento; ogni braccio si sovrappone al centro su due riquadri vicini (18 celle). Ogni riga, colonna e riquadro contiene ogni cifra una volta. La geometria è una convenzione scelta qui; le fonti differiscono."],["Kazaguruma (molino de viento)","Centro más cuatro brazos, cada uno solapando dos cajas.","Una cuadrícula 9×9 central y cuatro brazos 9×9 en forma de molino de viento; cada brazo solapa con el centro en dos cajas vecinas (18 celdas). Cada fila, columna y caja contiene cada dígito una vez. La geometría es una convención elegida aquí; las fuentes difieren."],["Kazaguruma (moinho de vento)","Centro mais quatro braços, cada um a sobrepor duas caixas.","Uma grelha 9×9 central e quatro braços 9×9 em forma de moinho de vento; cada braço sobrepõe-se ao centro em duas caixas vizinhas (18 células). Cada linha, coluna e caixa contém cada algarismo uma vez. A geometria é uma convenção escolhida aqui; as fontes diferem."],["Kazaguruma (Windmühle)","Mitte plus vier Arme, die jeweils zwei Blöcke überlappen.","Ein zentrales 9×9-Gitter und vier 9×9-Arme in Windmühlenform; jeder Arm überlappt die Mitte in zwei benachbarten Blöcken (18 Felder). Jede Zeile, Spalte und jeder Block enthält jede Ziffer einmal. Die Geometrie ist eine hier gewählte Konvention; die Quellen weichen voneinander ab."],["Kazaguruma (szélmalom)","Közép plusz négy kar, mindegyik két blokkot fed át.","Egy központi 9×9-es rács és négy 9×9-es kar szélmalom alakban; minden kar két szomszédos blokkon fedi át a közepet (18 cella). Minden sor, oszlop és blokk egyszer tartalmazza az összes számjegyet. A geometria az itt választott megállapodás; a források eltérnek."]],"tripledoku":[["Tripledoku (V)","Trois grilles en forme de V.","Trois grilles 9×9 disposées en V : en haut à gauche, au milieu en bas et en haut à droite ; la grille du milieu partage un bloc avec chacune des deux autres. La même idée que Gattai-3, mais avec une autre géométrie (un V au lieu d’une diagonale)."],["Tripledoku (V)","Tre griglie a forma di V.","Tre griglie 9×9 disposte a V: in alto a sinistra, al centro in basso e in alto a destra; la griglia centrale condivide un riquadro con ciascuna delle altre due. La stessa idea del Gattai-3, ma con un’altra geometria (una V invece di una diagonale)."],["Tripledoku (V)","Tres cuadrículas en forma de V.","Tres cuadrículas 9×9 colocadas en V: arriba a la izquierda, abajo en el centro y arriba a la derecha; la cuadrícula del medio comparte una caja con cada una de las otras dos. La misma idea que el Gattai-3, pero con otra geometría (una V en lugar de una diagonal)."],["Tripledoku (V)","Três grelhas em forma de V.","Três grelhas 9×9 colocadas em V: em cima à esquerda, ao centro em baixo e em cima à direita; a grelha do meio partilha uma caixa com cada uma das outras duas. A mesma ideia do Gattai-3, mas com outra geometria (um V em vez de uma diagonal)."],["Tripledoku (V)","Drei Gitter in V-Form.","Drei 9×9-Gitter, in einem V angeordnet: oben links, unten Mitte und oben rechts; das mittlere Gitter teilt sich mit jedem der beiden anderen einen Block. Dieselbe Idee wie Gattai-3, aber mit anderer Geometrie (ein V statt einer Diagonale)."],["Tripledoku (V)","Három rács V alakban.","Három 9×9-es rács V alakban elhelyezve: bal felül, alul középen és jobb felül; a középső rács mindkét másikkal egy blokkot oszt meg. Ugyanaz az ötlet, mint a Gattai-3-nál, de más geometriával (V az átló helyett)."]],"cross":[["Croix","Un centre plus quatre bras, chacun chevauchant une bande entière.","Une grille 9×9 centrale et quatre bras (haut, gauche, droite, bas) ; chaque bras chevauche le centre sur une bande entière de trois blocs (27 cases), et certains blocs appartiennent à trois grilles. Chaque ligne, colonne et bloc contient une fois chaque chiffre. La géométrie est une convention choisie ici."],["Croce","Centro più quattro bracci, ciascuno sovrapposto a una fascia intera.","Una griglia 9×9 centrale e quattro bracci (alto, sinistra, destra, basso); ogni braccio si sovrappone al centro su un’intera fascia di tre riquadri (27 celle), e alcuni riquadri appartengono a tre griglie. Ogni riga, colonna e riquadro contiene ogni cifra una volta. La geometria è una convenzione scelta qui."],["Cruz","Centro más cuatro brazos, cada uno solapando una banda entera.","Una cuadrícula 9×9 central y cuatro brazos (arriba, izquierda, derecha, abajo); cada brazo solapa con el centro en una banda completa de tres cajas (27 celdas), y algunas cajas pertenecen a tres cuadrículas. Cada fila, columna y caja contiene cada dígito una vez. La geometría es una convención elegida aquí."],["Cruz","Centro mais quatro braços, cada um a sobrepor uma faixa inteira.","Uma grelha 9×9 central e quatro braços (cima, esquerda, direita, baixo); cada braço sobrepõe-se ao centro numa faixa completa de três caixas (27 células), e algumas caixas pertencem a três grelhas. Cada linha, coluna e caixa contém cada algarismo uma vez. A geometria é uma convenção escolhida aqui."],["Kreuz","Mitte plus vier Arme, die jeweils einen ganzen Streifen überlappen.","Ein zentrales 9×9-Gitter und vier Arme (oben, links, rechts, unten); jeder Arm überlappt die Mitte in einem ganzen Streifen aus drei Blöcken (27 Felder), und manche Blöcke gehören zu drei Gittern. Jede Zeile, Spalte und jeder Block enthält jede Ziffer einmal. Die Geometrie ist eine hier gewählte Konvention."],["Kereszt","Közép plusz négy kar, mindegyik egy egész sávot fed át.","Egy központi 9×9-es rács és négy kar (fent, balra, jobbra, lent); minden kar három blokkból álló teljes sávon (27 cella) fedi át a közepet, és egyes blokkok három rácshoz tartoznak. Minden sor, oszlop és blokk egyszer tartalmazza az összes számjegyet. A geometria az itt választott megállapodás."]],"cube3":[["Cube latin 3D","Chaque ligne du cube contient une fois chaque chiffre.","Le cube N×N×N est déplié en N couches placées côte à côte (séparées par un espace). Chaque ligne dans chacune des trois directions — ligne dans une couche, colonne dans une couche, et « en profondeur » (la même position dans toutes les couches) — contient une fois chaque chiffre. Tailles 4, 5, 6. Le cube est très rigide : en « Difficile », il reste peu de chiffres donnés. La vue est par couches ; vous pouvez passer à la « Vue 3D » (faites glisser pour faire tourner le cube, le curseur masque les couches avant ; cliquez pour sélectionner des cases)."],["Cubo latino 3D","Ogni linea del cubo contiene ogni cifra una volta.","Il cubo N×N×N è spiegato in N strati affiancati (separati da uno spazio). Ogni linea nelle tre direzioni — riga in uno strato, colonna in uno strato, e «in profondità» (la stessa posizione in tutti gli strati) — contiene ogni cifra una volta. Dimensioni 4, 5, 6. Il cubo è molto rigido: in «Difficile» restano poche cifre date. La vista è a strati; puoi passare alla «Vista 3D» (trascina per ruotare il cubo, il cursore nasconde gli strati anteriori; clicca per selezionare le celle)."],["Cubo latino 3D","Cada línea del cubo contiene cada dígito una vez.","El cubo N×N×N se despliega en N capas colocadas una al lado de otra (separadas por un hueco). Cada línea en cada una de las tres direcciones — fila en una capa, columna en una capa y «en profundidad» (la misma posición en todas las capas) — contiene cada dígito una vez. Tamaños 4, 5, 6. El cubo es muy rígido: en «Difícil» quedan pocos dígitos dados. La vista es por capas; puedes cambiar a la «Vista 3D» (arrastra para girar el cubo, el deslizador oculta las capas frontales; haz clic para seleccionar celdas)."],["Cubo latino 3D","Cada linha do cubo contém cada algarismo uma vez.","O cubo N×N×N é desdobrado em N camadas colocadas lado a lado (separadas por um intervalo). Cada linha em cada uma das três direções — linha numa camada, coluna numa camada e «em profundidade» (a mesma posição em todas as camadas) — contém cada algarismo uma vez. Tamanhos 4, 5, 6. O cubo é muito rígido: em «Difícil» ficam poucos algarismos dados. A vista é por camadas; pode passar para a «Vista 3D» (arraste para rodar o cubo, o cursor esconde as camadas da frente; clique para selecionar células)."],["Lateinischer Würfel 3D","Jede Linie des Würfels enthält jede Ziffer einmal.","Der N×N×N-Würfel ist in N nebeneinander angeordnete Schichten abgewickelt (durch eine Lücke getrennt). Jede Linie in jeder der drei Richtungen — Zeile in einer Schicht, Spalte in einer Schicht und „in die Tiefe“ (dieselbe Position in allen Schichten) — enthält jede Ziffer einmal. Größen 4, 5, 6. Der Würfel ist sehr starr: Bei „Schwer“ bleiben wenige Vorgaben. Die Ansicht ist schichtweise; Sie können zur „3D-Ansicht“ wechseln (ziehen, um den Würfel zu drehen; der Schieberegler blendet die vorderen Schichten aus; klicken, um Felder auszuwählen)."],["3D latin kocka","A kocka minden vonala egyszer tartalmazza az összes számjegyet.","Az N×N×N-es kocka N egymás mellé helyezett rétegre van kiterítve (közöttük hézaggal). Minden vonal mindhárom irányban — sor egy rétegen belül, oszlop egy rétegen belül, és „mélységben” (ugyanaz a pozíció minden rétegben) — egyszer tartalmazza az összes számjegyet. Méretek: 4, 5, 6. A kocka nagyon merev: „Nehéz” szinten kevés adott számjegy marad. A nézet rétegenkénti; átválthatsz „3D nézetre” (húzással forgathatod a kockát, a csúszka elrejti az elülső rétegeket; kattintással cellákat jelölhetsz ki)."]],"cubebox":[["Cube avec blocs 2×2","Cube latin 4×4×4 avec des blocs 2×2 dans chaque couche.","Comme pour le Cube latin 3D (4×4×4), mais chaque couche comporte en plus quatre blocs 2×2 (contours épais) contenant chacun une fois chaque chiffre : chaque couche est donc un sudoku 4×4, et les lignes « en profondeur » contiennent aussi une fois chaque chiffre. 4×4×4 uniquement."],["Cubo con riquadri 2×2","Cubo latino 4×4×4 con riquadri 2×2 in ogni strato.","Come nel Cubo latino 3D (4×4×4), ma ogni strato ha in più quattro riquadri 2×2 (contorni spessi) che contengono ciascuno ogni cifra una volta: ogni strato è quindi un sudoku 4×4, e anche le linee «in profondità» contengono ogni cifra una volta. Solo 4×4×4."],["Cubo con cajas 2×2","Cubo latino 4×4×4 con cajas 2×2 en cada capa.","Como en el Cubo latino 3D (4×4×4), pero cada capa tiene además cuatro cajas 2×2 (contornos gruesos) que contienen cada una cada dígito una vez: cada capa es, por tanto, un sudoku 4×4, y las líneas «en profundidad» también contienen cada dígito una vez. Solo 4×4×4."],["Cubo com caixas 2×2","Cubo latino 4×4×4 com caixas 2×2 em cada camada.","Como no Cubo latino 3D (4×4×4), mas cada camada tem além disso quatro caixas 2×2 (contornos grossos) que contêm cada uma cada algarismo uma vez: cada camada é, portanto, um sudoku 4×4, e as linhas «em profundidade» também contêm cada algarismo uma vez. Só 4×4×4."],["Würfel mit 2×2-Blöcken","Lateinischer 4×4×4-Würfel mit 2×2-Blöcken in jeder Schicht.","Wie beim Lateinischen Würfel 3D (4×4×4), aber jede Schicht hat zusätzlich vier 2×2-Blöcke (dicke Umrandung), die jeweils jede Ziffer einmal enthalten: Jede Schicht ist also ein 4×4-Sudoku, und auch die Linien „in die Tiefe“ enthalten jede Ziffer einmal. Nur 4×4×4."],["Kocka 2×2-es blokkokkal","4×4×4-es latin kocka 2×2-es blokkokkal minden rétegben.","Mint a 3D latin kockánál (4×4×4), de minden rétegben ráadásul négy 2×2-es blokk (vastag körvonallal) van, amelyek mindegyike egyszer tartalmazza az összes számjegyet: így minden réteg egy 4×4-es sudoku, és a „mélységi” vonalak is egyszer tartalmazzák az összes számjegyet. Csak 4×4×4."]],"hyper4":[["Hypercube 4D","Sudoku en quatre dimensions.","L’hypercube N×N×N×N est déplié en une mosaïque N×N de couches N×N (les deux premières coordonnées choisissent la couche : ligne de couches et colonne de couches). Chaque ligne selon l’un quelconque des quatre axes contient une fois chaque chiffre. Tailles 3 (81 cases) et 4 (256 cases). Très rigide : peu de chiffres donnés."],["Ipercubo 4D","Sudoku in quattro dimensioni.","L’ipercubo N×N×N×N è spiegato come un mosaico N×N di strati N×N (le prime due coordinate scelgono lo strato: riga di strati e colonna di strati). Ogni linea lungo uno qualsiasi dei quattro assi contiene ogni cifra una volta. Dimensioni 3 (81 celle) e 4 (256 celle). Molto rigido: poche cifre date."],["Hipercubo 4D","Sudoku en cuatro dimensiones.","El hipercubo N×N×N×N se despliega como un mosaico N×N de capas N×N (las dos primeras coordenadas eligen la capa: fila de capas y columna de capas). Cada línea a lo largo de cualquiera de los cuatro ejes contiene cada dígito una vez. Tamaños 3 (81 celdas) y 4 (256 celdas). Muy rígido: pocos dígitos dados."],["Hipercubo 4D","Sudoku em quatro dimensões.","O hipercubo N×N×N×N é desdobrado como um mosaico N×N de camadas N×N (as duas primeiras coordenadas escolhem a camada: linha de camadas e coluna de camadas). Cada linha ao longo de qualquer um dos quatro eixos contém cada algarismo uma vez. Tamanhos 3 (81 células) e 4 (256 células). Muito rígido: poucos algarismos dados."],["Hyperwürfel 4D","Sudoku in vier Dimensionen.","Der N×N×N×N-Hyperwürfel ist als N×N-Mosaik aus N×N-Schichten abgewickelt (die ersten beiden Koordinaten wählen die Schicht: Schichtzeile und Schichtspalte). Jede Linie entlang einer der vier Achsen enthält jede Ziffer einmal. Größen 3 (81 Felder) und 4 (256 Felder). Sehr starr: wenige Vorgaben."],["4D hiperkocka","Sudoku négy dimenzióban.","Az N×N×N×N-es hiperkocka N×N-es rétegekből álló N×N-es mozaikként van kiterítve (az első két koordináta választja ki a réteget: rétegsor és rétegoszlop). Mind a négy tengely menti minden vonal egyszer tartalmazza az összes számjegyet. Méretek: 3 (81 cella) és 4 (256 cella). Nagyon merev: kevés adott számjegy."]],"hyper5":[["Hypercube 5D","Sudoku en cinq dimensions (3⁵ = 243 cases).","L’hypercube 3×3×3×3×3 est déplié en trois mosaïques 3×3 de couches 3×3 placées côte à côte. Chaque ligne selon l’un quelconque des cinq axes contient une fois chaque chiffre. Très rigide : seulement quelques chiffres donnés ; la planche est large, donc les cases sont petites sur les écrans étroits."],["Ipercubo 5D","Sudoku in cinque dimensioni (3⁵ = 243 celle).","L’ipercubo 3×3×3×3×3 è spiegato in tre mosaici 3×3 di strati 3×3 affiancati. Ogni linea lungo uno qualsiasi dei cinque assi contiene ogni cifra una volta. Molto rigido: solo poche cifre date; la tavola è larga, quindi le celle sono piccole sugli schermi stretti."],["Hipercubo 5D","Sudoku en cinco dimensiones (3⁵ = 243 celdas).","El hipercubo 3×3×3×3×3 se despliega en tres mosaicos 3×3 de capas 3×3 colocados uno al lado de otro. Cada línea a lo largo de cualquiera de los cinco ejes contiene cada dígito una vez. Muy rígido: solo unos pocos dígitos dados; el tablero es ancho, así que las celdas son pequeñas en pantallas estrechas."],["Hipercubo 5D","Sudoku em cinco dimensões (3⁵ = 243 células).","O hipercubo 3×3×3×3×3 é desdobrado em três mosaicos 3×3 de camadas 3×3 colocados lado a lado. Cada linha ao longo de qualquer um dos cinco eixos contém cada algarismo uma vez. Muito rígido: apenas alguns algarismos dados; o tabuleiro é largo, por isso as células são pequenas em ecrãs estreitos."],["Hyperwürfel 5D","Sudoku in fünf Dimensionen (3⁵ = 243 Felder).","Der 3×3×3×3×3-Hyperwürfel ist in drei nebeneinander angeordnete 3×3-Mosaike aus 3×3-Schichten abgewickelt. Jede Linie entlang einer der fünf Achsen enthält jede Ziffer einmal. Sehr starr: nur wenige Vorgaben; das Brett ist breit, daher sind die Felder auf schmalen Bildschirmen klein."],["5D hiperkocka","Sudoku öt dimenzióban (3⁵ = 243 cella).","A 3×3×3×3×3-as hiperkocka három egymás mellé helyezett, 3×3-as rétegekből álló 3×3-as mozaikra van kiterítve. Mind az öt tengely menti minden vonal egyszer tartalmazza az összes számjegyet. Nagyon merev: csak néhány adott számjegy; a tábla széles, ezért a cellák kicsik keskeny képernyőn."]],"greco":[["Gréco-latin (carrés orthogonaux)","Deux carrés latins superposés : chaque paire chiffre–lettre apparaît une fois.","Deux carrés N×N côte à côte : celui de gauche avec des chiffres, celui de droite avec des lettres (A, B, C… ; lors de la saisie, la touche « 1/A » signifie le chiffre 1 à gauche ou la lettre A à droite). Dans chaque carré, chaque ligne et chaque colonne contient une fois chaque symbole. De plus, les deux carrés sont orthogonaux : en regardant la même position dans les deux carrés, la paire (chiffre, lettre) est différente dans les N² positions — chaque paire possible apparaît exactement une fois. Tailles 3, 4, 5, 7 (pour 6, une telle paire n’existe pas ; 8 et 9 sont écartées pour la rapidité). En 7×7 « Difficile », la génération peut prendre environ 10–15 s."],["Greco-latino (quadrati ortogonali)","Due quadrati latini sovrapposti: ogni coppia cifra–lettera compare una volta.","Due quadrati N×N affiancati: quello a sinistra con cifre, quello a destra con lettere (A, B, C…; durante l’inserimento, il tasto «1/A» significa cifra 1 a sinistra o lettera A a destra). In ciascun quadrato ogni riga e colonna contiene ogni simbolo una volta. Inoltre i due quadrati sono ortogonali: guardando la stessa posizione in entrambi i quadrati, la coppia (cifra, lettera) è diversa in tutte le N² posizioni — ogni coppia possibile compare esattamente una volta. Dimensioni 3, 4, 5, 7 (per 6 una tale coppia non esiste; 8 e 9 sono escluse per velocità). Nel 7×7 «Difficile» la generazione può richiedere circa 10–15 s."],["Grecolatino (cuadrados ortogonales)","Dos cuadrados latinos superpuestos: cada pareja dígito–letra aparece una vez.","Dos cuadrados N×N uno al lado del otro: el de la izquierda con dígitos, el de la derecha con letras (A, B, C…; al rellenar, la tecla «1/A» significa dígito 1 a la izquierda o letra A a la derecha). En cada cuadrado, cada fila y columna contiene cada símbolo una vez. Además, los dos cuadrados son ortogonales: al mirar la misma posición en ambos cuadrados, la pareja (dígito, letra) es distinta en las N² posiciones — cada pareja posible aparece exactamente una vez. Tamaños 3, 4, 5, 7 (para 6 no existe tal pareja; 8 y 9 se omiten por rapidez). En 7×7 «Difícil», la generación puede tardar unos 10–15 s."],["Greco-latino (quadrados ortogonais)","Dois quadrados latinos sobrepostos: cada par algarismo–letra aparece uma vez.","Dois quadrados N×N lado a lado: o da esquerda com algarismos, o da direita com letras (A, B, C…; ao preencher, a tecla «1/A» significa algarismo 1 à esquerda ou letra A à direita). Em cada quadrado, cada linha e coluna contém cada símbolo uma vez. Além disso, os dois quadrados são ortogonais: olhando para a mesma posição nos dois quadrados, o par (algarismo, letra) é diferente nas N² posições — cada par possível aparece exatamente uma vez. Tamanhos 3, 4, 5, 7 (para 6 não existe tal par; 8 e 9 ficam de fora por rapidez). Em 7×7 «Difícil», a geração pode demorar cerca de 10–15 s."],["Griechisch-lateinisch (orthogonale Quadrate)","Zwei überlagerte lateinische Quadrate: Jedes Ziffer–Buchstabe-Paar kommt einmal vor.","Zwei N×N-Quadrate nebeneinander: links mit Ziffern, rechts mit Buchstaben (A, B, C …; beim Eintragen bedeutet die Taste „1/A“ Ziffer 1 links oder Buchstabe A rechts). In jedem Quadrat enthält jede Zeile und Spalte jedes Symbol einmal. Zusätzlich sind die beiden Quadrate orthogonal: Betrachtet man dieselbe Position in beiden Quadraten, ist das Paar (Ziffer, Buchstabe) an allen N² Positionen verschieden — jedes mögliche Paar kommt genau einmal vor. Größen 3, 4, 5, 7 (für 6 gibt es kein solches Paar; 8 und 9 sind der Geschwindigkeit halber weggelassen). Bei 7×7 „Schwer“ kann die Erzeugung etwa 10–15 s dauern."],["Görög-latin (ortogonális négyzetek)","Két egymásra helyezett latin négyzet: minden számjegy–betű pár egyszer fordul elő.","Két N×N-es négyzet egymás mellett: a bal oldali számjegyekkel, a jobb oldali betűkkel (A, B, C…; kitöltéskor az „1/A” billentyű az 1-es számjegyet jelenti balra vagy az A betűt jobbra). Mindkét négyzetben minden sor és oszlop egyszer tartalmazza az összes jelet. Ezen túl a két négyzet ortogonális: ha mindkét négyzetben ugyanazt a pozíciót nézzük, a (számjegy, betű) pár mind az N² pozícióban különböző — minden lehetséges pár pontosan egyszer fordul elő. Méretek: 3, 4, 5, 7 (6-ra nincs ilyen pár; a 8 és 9 a gyorsaság kedvéért kimaradt). 7×7-en „Nehéz” szinten a generálás körülbelül 10–15 másodpercig tarthat."]]};
var LEXX = [[["Candidat (note)","Un chiffre encore possible dans une case ; les notes s’écrivent en petit dans la case."],["Candidato (appunto)","Una cifra ancora possibile in una cella; gli appunti si scrivono in piccolo nella cella."],["Candidato (nota)","Un dígito todavía posible en una celda; las notas se escriben pequeñas en la celda."],["Candidato (nota)","Um algarismo ainda possível numa célula; as notas escrevem-se pequenas na célula."],["Kandidat (Notiz)","Eine Ziffer, die in einem Feld noch möglich ist; Notizen werden klein in das Feld geschrieben."],["Jelölt (jegyzet)","Egy cellában még lehetséges számjegy; a jegyzeteket kicsiben írjuk a cellába."]],[["Single nu","Une case dans laquelle il ne reste qu’un seul chiffre possible."],["Single nudo","Una cella in cui resta possibile una sola cifra."],["Single desnudo","Una celda en la que solo queda posible un dígito."],["Single nu","Uma célula em que só resta possível um algarismo."],["Naked Single","Ein Feld, in dem nur noch eine Ziffer möglich ist."],["Csupasz single","Egy cella, amelyben már csak egyetlen számjegy lehetséges."]],[["Single caché","Un chiffre qui ne peut plus se placer qu’à un seul endroit dans une ligne, une colonne ou une région."],["Single nascosto","Una cifra che può ancora stare in un solo posto all’interno di una riga, una colonna o una regione."],["Single oculto","Un dígito que todavía solo puede ir en un lugar dentro de una fila, una columna o una región."],["Single oculto","Um algarismo que ainda só pode ficar num único lugar dentro de uma linha, uma coluna ou uma região."],["Hidden Single","Eine Ziffer, die in einer Zeile, Spalte oder einem Gebiet nur noch an einer einzigen Stelle stehen kann."],["Rejtett single","Egy számjegy, amely egy sorban, oszlopban vagy tartományban már csak egyetlen helyre kerülhet."]],[["Bloc, bande, pile","Un bloc est le groupe de cases (par exemple 3×3) ; une bande est une rangée de blocs à l’horizontale, une pile une rangée à la verticale."],["Riquadro, fascia, pila","Il riquadro è il blocco di celle (per esempio 3×3); la fascia è una fila di riquadri in orizzontale, la pila una fila in verticale."],["Caja, banda, pila","La caja es el bloque de celdas (por ejemplo 3×3); la banda es una fila de cajas en horizontal, la pila una fila en vertical."],["Caixa, faixa, pilha","A caixa é o bloco de células (por exemplo 3×3); a faixa é uma fila de caixas na horizontal, a pilha uma fila na vertical."],["Block, Band, Stapel","Ein Block ist die Feldgruppe (zum Beispiel 3×3); ein Band ist eine waagrechte Reihe von Blöcken, ein Stapel eine senkrechte."],["Blokk, sáv, oszlopköteg","A blokk a cellák csoportja (például 3×3); a sáv a blokkok vízszintes sora, az oszlopköteg a függőleges."]],[["Chiffres donnés","Les chiffres remplis dès le départ. Ici, chaque puzzle a exactement une solution, et les chiffres donnés restants sont ceux dont on a besoin."],["Cifre date","Le cifre inserite fin dall’inizio. Qui ogni puzzle ha esattamente una soluzione, e le cifre date rimaste sono quelle necessarie."],["Dígitos dados","Los dígitos rellenados desde el principio. Aquí cada puzle tiene exactamente una solución, y los dígitos dados que quedan son los necesarios."],["Algarismos dados","Os algarismos preenchidos desde o início. Aqui cada puzzle tem exatamente uma solução, e os algarismos dados que restam são os necessários."],["Vorgaben (vorgegebene Ziffern)","Die von Anfang an eingetragenen Ziffern. Hier hat jedes Rätsel genau eine Lösung, und die verbleibenden Vorgaben sind die, die gebraucht werden."],["Adott számjegyek","A kezdettől kitöltött számjegyek. Itt minden rejtvénynek pontosan egy megoldása van, és a megmaradt adott számjegyek azok, amelyekre szükség van."]],[["Solution unique","Un bon puzzle n’a qu’une seule solution. Le générateur ne retire des chiffres donnés que tant que le résolveur démontre l’unicité."],["Soluzione unica","Un buon puzzle ha una sola soluzione. Il generatore toglie cifre date solo finché il risolutore dimostra l’unicità."],["Solución única","Un buen puzle tiene una sola solución. El generador quita dígitos dados solo mientras el resolutor demuestre la unicidad."],["Solução única","Um bom puzzle tem uma só solução. O gerador só retira algarismos dados enquanto o resolvedor demonstrar a unicidade."],["Eindeutige Lösung","Ein gutes Rätsel hat genau eine Lösung. Der Generator entfernt Vorgaben nur, solange der Löser die Eindeutigkeit beweist."],["Egyértelmű megoldás","Egy jó rejtvénynek egyetlen megoldása van. A generátor csak addig hagy el adott számjegyeket, amíg a megoldó bizonyítja az egyértelműséget."]],[["Carré latin","Une grille N×N dans laquelle chaque ligne et chaque colonne contient une fois chaque chiffre. Le sudoku classique est un carré latin avec une condition de plus : les blocs."],["Quadrato latino","Una griglia N×N in cui ogni riga e ogni colonna contiene ogni cifra una volta. Il sudoku classico è un quadrato latino con una condizione in più: i riquadri."],["Cuadrado latino","Una cuadrícula N×N en la que cada fila y cada columna contiene cada dígito una vez. El sudoku clásico es un cuadrado latino con una condición más: las cajas."],["Quadrado latino","Uma grelha N×N em que cada linha e cada coluna contém cada algarismo uma vez. O sudoku clássico é um quadrado latino com mais uma condição: as caixas."],["Lateinisches Quadrat","Ein N×N-Gitter, in dem jede Zeile und jede Spalte jede Ziffer einmal enthält. Das klassische Sudoku ist ein lateinisches Quadrat mit einer zusätzlichen Bedingung: den Blöcken."],["Latin négyzet","Egy N×N-es rács, amelyben minden sor és minden oszlop egyszer tartalmazza az összes számjegyet. A klasszikus sudoku egy latin négyzet még egy feltétellel: a blokkokkal."]],[["Number Place","La forme moderne du jeu est apparue en 1979 sous le nom « Number Place » ; le nom « Sudoku » vient du Japon."],["Number Place","La forma moderna del gioco è apparsa nel 1979 con il nome «Number Place»; il nome «Sudoku» viene dal Giappone."],["Number Place","La forma moderna del juego apareció en 1979 con el nombre «Number Place»; el nombre «Sudoku» viene de Japón."],["Number Place","A forma moderna do jogo apareceu em 1979 com o nome «Number Place»; o nome «Sudoku» vem do Japão."],["Number Place","Die moderne Form des Spiels erschien 1979 unter dem Namen „Number Place“; der Name „Sudoku“ stammt aus Japan."],["Number Place","A játék modern formája 1979-ben jelent meg „Number Place” néven; a „Sudoku” név Japánból származik."]]];

/* Sudoku fără frontiere — interfață. Fără rețea; stocare locală cu prefixul sudoku-fara-frontiere. (migrare din vechiul sff_). */
(function () {
'use strict';
var SFF = window.SFF;
