.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.25rem .7rem;cursor:pointer;font-size:.85rem}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:.8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.85rem;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:.35rem;text-align:left;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card h3{margin:0;font-size:1.02rem}
.card p{margin:0;color:var(--muted);font-size:.88rem}
.tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:auto;padding-top:.3rem}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:.05rem .4rem;color:var(--muted)}
.tag.cat{border-color:var(--accent);color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:9px;padding:.5rem .9rem;font-weight:700;cursor:pointer}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--fg);max-width:min(40rem,94vw);width:100%;padding:1.1rem;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,12,20,.55)}
dialog h2{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;font-size:.9rem;margin:.6rem 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.play{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
@media(min-width:900px){.play{grid-template-columns:minmax(0,1fr) 20rem;align-items:start}}
.boardwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.5rem;box-shadow:var(--shadow);position:relative}
svg#board{width:100%;height:auto;max-height:78vh;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-direction:column;gap:.7rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.75rem;box-shadow:var(--shadow)}
.box h3{margin:0 0 .5rem;font-size:.95rem}
.field{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;color:var(--muted);flex:1;min-width:6rem}
.field select,.field input[type=text],.field input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.4rem .5rem;color:var(--fg)}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem}
.numpad button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem 0;font-weight:700;font-size:1.05rem;cursor:pointer;min-height:2.6rem}
.numpad button.done{opacity:.35}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem}
.actions button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.45rem .2rem;cursor:pointer;font-size:.82rem}
.actions button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.msg{min-height:1.4rem;font-size:.9rem}
.msg.good{color:var(--accent);font-weight:700}
.msg.bad{color:#d92d20;font-weight:600}
.status{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding:.1rem .3rem .4rem}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.2rem .6rem;font-size:.88rem}
.checks label{display:flex;gap:.35rem;align-items:center}
.spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.6rem;background:color-mix(in srgb,var(--card) 88%,transparent);border-radius:var(--r);z-index:2;text-align:center;padding:1rem}
.spin[hidden]{display:none}
.loader{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
textarea.grid81{width:100%;min-height:8rem;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em}
table.sol{border-collapse:collapse;margin:.5rem 0}
table.sol td{width:2rem;height:2rem;text-align:center;border:1px solid var(--line);font-weight:700}
table.sol td.g{color:var(--given)}table.sol td.s{color:var(--user)}
table.sol tr:nth-child(3n) td{border-bottom:2px solid var(--thick)}
table.sol td:nth-child(3n){border-right:2px solid var(--thick)}
.small{font-size:.82rem;color:var(--muted)}
.lex{display:grid;gap:.6rem}
.lex div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.6rem .8rem}
.lex b{display:block}
footer{max-width:1100px;margin:1.5rem auto;padding:0 1rem 2rem;color:var(--muted);font-size:.82rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media print{
  header.top,nav,.panel,footer,.filters,.status{display:none!important}
  body{background:#fff;color:#000}
  .boardwrap{border:0;box-shadow:none}
  section[hidden]{display:none!important}
  .play{display:block}
}

svg#board text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg#board .dg{fill:var(--given);font-weight:700}
svg#board .du{fill:var(--user);font-weight:600}
svg#board .nt{fill:var(--note)}
svg#board .lbl{fill:var(--cage)}

[hidden]{display:none!important}
.field input#code,#code{min-width:11rem}

@media(max-width:700px){
  .bar{padding:.4rem .7rem;gap:.4rem}
  .brand{flex:1}
  nav.tabs{order:3;flex-basis:100%;justify-content:space-between}
  nav.tabs button{padding:.35rem .6rem;flex:1}
  main{padding:.7rem}
}
@media(max-width:899px){.panel>.box:nth-child(2){order:-1}}

.modebar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.1rem .3rem .4rem}
.modebar button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.2rem .6rem;cursor:pointer;font-size:.82rem}
.modebar .bar2{flex:1;min-width:6rem;height:.5rem;background:var(--line);border-radius:99px;overflow:hidden}
.modebar .bar2 i{display:block;height:100%;background:var(--accent)}
svg#board3d{width:100%;height:auto;max-height:78vh;display:block;touch-action:none;user-select:none;cursor:grab}
svg#board3d text{font-family:inherit;text-anchor:middle;dominant-baseline:central;pointer-events:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-contrast: more){:root{--thick:#000;--line:#333}[data-theme=dark]{--thick:#fff;--line:#ddd}}
#board:focus-visible{outline:3px solid var(--accent,#2563eb);outline-offset:2px}
.ibtn{font:inherit;color:inherit}select.ibtn{max-width:4.2rem;padding:.3rem .25rem}

h1.brand{margin:0}

/* ținte tactile ≥44px pe dispozitive cu cursor grosier (pointer:coarse); desktopul rămâne neschimbat */
@media (pointer:coarse){button:not(.cell):not([data-no-touch]),select,summary,[role=button],[role=tab],input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=hidden]):not([type=file]):not([type=color]),nav a,.navlink,.navbtn,#app-version[data-fff-label]{min-height:44px!important}button:not(.cell):not([data-no-touch]),[role=button],[role=tab],.navlink,.navbtn{min-width:44px!important}}

<body>
<header class="top"><div class="bar">
  <h1 class="brand">Sudoku fără frontiere <small id="app-version"></small></h1>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="atlas" id="t-atlas"></button>
    <button role="tab" data-tab="play" id="t-play"></button>
    <button role="tab" data-tab="solver" id="t-solver"></button>
    <button role="tab" data-tab="about" id="t-about"></button>
  </nav>
  <div class="tools">
    <select class="ibtn" id="b-lang" title="Limba / Language" aria-label="Limba / Language"></select>
    <button class="ibtn" id="b-theme" title="Temă / Theme">🌓</button>
    <button class="ibtn" id="b-size" title="Mărime text">A</button>
  </div>
</div></header>
<div id="sr" class="sr" role="status" aria-live="polite"></div>
<main>
  <section id="s-atlas" role="tabpanel">
    <h2 id="atlas-h"></h2>
    <p class="lead" id="atlas-lead"></p>
    <div class="filters">
      <input type="search" id="q" aria-label="Căutare">
      <select id="sortby"></select>
      <button class="chip" id="f-play" aria-pressed="false"></button>
      <button class="btn alt" id="b-today"></button>
      <button class="btn alt" id="b-rand"></button>
    </div>
    <div class="filters" id="cats"></div>
    <div class="grid" id="cards"></div>
    <div class="row" style="margin-top:1rem">
      <button class="btn alt" id="b-csv"></button>
      <button class="btn alt" id="b-bib"></button>
    </div>
    <h2 style="margin-top:1.6rem" id="lex-h"></h2>
    <div class="lex" id="lex"></div>
  </section>

  <section id="s-play" role="tabpanel" hidden>
    <div class="play">
      <div>
        <div class="status"><span id="st-name"></span><span id="st-info"></span><span id="st-time"></span></div>
        <div class="modebar small" id="modebar" hidden></div>
        <div class="boardwrap">
          <svg id="board" viewBox="0 0 10 10" role="grid" aria-label="Sudoku" tabindex="0"></svg>
          <svg id="board3d" viewBox="-100 -100 200 200" hidden aria-label="Sudoku 3D"></svg>
          <div id="v3dbar" class="modebar small" hidden><button id="v3d">3D</button><label>⟲ <input type="range" id="s3d" min="1" max="6" value="6"></label></div>
          <div class="spin" id="spin" hidden><div class="loader"></div><div id="spin-t"></div><button class="btn alt" id="b-cancel"></button></div>
        </div>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </div>
      <div class="panel">
        <div class="box">
          <h3 id="h-new"></h3>
          <div class="row">
            <label class="field"><span id="l-var"></span><select id="sel-var"></select></label>
            <label class="field"><span id="l-size"></span><select id="sel-size"></select></label>
            <label class="field"><span id="l-diff"></span><select id="sel-diff"></select></label>
            <label class="field"><span id="l-mode"></span><select id="sel-mode"></select></label>
          </div>
          <div id="custom" hidden style="margin-top:.6rem">
            <div class="small" id="custom-h"></div>
            <div class="checks" id="custom-mods"></div>
            <div class="small" style="margin-top:.4rem" id="custom-h2"></div>
            <div class="checks" id="custom-clues"></div>
          </div>
          <div class="field" id="wordbox" hidden style="margin-top:.6rem"><span id="l-word"></span><input type="text" id="word" maxlength="9" value="ECOULSTRI"></div>
          <div class="row" style="margin-top:.6rem">
            <button class="btn" id="b-new"></button>
            <button class="btn alt" id="b-print"></button>
          </div>
          <div class="row" style="margin-top:.6rem">
            <label class="field"><span id="l-code"></span><input type="text" id="code" spellcheck="false"></label>
            <button class="btn alt" id="b-copy" style="align-self:flex-end"></button>
            <button class="btn alt" id="b-open" style="align-self:flex-end"></button>
          </div>
        </div>
        <div class="box">
          <div class="numpad" id="numpad"></div>
          <div class="actions" style="margin-top:.5rem">
            <button id="a-note" aria-pressed="false"></button>
            <button id="a-erase"></button>
            <button id="a-undo"></button>
            <button id="a-redo"></button>
            <button id="a-hint"></button>
            <button id="a-step"></button>
            <button id="a-play" aria-pressed="false"></button>
            <button id="a-auto"></button>
            <button id="a-check"></button>
            <button id="a-solve"></button>
            <button id="a-clear"></button>
          </div>
        </div>
        <div class="box">
          <div class="checks">
            <label><input type="checkbox" id="o-conf" checked><span id="l-conf"></span></label>
            <label><input type="checkbox" id="o-same" checked><span id="l-same"></span></label>
            <label><input type="checkbox" id="o-peer" checked><span id="l-peer"></span></label>
            <label><input type="checkbox" id="o-clean" checked><span id="l-clean"></span></label>
          </div>
        </div>
        <div class="box small" id="rules"></div>
      </div>
    </div>
  </section>

  <section id="s-solver" role="tabpanel" hidden>
    <h2 id="sv-h"></h2>
    <p class="lead" id="sv-lead"></p>
    <textarea class="grid81" id="sv-in" spellcheck="false" placeholder="530070000600195000098000060800060003400803001700020006060000280000419005000080079"></textarea>
    <div class="checks" id="sv-mods" style="margin:.6rem 0"></div>
    <div class="row">
      <button class="btn" id="sv-go"></button>
      <button class="btn alt" id="sv-play" hidden></button>
      <button class="btn alt" id="sv-ex"></button>
    </div>
    <div class="msg" id="sv-msg" role="status" aria-live="polite"></div>
    <div id="sv-out"></div>
  </section>

  <section id="s-about" role="tabpanel" hidden>
    <h2 id="ab-h"></h2>
    <div id="ab-body"></div>
  </section>
</main>
<footer id="foot"></footer>
<dialog id="dlg"></dialog>
