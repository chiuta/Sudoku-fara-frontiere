name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: index.html corespunde sursei (build reproductibil)
        run: |
          python3 build.py
          git diff --exit-code index.html
      - name: Teste motor (aprox. 1,5 minute)
        run: node test.js
      - name: Fără resurse externe în index.html
        run: |
          if grep -nE "https?://|[\"'(= ]//[a-z]|fetch|XMLHttpRequest|WebSocket|sendBeacon|importScripts|@import" index.html | grep -v "http://www.w3.org/2000/svg" | grep -v "href=\"https://buymeacoffee.com/echo.of.the.strings\""; then echo "resursă externă găsită"; exit 1; fi
