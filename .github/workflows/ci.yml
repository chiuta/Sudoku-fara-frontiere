name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: index.html corespunde sursei (build reproductibil)
        run: |
          python3 build.py
          git diff --exit-code index.html
      - name: Teste motor (aprox. 1,5 minute)
        run: node test.js
      - name: Fără resurse externe în index.html
        run: |
          if grep -E "(src|href)=\"https?://|fetch\(|XMLHttpRequest|importScripts" index.html; then echo "resursă externă găsită"; exit 1; fi
